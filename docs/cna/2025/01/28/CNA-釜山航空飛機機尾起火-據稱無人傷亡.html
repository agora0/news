  <div class="post-content e-content" itemprop="articleBody">
    <div></div><div><p>（中央社記者廖禹揚首爾28日專電）韓國消防當局接獲通報，釜山航空一架停在金海機場的飛機機尾起火，消防當局已前往灌救，據稱無人傷亡。</p><p>韓聯社報導，這架原定飛往香港的班機在當地時間晚間10時30分許機尾起火，機上170多名乘客等都已緊急撤離，據稱無人傷亡。消防當局目前仍在灌救。（編輯：田瑞華）1140128</p>

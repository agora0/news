<meta name="description" content="圖為美國白宮。（中央社檔案照片） （中央社華盛頓4日綜合外電報導）美國白宮今天宣布，總統川普將把國防部更名為「戰爭部」（Department of War）。這位美國領袖曾多次建議更名，以樹立更強大的形象。白宮文件指出，由於國防部的官方名稱是由國會所制定，川普將簽署一項行政命令，允許這個規模龐大的部門使用「戰爭部」作為其「次要稱號」。（編譯：李佩珊）1140905" />

                      </picture><figcaption class='picinfo'>圖為美國白宮。（中央社檔案照片）</figcaption></figure></div><div></div><div><p>（中央社華盛頓4日綜合外電報導）美國白宮今天宣布，總統川普將把國防部更名為「戰爭部」（Department of War）。這位美國領袖曾多次建議更名，以樹立更強大的形象。</p><p>白宮文件指出，由於國防部的官方名稱是由國會所制定，川普將簽署一項行政命令，允許這個規模龐大的部門使用「戰爭部」作為其「次要稱號」。（編譯：李佩珊）1140905</p>

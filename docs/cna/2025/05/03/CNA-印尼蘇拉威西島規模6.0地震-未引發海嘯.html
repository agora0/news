    <h1 class="post-title p-name" itemprop="name headline">印尼蘇拉威西島規模6.0地震  未引發海嘯</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-05-03T23:34:03+08:00" itemprop="datePublished">May 3, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <div></div><div><p>（中央社雅加達3日綜合外電報導）印尼氣象氣候暨地球物理局（BMKG）在社群媒體X平台指出，印尼蘇拉威西島（Sulawesi）今天晚間發生規模6.0地震，所幸沒有引發海嘯的可能性。</p><p>歐洲地中海地震中心（EMSC）則估計這起地震的規模為5.9，震源深度109公里。</p><p>目前尚未傳出災損或人員傷亡的通報消息。（譯者：陳彥鈞）1140503</p>

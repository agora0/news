  <div class="post-content e-content" itemprop="articleBody">
    <div></div><div><p>（中央社新不列顛島5日綜合外電報導）歐洲地中海地震中心（EMSC）今天指出，巴布亞紐幾內亞的新不列顛（New Britain）地區海岸遭規模7.1強震襲擊，監測機構已發出海嘯警報。</p><p>歐洲地中海地震中心指出，這次地震深度49公里。</p><p>美國海嘯警報中心（U.S. Tsunami Warning Center）已發出海嘯警報。（譯者：徐睿承）1140405</p>

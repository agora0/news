    <h1 class="post-title p-name" itemprop="name headline">高雄捷運列車故障清車 影響旅客約延誤9分鐘</h1>

  <div class="post-content e-content" itemprop="articleBody">
    <p>（中央社記者<a class="author" href="https://www.cna.com.tw/author/0062/">林巧璉</a>高雄29日電）高雄捷運今天上午發生故障，高捷公司表示，早上約6時45分，一部下行方向列車出現故障訊息，無立即性危險，但依照標準作業流程清車，影響旅客約延誤9分鐘。</p><p>高捷公司表示，該班列車在R4高雄國際機場站清車後，旅客改搭下一班列車，約延誤9分鐘。後續全線恢復正常行駛。（編輯：蕭博文）1150929</p><div class="articlekeywordGroup"><div class="keywordTag"><a href="https://www.cna.com.tw/tag/12751/">#高捷公司</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/12891/">#高雄捷運</a></div></div>

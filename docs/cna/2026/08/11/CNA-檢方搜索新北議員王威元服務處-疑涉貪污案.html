  <div class="post-content e-content" itemprop="articleBody">
    <p>（中央社記者<a class="author" href="https://www.cna.com.tw/author/0192/">曹亞沿</a>新北11日電）新北地檢署今天兵分多路搜索國民黨新北市議員王威元服務處與住處等，並帶回王威元等人。據了解，疑與標案關說有關，全案涉及貪污治罪條例行賄罪等偵辦中。</p><p>王威元服務處人員表示，今天服務處同事都正常上班，不了解詳細情況，將全力配合檢方調查。（編輯：林恕暉）1150811</p><div class="articlekeywordGroup"><div class="keywordTag"><a href="https://www.cna.com.tw/tag/16981/">#新北地檢署</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/29070/">#國民黨</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/30359/">#貪污治罪條例</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/43095/">#王威元</a></div></div>

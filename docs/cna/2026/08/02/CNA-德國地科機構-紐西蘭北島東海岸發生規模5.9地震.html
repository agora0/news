    <h1 class="post-title p-name" itemprop="name headline">德國地科機構：紐西蘭北島東海岸發生規模5.9地震</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-08-02T17:29:00+08:00" itemprop="datePublished">Aug 2, 2026

  <div class="post-content e-content" itemprop="articleBody">
    <p>（中央社奧克蘭2日綜合外電報導）德國地球科學研究中心表示，紐西蘭北島東部海岸外今天發生規模5.9地震。</p><p>路透社報導，德國地球科學研究中心（German Research Centre for Geosciences，GFZ）還指出，這起地震震源深度10公里。（編譯：<a class="author" href="https://www.cna.com.tw/author/0081/">張正芊</a>）1150802</p><div class="articlekeywordGroup"><div class="keywordTag"><a href="https://www.cna.com.tw/tag/6214/">#地震</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/12363/">#紐西蘭</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/20943/">#北島</a></div></div>

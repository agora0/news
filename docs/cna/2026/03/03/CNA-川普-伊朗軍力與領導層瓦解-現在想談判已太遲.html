  <div class="post-content e-content" itemprop="articleBody">
    <p>（中央社華盛頓3日綜合外電報導）美國總統川普今天在自家社媒「真實社群」（Truth Social）發文表示，伊朗的防空、空軍、海軍和領導層都被摧毀，現在想要談判已經「太遲了」。</p><p>法新社報導，川普在文中寫道：「他們的防空、空軍、海軍和領導層都已玩完了。他們想要談，我說『太遲了！』」（編譯：陳正健）1150303</p>

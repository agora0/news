<meta name="description" content="彰化縣彰化市兒童公園涼亭16日大火，消防人員獲報前往灌救，幸無人傷亡。（彰化縣消防局提供）中央社記者鄭維真傳真 115年5月16日 （中央社記者鄭維真彰化16日電）位於彰化市三民路、長順街口的兒童公園園區涼亭今天凌晨大火，消防人員獲報前往灌救，燃燒面積約5平方公尺，幸無人傷亡，目前警方調閱監視器追查中，不排除遭縱火。 彰化縣消防局表示，凌晨1時33分接獲報案，涼亭疑遭縱火，出動人車前往布水線撲滅火勢。（編輯：李明宗）1150516" />

    <h1 class="post-title p-name" itemprop="name headline">甘比亞外海移民船沉沒 至少12人喪生</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-10-16T17:35:00+08:00" itemprop="datePublished">Oct 16, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>（中央社甘比亞首都班竹15日綜合外電報導）甘比亞紅十字會（Red Cross）今天發表聲明指出，一艘載運移民的船隻在甘比亞外海沉沒，救援人員已尋獲12具遺體。</p><p>法新社報導，甘比亞紅十字會表示：「目前仍不清楚有多少人失蹤，隨著救援行動持續進行，預計將有進一步消息。」（編譯：<a class="author" href="https://www.cna.com.tw/author/0086/">陳正健</a>）1151016</p><div class="articlekeywordGroup"><div class="keywordTag"><a href="https://www.cna.com.tw/tag/5732/">#甘比亞</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/44435/">#遺體</a></div></div>

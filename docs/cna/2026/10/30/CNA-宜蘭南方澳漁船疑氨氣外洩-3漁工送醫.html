<meta name="description" content="一艘停泊在南方澳的漁船30日發生冷凍設備疑似氨氣外洩事件。宜蘭縣消防局獲報後，派遣轄區分隊前往救援，現場共3名外籍漁工送醫，其中1人意識模糊，事故原因待調查。（宜蘭縣消防局提供）中央社記者沈如峰宜蘭縣傳真　115年10月30日 （中央社記者沈如峰宜蘭縣30日電）宜蘭1艘停泊在南方澳的漁船今天發生冷凍設備疑似氨氣外洩事件，共3名外籍漁工送醫，其中1人意識模糊。 宜蘭縣消防局上午獲報這起事件後，派遣轄區分隊前往救援。 消防局表示，現場共有3名外籍漁工送醫，其中1人意識模糊，另2人意識清楚。確實的事故原因還待調查釐清。（編輯：林恕暉）1151030 #宜蘭縣消防局#南方澳" />

                      </picture><figcaption class="picinfo">一艘停泊在南方澳的漁船30日發生冷凍設備疑似氨氣外洩事件。宜蘭縣消防局獲報後，派遣轄區分隊前往救援，現場共3名外籍漁工送醫，其中1人意識模糊，事故原因待調查。（宜蘭縣消防局提供）中央社記者沈如峰宜蘭縣傳真　115年10月30日</figcaption></figure><p>（中央社記者<a class="author" href="https://www.cna.com.tw/author/0039/">沈如峰</a>宜蘭縣30日電）宜蘭1艘停泊在南方澳的漁船今天發生冷凍設備疑似氨氣外洩事件，共3名外籍漁工送醫，其中1人意識模糊。</p><p>宜蘭縣消防局上午獲報這起事件後，派遣轄區分隊前往救援。</p><p>消防局表示，現場共有3名外籍漁工送醫，其中1人意識模糊，另2人意識清楚。確實的事故原因還待調查釐清。（編輯：林恕暉）1151030</p><div class="articlekeywordGroup"><div class="keywordTag"><a href="https://www.cna.com.tw/tag/24918/">#宜蘭縣消防局</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/26580/">#南方澳</a></div></div>

    <h1 class="post-title p-name" itemprop="name headline">新竹縣與苗栗縣防大豪雨 台中與新竹市留意豪雨</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-04-04T07:39:00+08:00" itemprop="datePublished">Apr 4, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>（中央社台北4日電）中央氣象署發布豪雨特報，鋒面影響，易有短延時強降雨，今天新竹縣及苗栗縣有局部豪雨或大豪雨，台中市及新竹市有局部大雨或豪雨發生。</p><p>中央氣象署表示，南投至台南及桃園以北有局部大雨發生的機率，請注意雷擊及強陣風。大豪雨地區：新竹縣、苗栗縣。（編譯：張曉雯）1150404</p>

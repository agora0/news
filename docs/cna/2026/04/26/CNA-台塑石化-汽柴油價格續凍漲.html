    <h1 class="post-title p-name" itemprop="name headline">台塑石化：汽柴油價格續凍漲</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-04-26T14:05:00+08:00" itemprop="datePublished">Apr 26, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>（中央社記者潘智義台北26日電）雖然中東戰局未解，但為穩定國內物價，台塑石化今天依然未調整汽柴油價格。</p><p>台塑石化加盟加油站4月27日1時起參考零售價維持不變，92無鉛汽油每公升32.4元、95+無鉛汽油每公升33.9元、98無鉛汽油每公升35.9元、超級柴油每公升30.8元。（編輯：蘇志宗）1150426</p>

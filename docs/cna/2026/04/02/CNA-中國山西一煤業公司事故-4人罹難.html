    <h1 class="post-title p-name" itemprop="name headline">中國山西一煤業公司事故 4人罹難</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-04-02T12:28:00+08:00" itemprop="datePublished">Apr 2, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>（中央社台北2日電）新華社今天報導，中國山西一家煤業公司1日發生事故，導致4人死亡。</p><p>報導表示，中煤關家崖煤業有限公司昨晚9時15分發生岩層塌落事故，4人被困。受困4人今天凌晨2時46分獲救援升井，已無生命體徵。</p><p>中煤關家崖煤業有限公司隸屬央企中國中煤能源集團旗下中煤集團山西有限公司，生產能力為每年150萬噸。（編輯：周慧盈/陳鎧妤）1150402</p><div class="articlekeywordGroup"><div class="keywordTag"><a href="https://www.cna.com.tw/tag/1756/">#山西</a></div></div>

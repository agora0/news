  <div class="post-content e-content" itemprop="articleBody">
    <p>（中央社記者<a class="author" href="https://www.cna.com.tw/author/0077/">吳睿騏</a>桃園2日電）國道1號高架南下49.4公里桃園交流道路段今天上午發生1輛小貨車與1輛自小客車追撞事故，占用部分道路，造成後方車流回堵，幸無人受傷，當事人已自行排除，相關車輛待拖吊。</p><p>內政部警政署國道公路警察局表示，車流回堵除受事故影響，也有上班車潮因素，呼籲用路人行經相關路段小心行駛。（編輯：李明宗）1151102</p><div class="articlekeywordGroup"><div class="keywordTag"><a href="https://www.cna.com.tw/tag/29277/">#國道1號</a></div></div>

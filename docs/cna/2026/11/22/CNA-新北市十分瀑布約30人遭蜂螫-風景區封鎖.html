<meta name="description" content="約30名遊客22日在新北市平溪區十分瀑布遭蜂群攻擊，所幸均意識清醒，救護人員到場在室內為民眾處理傷勢。（讀者提供）中央社記者王朝鈺傳真　115年11月22日 （中央社記者王朝鈺新北22日電）約30名遊客今天中午在新北市平溪區十分瀑布遭蜂群攻擊，所幸均意識清醒，相關單位已封鎖十分瀑布風景區，並派遣15輛救護車、42人到場處理遊客傷勢。 十分遊客中心中午12時許向消防局表示，多人在前往十分瀑布途中遭蜂螫，消防局立刻派遣15輛救護車、42人到場處理，相關單位已封鎖十分瀑布風景區調查。（編輯：蕭博文）1151122" />

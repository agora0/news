<meta name="description" content="115年地方公職人員選舉暨全國性公民投票第22案28日舉行投票，前總統蔡英文（前）中午前往投票所投票，一度因沒注意，差一點投錯票匭。中央社記者張皓安攝 115年11月28日 （中央社記者葉素萍台北28日電）九合一選舉今天投票，前總統蔡英文中午赴台北市建安國小投票，今天陽光普照，媒體詢問她心情如何，蔡英文笑答「很好」。 蔡英文抵達投票所時，現場許多民眾看到她，紛紛與她打招呼，蔡英文也與民眾寒暄互動。 蔡英文投票過程中還出現小插曲，投票時，她差點放錯票匭，投完票後一度忘了拿走印章。（編輯：張良知）1151128" />

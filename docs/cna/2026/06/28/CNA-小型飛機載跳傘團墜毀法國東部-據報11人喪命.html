    <h1 class="post-title p-name" itemprop="name headline">小型飛機載跳傘團墜毀法國東部 據報11人喪命</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-06-28T20:03:00+08:00" itemprop="datePublished">Jun 28, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>（中央社巴黎28日綜合外電報導）法國當局表示，一架小型民用飛機今天墜毀東部市鎮通布蘭（Tomblaine）附近；當地媒體指出，這起空難導致11人死亡。</p><p>法新社報導，法國警方敦促民眾避開通布蘭的機場周邊區域。</p><p>當地媒體提到，這架飛機據報載有一群要進行跳傘的人士。（編譯：<a class="author" href="https://www.cna.com.tw/author/0131/">陳彥鈞</a>）1150628</p><div class="articlekeywordGroup"><div class="keywordTag"><a href="https://www.cna.com.tw/tag/9763/">#法國</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/25898/">#空難</a></div></div>

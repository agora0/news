<meta name="description" content="澎湖湖西鄉「幸福社區」趣味運動嘉年華活動，7日安排有大小朋友帶動跳、舞蹈及律動演出和滾大球等多項味競賽，雖然天氣炎熱，但所有參加的民眾在競賽過程中，充滿溫馨與歡樂。中央社 115年6月7日 （中央社澎湖縣7日電）澎湖湖西鄉四年一次的「幸福社區」趣味運動嘉年華活動，今天在湖西國中操場登場，近600位大小民眾參與趣味競賽及親子互動。 「幸福社區」趣味運動嘉年華活動包括有湖西鄉15個社區與鄉立幼兒園7個班級近600人參與。 活動安排有小朋友帶動跳、舞蹈、律動演出和滾大球等多項競賽。（編輯：張銘坤）1150607 澎湖湖西鄉「幸福社區」趣味運動嘉年華活動，7日安排有大小朋友帶動跳、舞蹈及律動演出和滾大球等多項競賽。中央社 115年6月7日" />

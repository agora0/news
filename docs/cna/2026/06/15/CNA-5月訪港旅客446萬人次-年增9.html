  <div class="post-content e-content" itemprop="articleBody">
    <p>（中央社記者<a class="author" href="https://www.cna.com.tw/author/0040/">張謙</a>香港15日電）香港旅遊發展局今天公布，5月訪港旅客達到446萬人次，年增9%；今年前5個月訪港旅客約2300萬人次，較去同期增加14%。</p><p>在前5個月的訪客之中，中國大陸旅客占1767萬人次，其他海外旅客合計為532萬人次，分別增加16%及7%。（編輯：周慧盈）1150615</p><div class="articlekeywordGroup"><div class="keywordTag"><a href="https://www.cna.com.tw/tag/2009/">#中國大陸</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/11639/">#香港旅遊發展局</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/28049/">#旅客</a></div></div>

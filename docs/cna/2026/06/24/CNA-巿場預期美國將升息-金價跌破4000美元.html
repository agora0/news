    <h1 class="post-title p-name" itemprop="name headline">巿場預期美國將升息 金價跌破4000美元</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-06-24T21:55:00+08:00" itemprop="datePublished">Jun 24, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>（中央社倫敦24日綜合外電報導）受市場預期美國利率將會調高影響，金價今天跌破每盎司4000美元，為自從去年11月以來首見。</p><p>法新社報導，黃金每盎司下滑3.4%，來到3978.67美元。如果利率調升，將使美元和美國公債成為比黃金更具吸引力的避險資產。（編譯：<a class="author" href="https://www.cna.com.tw/author/0128/">何宏儒</a>）1150624</p><div class="articlekeywordGroup"><div class="keywordTag"><a href="https://www.cna.com.tw/tag/27257/">#美元</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/27283/">#美國</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/32282/">#黃金</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/41747/">#金價</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/56432/">#美國公債</a></div></div>

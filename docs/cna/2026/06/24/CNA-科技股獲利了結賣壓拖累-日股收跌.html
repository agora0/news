    <p class="post-meta">

  <div class="post-content e-content" itemprop="articleBody">
    <p>（中央社東京24日綜合外電報導）日本股市今天在科技股獲利回吐賣壓拖累下，終場收跌。</p><p>日股基準日經指數收盤跌613.41點或0.88%，來到69174.97點。</p><p>東證股價指數收盤挫26.62點或0.67%，來到3963.76點。（編譯：<a class="author" href="https://www.cna.com.tw/author/0129/">劉淑琴</a>）1150624</p><div class="articlekeywordGroup"><div class="keywordTag"><a href="https://www.cna.com.tw/tag/2850/">#日本</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/2914/">#日股</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/8883/">#東證股價指數</a></div></div>

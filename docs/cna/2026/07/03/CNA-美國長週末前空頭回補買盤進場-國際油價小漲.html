    <h1 class="post-title p-name" itemprop="name headline">美國長週末前空頭回補買盤進場 國際油價小漲</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-07-03T04:23:00+08:00" itemprop="datePublished">Jul 3, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>（中央社休士頓2日綜合外電報導）國際油價今天小幅上揚，主因美國獨立日長週末將至，市場出現一些空頭回補的買盤。</p><p>路透社報導，布倫特原油期貨上漲23美分或0.32%，收在每桶71.80美元。</p><p>美國西德州中級原油上漲11美分或0.16%，收報每桶68.69美元。（編譯：<a class="author" href="https://www.cna.com.tw/author/0079/">楊昭彥</a>）1150703</p><div class="articlekeywordGroup"><div class="keywordTag"><a href="https://www.cna.com.tw/tag/13307/">#國際油價</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/23350/">#西德州中級原油</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/27283/">#美國</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/55740/">#布倫特原油期貨</a></div></div>

    <h1 class="post-title p-name" itemprop="name headline">資金輪動帶動補漲 日股上揚</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-07-14T15:16:00+08:00" itemprop="datePublished">Jul 14, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>（中央社東京14日綜合外電報導）日本股市今天走高，表現落後的非科技類族群紛紛追上大盤。不過荷莫茲海峽（Strait of Hormuz）局勢惡化，限制了漲幅。</p><p>日股基準日經225指數上漲500.77點或0.74%，收67743.50點。</p><p>東證股價指數上漲31.49點或0.79%，收4038.98點。（編譯：<a class="author" href="https://www.cna.com.tw/author/0128/">何宏儒</a>）1150714</p>

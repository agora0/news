    <h1 class="post-title p-name" itemprop="name headline">美伊戰火推升油價 聯準會續觀望利率連5凍</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-07-30T02:09:00+08:00" itemprop="datePublished">Jul 30, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>（中央社華盛頓29日綜合外電報導）美國聯邦準備理事會（Fed）今天在政策會議上再次維持利率不變，這是聯準會連續第5次利率按兵不動。</p><p>這是聯準會新任主席華許（Kevin Warsh）上任後第2次政策會議，美國與伊朗戰事升溫，推升國際油價，進一步加劇通膨壓力。（編譯：<a class="author" href="https://www.cna.com.tw/author/0086/">陳正健</a>）1150730</p><div class="articlekeywordGroup"><div class="keywordTag"><a href="https://www.cna.com.tw/tag/9797/">#油價</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/19911/">#聯邦準備理事會</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/22588/">#伊朗</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/23547/">#利率</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/30378/">#通膨</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/35816/">#聯準會</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/54807/">#華許</a></div></div>

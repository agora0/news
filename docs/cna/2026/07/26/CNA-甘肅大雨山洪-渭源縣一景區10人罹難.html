  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">甘肅大雨山洪 渭源縣一景區10人罹難</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-07-26T18:45:00+08:00" itemprop="datePublished">Jul 26, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>（中央社台北26日電）新華社報導，甘肅省定西市渭源縣政府表示，渭源縣一景區今天下午受短時強降雨影響，引發山洪，致部分露營遊客被困。截至晚上6時，已有10人罹難、23人受傷。</p><p>新華社報導，當地公安、消防等已到場救援。</p><p>中國廣西、湖北、甘肅等多地近期遭受強降雨、大風等極端天氣，先前接連發生洪澇和地質災害，造成傷亡和損失。（編輯：<a class="author" href="https://www.cna.com.tw/author/0266/">馮昭</a>/呂佳蓉）1150726</p>

    <h1 class="post-title p-name" itemprop="name headline">台风“竹节草”或迫近冲绳 气象部门呼吁居民保持警惕</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-07-25T19:11:03+08:00" itemprop="datePublished">Jul 25, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <div><img src="https://www3.nhk.or.jp//nhkworld/upld/thumbnails/zh/news/20250725_ML07_1_L.jpg"><small style="color: gray;">台风“竹节草”或迫近冲绳 气象部门呼吁居民保持警惕</small></div>预计今年第8号台风“竹节草”从7月25日夜晚起接近日本冲绳地区。气象台提醒民众对强风、大浪、落雷、龙卷风等飙风保持高度警惕。

受台风等的影响，除奄美地区之外的鹿儿岛县其他地区25日深夜至26日深夜或将出现线状雨带，发生灾害的风险可能急剧上升，当地居民需加强防范。

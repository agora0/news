  <div class="post-content e-content" itemprop="articleBody">
    <figure><img src="https://ichef.bbci.co.uk/images/ic/800xn/p0nnb6j6.jpg" alt="委內瑞拉記者安德烈斯·阿斯普魯阿" referrerpolicy="no-referrer"><figcaption>BBC / 中国、伊朗、缅甸、委内瑞拉民间分别以不同的创意方法抵抗网络封锁</figcaption></figure><p>BBC全球错误资讯调查组采访了来自中国、伊朗、缅甸和委内瑞拉的民众，探讨他们如何在危机时刻想出创意的方法，突破网路封锁。</p><p>从中国的民间平台、缅甸的秘密网络咖啡店、伊朗的地下“星链”走私网络，到委内瑞拉的VPN新闻程式——这些故事揭示当政府试图断网时，人们是如何奋力维持连线。</p>

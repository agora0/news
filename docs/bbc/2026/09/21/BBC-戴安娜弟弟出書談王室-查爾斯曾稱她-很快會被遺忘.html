    <h1 class="post-title p-name" itemprop="name headline">戴安娜弟弟出書談王室 查爾斯曾稱她「很快會被遺忘」</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-09-21T18:03:53+08:00" itemprop="datePublished">Sep 21, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <figure><img src="https://ichef.bbci.co.uk/images/ic/800xn/p0pbp6g2.jpg" alt="戴安娜弟弟史賓賽伯爵" referrerpolicy="no-referrer"><figcaption>BBC / BBC独家：戴安娜弟弟出书爆王室内幕 查尔斯曾称她“很快会被遗忘”</figcaption></figure><p>戴安娜王妃逝世近30年之际，她的弟弟史宾赛伯爵出版新书，重提姐姐去世后的王室事件。他声称，时任王储查尔斯曾认为戴安娜很快会被世人遗忘，但这项说法遭到王室否认。</p><p>面对外界对相关说法的质疑，史宾赛伯爵表示，新书既是历史记录，也是个人回忆录，并透露自己仍保留一些未公开的回忆，但无意进一步公开。戴安娜离世多年后，她生前及身后的王室关系仍受到关注。</p>

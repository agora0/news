<meta name="description" content="前线报导：尼泊尔洪灾逾900人罹难 民众绝望寻找失踪亲人 尼泊尔上周遭遇毁灭性洪灾，已有超过900人死亡，仍有4200人失踪。有许多人在街头一张张查看寻找到的遗体照片，绝望地寻找失联的亲人；也有数百人被困隧道，至今生死未卜。 BBC记者阿扎德·莫希里从加德满都出发前往受灾严重的拉苏瓦地区。她报导说，尽管救援人员持续在瓦砾与泥泞中搜寻生还者，持续降雨和山区道路受阻，让救援与物资运送面临巨大挑战。" />

  <div class="post-content e-content" itemprop="articleBody">
    <figure><img src="https://ichef.bbci.co.uk/images/ic/800xn/p0p76kdk.jpg" alt="尼泊爾上周遭遇毀滅性洪災，已有超過900人死亡，仍有4200人失蹤。有許多人在街頭一張張查看尋找到的遺體照片，絕望地尋找失聯的親人；也有數百人被困隧道，至今生死未卜。" referrerpolicy="no-referrer"><figcaption>前线报导：尼泊尔洪灾逾900人罹难  民众绝望寻找失踪亲人</figcaption></figure><p>尼泊尔上周遭遇毁灭性洪灾，已有超过900人死亡，仍有4200人失踪。有许多人在街头一张张查看寻找到的遗体照片，绝望地寻找失联的亲人；也有数百人被困隧道，至今生死未卜。</p><p>BBC记者阿扎德·莫希里从加德满都出发前往受灾严重的拉苏瓦地区。她报导说，尽管救援人员持续在瓦砾与泥泞中搜寻生还者，持续降雨和山区道路受阻，让救援与物资运送面临巨大挑战。</p>

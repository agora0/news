    <h1 class="post-title p-name" itemprop="name headline">外媒：美国暂停对乌克兰的军事援助</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-03-04T10:44:03+08:00" itemprop="datePublished">Mar 4, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <div>2025.03.04 11:32</div>
	
		
		
	<div style="text-align:center">
<figure data-idxno="103073" data-type="photo" style="display:inline-block"><div style="position:relative;">
<img alt="当地时间上月28日在美国白宫举行的首脑会谈上，美国总统特朗普与乌克兰总统泽连斯基在媒体面前公开激烈争论。【照片来源：美联社=韩联社】" src="https://chinese.joins.com/news/photo/202503/118832_103073_3151.jpg" /></div>
<figcaption>当地时间上月28日在美国白宫举行的首脑会谈上，美国总统特朗普与乌克兰总统泽连斯基在媒体面前公开激烈争论。【照片来源：美联社=韩联社】</figcaption>
</figure>
</div>

<p>&nbsp;</p>

<p>中新网3月4日电 据彭博社和乌克兰媒体当地时间3日报道，美国总统特朗普下令暂停对乌克兰的所有军事援助。</p>

<p>据报道，美国国防部一名匿名高级官员表示，美国将暂停目前对乌克兰的所有军事援助，直到&ldquo;特朗普确定乌克兰总统泽连斯基实现对和平的真诚承诺&rdquo;。</p><!--PC 기사뷰 바이라인 하단 (20220927)//-->

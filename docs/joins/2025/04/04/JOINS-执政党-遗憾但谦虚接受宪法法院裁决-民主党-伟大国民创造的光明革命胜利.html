<p>韩国民力量党紧急对宪法法院裁决发表立场，表示&ldquo;虽感遗憾，但将谦虚接受宪法法院的决定&rdquo;。 与此同时，共同民主党表示&ldquo;这是伟大国民创造的光明革命胜利&rdquo;。</p>

  <div class="post-content e-content" itemprop="articleBody">
    <blockquote><p><em>在塞尔维亚，中资、台资企业的工厂雇佣不少来自亚洲、非洲的外籍劳工。德国之声实地调查发现，他们的居住条件恶劣不堪，工作时间也严重超时，还被迫举债给劳务中介机构缴纳高昂费用。批评人士指出，塞尔维亚吸纳了大量中国投资，因此多年来对相关举报视而不见。此外，德国大众等多家欧洲车企也都采购这些堪称现代奴工的产品。</em></p></blockquote><video width="100%" controls="" preload="metadata" poster="https://static.dw.com/image/79809620_605.webp"><source src="https://hlsvod.dw.com/i/vps/webvideos/CHI/2026/DWVG/DWVGCHI261113_V-Serbien_01SMW_,AVC_480x270,AVC_512x288,AVC_640x360,AVC_960x540,AVC_1280x720,AVC_1920x1080,.mp4.csmil/master.m3u8" type="application/x-mpegURL"><source src="https://tvdownloaddw-a.akamaihd.net/vps/webvideos/CHI/2026/DWVG/DWVGCHI261113_V-Serbien_01SMW_AVC_1920x1080.mp4" type="video/mp4"></video>

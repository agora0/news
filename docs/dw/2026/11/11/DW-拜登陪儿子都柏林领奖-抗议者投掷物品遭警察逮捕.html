  <div class="post-content e-content" itemprop="articleBody">
    <blockquote><p><em>周二（11月10日），美国前总统拜登突访都柏林圣三一学院。他的儿子亨特·拜登荣获该校历史学会授予的“公共话语杰出贡献金奖”。拜登和妻子吉尔陪同儿子亨特出席颁奖典礼。</em></p></blockquote><video width="100%" controls="" preload="metadata" poster="https://static.dw.com/image/79234125_605.webp"><source src="https://hlsvod.dw.com/i/vps/webvideos/CHI/2026/DWVG/DWVGCHI261111_biden-VERTICAL_01ICV_,AVC_270x480,AVC_360x640,AVC_540x960,AVC_720x1280,AVC_1080x1920,.mp4.csmil/master.m3u8" type="application/x-mpegURL"><source src="https://tvdownloaddw-a.akamaihd.net/vps/webvideos/CHI/2026/DWVG/DWVGCHI261111_biden-VERTICAL_01ICV_,AVC_270x480,AVC_360x640,AVC_540x960,AVC_720x1280,AVC_1080x1920,.mp4.csmil/master.m3u8" type="video/mp4"></video><p>支持巴勒斯坦的抗议者聚集在活动现场外，表达他们的反对立场。</p>

<p>拜登离开时，部分抗议者冲上前去并投掷物品。警方至少逮捕了两名抗议者。<br>
&nbsp;</p>

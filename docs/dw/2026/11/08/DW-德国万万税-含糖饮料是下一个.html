<meta name="description" content="德国正在讨论是否跟进全球116个国家，对含糖饮料征收“糖税”。支持者认为，糖税有助于降低肥胖、改善公共健康问题，还能促使业者调整配方、减少饮料中的含糖量。英国的案例显示，糖税上路后，部分饮料的平均含糖量在不到10年间下降近50%。但饮料业者反对这项政策，认为糖不只是提供甜味，更影响饮料口感与风味。若課征糖税，不仅将增加企业成本，也可能导致商品被迫进一步涨价。" />

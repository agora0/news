<meta name="description" content="週三（28日），两列载有数百名乘客的高速列车在西班牙中部发生追撞事故。该起事件造成至少64人死亡，超过50人受伤。幸存乘客指出，撞击发生时有人被抛飞至空中，车厢翻覆，一片混乱。西班牙交通部长也证实，事发路段信号灯系统出现故障，所有列车原本都应停驶，但追撞的列车却被告知可“正常继续行驶”，他称这项决定“令人费解”。" />

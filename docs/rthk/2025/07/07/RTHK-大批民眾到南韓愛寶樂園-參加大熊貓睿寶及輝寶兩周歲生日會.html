  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">大批民眾到南韓愛寶樂園　參加大熊貓睿寶及輝寶兩周歲生日會</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-07-07T13:00:38+08:00" itemprop="datePublished">Jul 7, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>在南韓出生的雌性大熊貓雙胞胎睿寶及輝寶兩周歲生日，大批民眾前往牠們居住的愛寶樂園參加生日會。</p>

<p>睿寶及輝寶在前年出生，是2016年起旅居南韓的大熊貓愛寶所生，父親是樂寶。寶家族在南韓開枝散葉，深受民眾愛載。</p>

<p>樂寶和愛寶在2020年出生的長女福寶，去年按協議送回中國，有關福寶的成長紀錄片在南韓亦廣受歡迎。</p>

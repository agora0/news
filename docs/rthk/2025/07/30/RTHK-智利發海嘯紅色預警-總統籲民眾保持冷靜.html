  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">智利發海嘯紅色預警　總統籲民眾保持冷靜</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-07-30T23:45:19+08:00" itemprop="datePublished">Jul 30, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>俄羅斯遠東地區堪察加半島對開海域發生8級以上強烈地震，觸發海嘯。智利國家災難預防和響應中心發布海嘯紅色預警，要求沿海地區民眾撤離到安全地區。</p>

<p>根據中心發布的公告，智利整條海岸線都可能受到影響。預計海嘯波在本港時間深夜抵達最西端復活節島。</p>

<p>智利總統博里奇在社交網站貼文，說第一波海嘯通常不會是破壞性最強，他呼籲民眾按政府指示保持冷靜。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">哈梅內伊出席宗教活動　以伊衝突以來首度公開露面</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-07-06T09:18:01+08:00" itemprop="datePublished">Jul 6, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>伊朗最高領袖哈梅內伊星期六在首都德黑蘭出席一場宗教活動，是他自上個月伊朗與以色列爆發為期12日的軍事衝突以來，首度公開露面。</p>

<p>伊朗國營電視台播放的片段顯示，86歲的哈梅內伊穿上黑衣，出席在一個清真寺舉行的活動，接受民眾歡呼。</p>

<p>出於安全理由，哈梅內伊在以伊衝突期間，都是發表預錄講話，早前有報道指，他在衝突期間一直藏身安全地點。</p>

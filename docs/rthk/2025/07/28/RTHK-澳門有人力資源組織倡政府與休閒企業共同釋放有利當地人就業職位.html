  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">澳門有人力資源組織倡政府與休閒企業共同釋放有利當地人就業職位</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-07-28T12:47:37+08:00" itemprop="datePublished">Jul 28, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>踏入暑假，新一批畢業生準備投入職場。</p>

<p>澳門近年不少畢業的年輕人，選擇做兼職謀生或新興的送外賣行業。澳門人力資源協會會長徐展文分析，與疫情後職場變化、澳門產業結構仍然單一，以及輸入外勞等因素影響有關。</p>

<p>他建議政府與休閒企業共同努力，適時釋放有利當地人就業的職位，提供培訓機會助缺乏經驗的年輕人較易進入職場。</p>

    <h1 class="post-title p-name" itemprop="name headline">特朗普稱計劃對進口銅徵收50%關稅　藥品關稅或達200%</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-07-09T03:26:25+08:00" itemprop="datePublished">Jul 9, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>美國總統特朗普表示，計劃對進口銅徵收50%關稅，以推動美國對這種關鍵金屬的本土生產。</p>

<p>特朗普在白宮內閣會議上透露相關計劃，但未有提及關稅具體生效時間，商務部長盧特尼克表示，銅關稅很可能在7月底或8月1日實施。</p>

<p>特朗普又表示，計劃對進口半導體和藥品加徵關稅，藥品稅率可能達到200%，他會給製藥廠大約一年時間來進行調整。</p>

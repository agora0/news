  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">財政部等緊急預撥1.5億元支持地方搶險救援及救助受災群眾</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-07-09T22:51:30+08:00" itemprop="datePublished">Jul 9, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>財政部及應急管理部緊急預撥1億5千萬元人民幣中央自然災害救災資金，重點支持浙江、福建、四川、重慶、西藏、甘肅，開展災害應急搶險救援和受災群眾救助工作。</p>

<p>新華社報道，財政部下一步將持續加強與應急管理部等部門溝通協調，緊盯災情發展變化，按規定及時快速下撥救災資金，保障災區救災工作需要，加強救災資金監管，切實提高資金使用質效。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">北葵涌街市一個銀鱈魚樣本被檢出金屬雜質甲基汞含量超標</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-07-02T23:02:52+08:00" itemprop="datePublished">Jul 2, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>食安中心公布，一個由北葵涌街市抽取的銀鱈魚樣本，被檢出金屬雜質甲基汞含量超標，已知會涉事商戶，並指令將受影響產品停售。</p>

<p>中心透過恆常食物監測計劃，從涉事街市一個商戶抽取樣本進行檢測，結果顯示，每公斤含甲基汞1.1毫克，超出法例標準的每公斤0.5毫克。</p>

<p>發言人說，中心正追查產品來源和分銷情況，會繼續跟進，如有足夠證據，中心會提出檢控。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">俄國客機在阿穆爾州墜毀　機上49人全部遇難</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-07-24T17:07:09+08:00" itemprop="datePublished">Jul 24, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>俄羅斯緊急情況部表示，初步信息顯示，在阿穆爾州墜毀的客機上49人已全部遇難。</p>

<p>俄羅斯傳媒報道，客機載有43名乘客和6名機組人員，在距離目的地滕達機場數公里處從雷達屏幕上消失，搜救人員其後在距離滕達市15公里的山坡上，發現客機殘骸，當時機身正在燃燒，現場冒出濃煙。</p>

<p>當局表示，墜機事故可能與天氣、技術故障或人為操作失誤有關，調查工作仍然繼續。</p>

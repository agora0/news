  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">天文台料低壓區發展為熱帶氣旋　本周後期較大機會移入南海北部</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-07-15T08:11:29+08:00" itemprop="datePublished">Jul 15, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>天文台預料，一個廣闊低壓區會在菲律賓以東海域逐漸發展為熱帶氣旋，在本周後期靠近呂宋一帶，並有較大機會移入南海北部，但路徑及強度存在變數。</p>

<p>受外圍下沉氣流影響，本周後期廣東天氣極端酷熱，本港星期五的市區最高氣溫達35度，周末至下周初天氣漸轉不穩定，南海北部有驟雨及狂風雷暴，海有湧浪。</p>

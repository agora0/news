    <h1 class="post-title p-name" itemprop="name headline">港匯觸發弱方兌換保證　金管局紐約時段買入132.82億港元</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-07-11T05:56:01+08:00" itemprop="datePublished">Jul 11, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>港匯偏軟，觸發7.85兌1美元的弱方兌換保證，金管局在紐約時段入市，買入132.82億港元，沽出美元，是時隔約1星期再次入市。</p>

<p>至下星期一，銀行體系總結餘將減少至1012.15億港元。</p>

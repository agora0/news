  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">何永賢：四年內完成「劏房」改裝後料「簡樸房」租金下調</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-07-12T17:55:16+08:00" itemprop="datePublished">Jul 12, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>立法會周三首讀及二讀《簡樸房條例草案》，新安排下設有一年登記期及三年寬限期。房屋局局長何永賢在本台節目《星期六問責》指，期望條例生效後四年內，業主可完成改裝。</p>

<p>有意見關注「劏房」改裝為「簡樸房」後租金會上升。何永賢指本年初本港分間單位的租金，較去年同期下跌2%，相信配合公營房屋和「簡約公屋」等供應，「簡樸房」租金會下調。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">澤連斯基與美國特使討論採購美國武器　特朗普考慮提供愛國者導彈</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-07-10T03:33:09+08:00" itemprop="datePublished">Jul 10, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>烏克蘭總統澤連斯基在意大利首都羅馬，與美國的烏克蘭事務特使凱洛格會面。</p>

<p>澤連斯基表示，雙方討論了採購美國武器、展開聯合國防生產、在烏克蘭實現武器本地化生產，以及對俄制裁等問題。</p>

<p>凱洛格是以美國代表團成員身份，參加在羅馬舉行的烏克蘭重建國際會議。</p>

<p>承諾向烏克蘭提供更多武器的美國總統特朗普，星期三表示會考慮向基輔當局提供愛國者導彈。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">羅湖懲教所63歲在囚女子襲擊懲教人員　遇襲者嘴部受傷毋須送院</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-07-05T09:41:24+08:00" itemprop="datePublished">Jul 5, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>羅湖懲教所一名63歲女性在囚人士，在囚室外突然情緒失控，襲擊一名懲教人員，在場懲教人員立即喝止。</p>

<p>事發在昨日下午5時許，遇襲懲教人員嘴部受傷，經院所醫生檢查及治理後，不用送院，施襲者並無受傷，事件已轉交警方調查。</p>

<p>​懲教署表示，施襲者是因盜竊罪而被判入獄。</p>

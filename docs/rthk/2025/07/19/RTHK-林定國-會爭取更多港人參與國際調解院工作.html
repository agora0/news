  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">林定國︰會爭取更多港人參與國際調解院工作</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-07-19T18:13:49+08:00" itemprop="datePublished">Jul 19, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>律政司司長林定國說，國際調解院的調解員，會分開兩個名冊，積極爭取國家和國際調解院的支持，令更多香港法律界和從事調解服務的人士，有機會參與調解院的工作。但他澄清，坊間說參加調解員培訓課程，便有資格出任國際調解院調解員的傳言，並不正確。</p>

<p>他又說，要正視如何應對「軟對抗」的問題，包括增加市民大眾的理性，對於整個國家和政府的理解。</p>

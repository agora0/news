  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">5支的士車隊開始試運　李頌恩稱擬7月開始向試行車隊發牌</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-06-27T12:25:23+08:00" itemprop="datePublished">Jun 27, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>運輸署署長李頌恩表示，5支的士車隊已開始試運，預計到下月底會有近1千輛的士投入服務。政府現計劃在7月開始，向現正試行的各支車隊發出正式的士牌照。</p>

<p>李頌恩說，部分司機和車主未必全面了解的士車隊的營運，有些人仍抱觀望態度，不過隨著的士車隊進行不同的招聘活動，反應越來越踴躍，相信司機人數會增加。</p>

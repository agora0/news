  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">墨西哥一如預期減息0.5厘　利率降至近3年低位</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-06-27T08:43:22+08:00" itemprop="datePublished">Jun 27, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>墨西哥央行一如市場預期減息0.5厘，將基準利率下調至8厘，是2022年8月以來最低。</p>

<p>利率決定公布後，墨西哥披索兌美元輕微升值約0.2%，反映市場對減息已充分預期。</p>

<p>央行聲明表示，今次決定考慮到匯率走勢、經濟活動疲弱，以及全球貿易政策變化可能帶來的影響。展望未來，央行說將評估進一步調整參考匯率。</p>

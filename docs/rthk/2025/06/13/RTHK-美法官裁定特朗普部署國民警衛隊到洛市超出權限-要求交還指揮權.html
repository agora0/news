  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">美法官裁定特朗普部署國民警衛隊到洛市超出權限　要求交還指揮權</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-06-13T09:52:01+08:00" itemprop="datePublished">Jun 13, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>美國一名聯邦法官頒布臨時禁制令，阻止總統特朗普在加州洛杉磯部署國民警衛隊。</p>

<p>法官指出，特朗普部署國民警衛隊是非法，既違反憲法第十修正案，亦超出特朗普的法定權限，指示特朗普將國民警衛隊的指揮權交還州長紐森，禁制令將於當地星期五中午生效。</p>

<p>特朗普政府隨即上訴。紐森回應裁決說，法院認定軍隊應該部署在戰場上，而非城市街道。</p>

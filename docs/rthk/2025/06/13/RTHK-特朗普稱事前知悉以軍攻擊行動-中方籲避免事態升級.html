  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">特朗普稱事前知悉以軍攻擊行動　中方籲避免事態升級</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-06-13T18:32:17+08:00" itemprop="datePublished">Jun 13, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>美國總統特朗普表示，事前已獲知會以色列攻擊伊朗的行動，他稱希望可與伊朗繼續核談判，如果伊朗報復，美國準備好自衛及協防以色列。</p>

<p>在北京，外交部表示，高度關注以色列攻擊伊朗，其擔憂可能招致的嚴重後果，呼籲避免緊張事態進一步升級，中方願為推動局勢緩和，發揮建設性作用。在本港，保安局更新對伊朗的紅色外遊警示，呼籲市民如非必要，避免前赴。</p>

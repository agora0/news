    <h1 class="post-title p-name" itemprop="name headline">內地股市造好　滬股上半年累計升近2.8%</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-06-30T15:18:15+08:00" itemprop="datePublished">Jun 30, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>內地股市向好。軍工、遊戲股上升；金融、汽車、機場航運股向下。</p>

<p>上證綜合指數收市報3444點，升20點，升幅0.59%。上半年累計升近2.8%。</p>

<p>深證成份指數報10465點，升86點，升幅0.83%。上半年累計升近0.5%。</p>

<p>創業板指數報2153點，升28點，升幅1.35%。上半年累計升逾0.5%。</p>

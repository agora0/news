    <h1 class="post-title p-name" itemprop="name headline">李強呼籲反對脫鉤斷鏈　搭建合作共贏橋樑</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-06-25T18:49:39+08:00" itemprop="datePublished">Jun 25, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>國務院總理李強於夏季達沃斯論壇致辭時表示，有一些國家及地區以去風險為由干涉市場，國際分工格局被迫調整，產供鏈碎片化風險正在上升，呼籲各國一起反對脫鉤斷鏈，搭建合作共贏橋樑。</p>

<p>李強又提及，今年中國與32個國家在香港共同建立了國際調解院，希望以東方的智慧，為解決國際爭端，探索出一條新路。</p>

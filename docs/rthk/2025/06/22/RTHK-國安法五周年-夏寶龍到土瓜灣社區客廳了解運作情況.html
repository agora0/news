  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">國安法五周年｜夏寶龍到土瓜灣社區客廳了解運作情況</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-06-22T13:13:02+08:00" itemprop="datePublished">Jun 22, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>中央港澳辦、國務院港澳辦主任夏寶龍在香港考察調研最後一日，他下午近1時，到土瓜灣社區客廳了解運作情況。行政長官李家超陪同他到場，勞工及福利局局長孫玉菡在場迎接，逗留大約15分鐘後離開。</p>

<p>夏寶龍早上先到政府總部，據悉與十八區的區議會主席及區議員代表舉行座談。</p>

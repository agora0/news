  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">李家超對印度航空空難深感悲痛　強調本港有完善安全體系</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-06-17T11:26:39+08:00" itemprop="datePublished">Jun 17, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>印度航空一架波音客機日前發生空難。行政長官李家超表示，事故造成多人死亡，深感悲痛，向這場慘劇中失去親人的人士表示慰問。</p>

<p>李家超出席行政會議前表示，特區政府重視航空安全，相關部門會關注事態發展和調查情況。</p>

<p>他強調本港有完善體系，確保航空安全達到世界最高標準，並將繼續維持。</p>

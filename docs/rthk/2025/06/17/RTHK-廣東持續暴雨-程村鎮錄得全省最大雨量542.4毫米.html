  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">廣東持續暴雨　程村鎮錄得全省最大雨量542.4毫米</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-06-17T15:27:08+08:00" itemprop="datePublished">Jun 17, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>廣東持續暴雨，截至今日中午，全省有59個暴雨預警信號生效，其中暴雨紅色預警信號達到11個。</p>

<p>受到高空槽移近和季候風加強影響，昨日和今日，廣東有924個鎮街遭遇暴雨、陽江陽西縣程村鎮錄得全省最大雨量542.4毫米。 廣州多條街道水浸，部分道路交通擠塞。</p>

<p>廣東省氣象局預計，明日起，全省降雨減弱。</p>

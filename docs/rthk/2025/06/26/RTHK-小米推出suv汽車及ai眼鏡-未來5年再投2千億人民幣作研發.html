    <h1 class="post-title p-name" itemprop="name headline">小米推出SUV汽車及AI眼鏡　未來5年再投2千億人民幣作研發</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-06-26T23:00:11+08:00" itemprop="datePublished">Jun 26, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>小米舉行產品發布會，公布首款運動型多功能汽車(SUV)YU7，並公布首款人工智能(AI)眼鏡。</p>

<p>董事長雷軍表示，小米自主研發設計的玄戒晶片，正式發布並量產；在未來五年，預計再投入2000億人民幣研發費用。他相信在20周年時，將交出更絢麗的答卷。</p>

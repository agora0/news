    <h1 class="post-title p-name" itemprop="name headline">李家超寄語教育工作者培育有志有為、愛國愛港新一代</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-06-26T18:38:04+08:00" itemprop="datePublished">Jun 26, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>行政長官李家超在一個有關優秀教師頒獎活動致辭，他說，教師是學生錘煉品格、學習知識、創新思維、奉獻國家的引路人，必須有高尚品格、豐富學養、崇高愛國情懷。</p>

<p>李家超希望香港每一位教育工作者，牢記「立德樹人」使命，讓年輕一代得到更好的教育，為國家和香港培育有志有為、愛國愛港的新一代，為「一國兩制」實踐行穩致遠貢獻力量。</p>

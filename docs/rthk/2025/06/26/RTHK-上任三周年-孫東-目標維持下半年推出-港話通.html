    <h1 class="post-title p-name" itemprop="name headline">上任三周年｜孫東：目標維持下半年推出「港話通」</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-06-26T12:38:41+08:00" itemprop="datePublished">Jun 26, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>創新科技及工業局局長孫東接受本台《上任三周年》專訪時表示，在政府財赤下，人工智能領域投放不會減少；新一份《施政報告》預料將詳述人工智能如何賦能政府提升管治水平。</p>

<p>首個港產人工智能大語言模型研發的「港話通」，孫東說，目標維持在下半年期間推出。</p>

<p>至於河套深港創科園區生物樣本跨境流通安排，孫東透露，最近獲國家積極及正面回覆。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">中國駐日大使館提醒中國公民注意防範地震災害</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-06-06T16:03:57+08:00" itemprop="datePublished">Jun 6, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>中國駐日本大使館表示，北海道附近海域接連發生強烈地震，提醒中國公民加強防範。</p>

<p>大使館在微信發布公告，指北海道太平洋一側近日地震頻繁，其中北海道釧路上月31日發生6級地震，北海道十勝海域星期一凌晨發生6.3級地震。日本氣象廳表示，千島海溝周邊隨時可能發生大規模地震，呼籲民眾加強日常防範。</p>

<p>中國駐日本大使館再次提醒在日同胞，特別是來日遊客注意防範地震災害。</p>

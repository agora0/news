  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">伊朗外長抵達莫斯科　將與普京磋商最新局勢</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-06-23T05:28:31+08:00" itemprop="datePublished">Jun 23, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>伊朗外長阿拉格齊當地周日晚，抵達莫斯科。</p>

<p>阿拉格齊此行將就美國及以色列對伊朗發動襲擊後的地區及國際局勢，與俄羅斯總統普京及其他俄方高級官員展開磋商。</p>

<p>阿拉格齊早前在土耳其伊斯坦布爾召開記者會，強烈譴責美國對伊朗核設施的野蠻軍事侵略。他批評，美國的行為是對《聯合國憲章》基本原則和國際法前所未有的違反，又說美國將對造成的危險後果和深遠影響承擔全部責任。</p>

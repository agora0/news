  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">社民連宣布解散</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-06-29T17:04:36+08:00" itemprop="datePublished">Jun 29, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>成立近19年的社會民主連線宣布解散。社民連主席陳寶瑩說，解散的決定是考慮到同行者及會員的情況而決定，已根據既有程序進行，獲成員一致通過，取消社團註冊的手續，將於宣布解散後跟進。</p>

<p>至於資產方面，陳寶瑩說，社民連的銀行戶口於數年前已被取消，沒有任何黨產需要處理，即使有現金，還要用於處理其他稅務及債務。</p>

<p>社民連於2006年成立，多名主要成員包括梁國雄、黃浩銘、岑子杰等近年先後入獄。</p>

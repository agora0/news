    <h1 class="post-title p-name" itemprop="name headline">丘應樺冀零售日常業務注入銀髮元素　業界促抓緊機遇刺激消費</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-06-04T12:33:34+08:00" itemprop="datePublished">Jun 4, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>商務及經濟發展局局長丘應樺表示，期望零售業界將銀髮友善元素注入日常業務，吸納銀色消費。他又鼓勵參與今年香港開心購物節的商戶，提供長者的專屬優惠。</p>

<p>香港零售管理協會主席謝邱安儀表示，業界抓緊香港在盛事、低空經濟及銀髮經濟等的機遇，從顧客消費體驗出發，善用科技，再配合特色深度遊，刺激消費意欲。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">《環看天下》：西班牙政府拒把軍費開支佔GDP比重增至5%</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-06-21T09:05:53+08:00" itemprop="datePublished">Jun 21, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>西班牙政府拒絕將國家軍費開支，增至佔國內生產總值5%的北約建議。首相桑切斯說，不同國家需要付出不同的經濟努力，才實現到北約設定的目標，這種不對稱性必須得到充分尊重。</p>

<p>分析指出，為滿足更高的防務支出要求，北約的歐洲成員國難免要壓縮醫療、養老等民生開支，可能引發國內不滿，因此它們要在防務開支的關鍵問題上彌合分歧，有一定難度。</p>

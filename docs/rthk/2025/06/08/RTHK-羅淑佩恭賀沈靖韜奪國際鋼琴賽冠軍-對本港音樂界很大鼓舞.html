  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">羅淑佩恭賀沈靖韜奪國際鋼琴賽冠軍　對本港音樂界很大鼓舞</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-06-08T18:15:28+08:00" itemprop="datePublished">Jun 8, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>本港年輕鋼琴家沈靖韜在四年一屆的范克萊本國際鋼琴賽奪得冠軍。</p>

<p>文化體育及旅遊局局長羅淑佩表示，賽事屬於高水平的國際賽事，祝賀沈靖韜擊敗20多名對手成功奪冠，相信對本港所有學習樂器的人士帶來很大鼓舞，可見有努力和天份的話，衝出國際可以成為事實，並非只是夢想。</p>

<p>羅淑佩又說，本地選手可以音樂或體育賽事揚威國際，令香港市民感振奮和開心，對此感驕傲。</p>

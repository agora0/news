  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">萬科多隻境內債券急挫　萬科：加快退出非主營業務以應對債務兌付</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-16T16:32:37+08:00" itemprop="datePublished">Jan 16, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>萬科多隻境內債券急挫，有5隻債券跌幅逾20%被停牌。</p>

<p>萬科表示，針對今年到期的公開債務，會全力以赴，繼續從經營端及融資端等多方面籌集資金，並透過積極銷售回款、持續推進大宗交易、加快退出非主營業務、持續爭取融資資源等方式，應對相關債務兌付。</p>

<p>據市場統計，萬科首季到期境內債規模近100億元人民幣。</p>

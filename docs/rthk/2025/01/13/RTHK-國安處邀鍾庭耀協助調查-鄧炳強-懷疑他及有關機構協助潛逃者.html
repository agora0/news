  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">國安處邀鍾庭耀協助調查　鄧炳強：懷疑他及有關機構協助潛逃者</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-13T17:25:14+08:00" itemprop="datePublished">Jan 13, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>保安局局長鄧炳強表示，香港民意研究所主席及行政總裁鍾庭耀協助警務處國家安全處調查，當局會調查他及其機構，有無協助潛逃者。鄧炳強說，與有關機構所做的民研調查完全沒有關係，又說到這一刻鍾庭耀沒有被拘捕。</p>

<p>被問到鍾庭耀曾表示，與被通緝的鍾劍華沒有聯絡，鄧炳強說，並不是他講了就證實沒有相關事情存在，需要透過調查才能知道情況。</p>

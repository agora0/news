    <h1 class="post-title p-name" itemprop="name headline">大灣區航空承認取消航班安排有疏漏　否認冒險售票及超賣機位</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-23T12:33:51+08:00" itemprop="datePublished">Jan 23, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>大灣區航空行政總裁吳秀蘭承認，取消2、3月航班安排有疏漏，通知受影響乘客做得不理想，客戶服務部出現「大塞車」。</p>

<p>她強調取消128班航班是多重原因造成，除了新飛機付運延誤、定期維修外，亦因為乘客對曼谷外遊意欲減低。她否認冒險銷售機票，亦絕對沒有超賣機位。</p>

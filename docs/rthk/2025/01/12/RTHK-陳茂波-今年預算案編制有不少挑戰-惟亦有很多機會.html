  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">陳茂波：今年預算案編制有不少挑戰　惟亦有很多機會</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-12T15:54:48+08:00" itemprop="datePublished">Jan 12, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>政府正開展《財政預算案》的公眾諮詢，財政司司長陳茂波說，今年預算案的編制有不少挑戰，但面前亦有很多機會。</p>

<p>陳茂波出席特許公認會計師公會公益關愛日活動致辭時說，政府制定公共政策，亦講求平衡。社會上有不同的社群、不同的需要，會提出訴求；同時政府要推動社會經濟加速發展，這兩方面都需要資源，資源有限，如何去平衡，是相當考功夫。</p>

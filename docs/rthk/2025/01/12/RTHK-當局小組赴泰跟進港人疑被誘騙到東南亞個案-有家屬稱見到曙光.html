    <h1 class="post-title p-name" itemprop="name headline">當局小組赴泰跟進港人疑被誘騙到東南亞個案　有家屬稱見到曙光</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-12T18:42:49+08:00" itemprop="datePublished">Jan 12, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>保安局表示，港人懷疑被誘騙到東南亞國家被禁錮從事非法工作的情況，近期有死灰復燃跡象，局方今晚率領專責小組前往泰國，將會與中國駐泰國大使館及泰國當局人員會面，進一步跟進求助個案。</p>

<p>有家屬歡迎政府的行動，形容是見到曙光。有立法會議員說，近期情況再次升溫，特區政府派專責小組到泰國跟進，屬於必須及合適的做法。</p>

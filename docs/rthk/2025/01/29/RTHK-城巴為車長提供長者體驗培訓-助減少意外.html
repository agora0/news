    <h1 class="post-title p-name" itemprop="name headline">城巴為車長提供長者體驗培訓　助減少意外</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-29T18:27:37+08:00" itemprop="datePublished">Jan 29, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>城巴為全線車長安排「長者體驗」培訓，讓他們理解長者乘車需要。</p>

<p>公司說，巴士行業整體交通意外逾半涉及長者，培訓開展1年，公司全數約4千名車長，當中850人已經參與。曾參與培訓的車長，涉及有人受傷的交通意外比率按年下跌4成。</p>

<p>城巴預計會在明年內，安排所有全職車長完成培訓。</p>

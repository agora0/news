  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">傅家俊稱如桌球於體院精英項目降級影響球手發展　冀當局酌情處理</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-22T12:21:44+08:00" itemprop="datePublished">Jan 22, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>啟德體育園3月初將舉行「世界格蘭披治桌球大獎賽」，本港桌球名將傅家俊會在表演賽亮相。他接受本台專訪表示，賽事對香港桌球發展意義重大，相信到時氣氛會很熱烈。</p>

<p>傅家俊又說，如果桌球在體院的精英項目由「A級」降為「B級」，對運動員發展影響很大，希望當局酌情處理。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">內地股市急升2.5%至近5%　上證指數重上3200點</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-14T15:13:24+08:00" itemprop="datePublished">Jan 14, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>內地股市顯著造好，創業板指數高收近5%，滬深兩市成交額合共1.35萬億元人民幣；人工智能概念、人形機器人、軟件等股份造好。</p>

<p>上證指數收復3200點關口，收市報3240點，升80點，升幅2.54%，是逾兩個月以來最大升幅。</p>

<p>深證成份指數收報10165點，升368點，升幅3.77%。</p>

<p>創業板指數報2075點，升93點，升幅4.71%。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">藍田有挖泥機從斜坡墮下撞毀隔音屏及垃圾車　三人傷其中一人被困</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-14T11:30:54+08:00" itemprop="datePublished">Jan 14, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>藍田連德道一個工地有挖泥機從斜坡墮下，撞倒隔音屏，再壓著一部垃圾車，三人受傷，其中兩人輕傷送院，一名跟車工人被困垃圾車，消防員到場救援。</p>

<p>事發在早上約9時半，出事的挖泥機懷疑失平衡，從約20米高的斜坡墮下，挖泥機司機自行爬出車外，垃圾車司機擦傷，跟車工人則被困。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">勞聯建議可考慮使用混合金屬和竹棚架</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-17T18:39:00+08:00" itemprop="datePublished">Jan 17, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>因應近期再發生地盤竹棚倒塌意外，有意見認為，應該改用金屬棚架取代竹棚。</p>

<p>香港竹棚業持續發展關注組表示，過往相關事故成因是地盤安全管理問題，是其他工種人員，因追趕工期而破壞「連牆器」。</p>

<p>勞聯指出，目前難以全面以金屬取代竹棚架，但可以考慮使用混合棚架。</p>

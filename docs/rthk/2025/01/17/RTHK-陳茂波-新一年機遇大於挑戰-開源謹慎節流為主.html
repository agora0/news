    <h1 class="post-title p-name" itemprop="name headline">陳茂波：新一年機遇大於挑戰　開源謹慎節流為主</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-17T17:24:59+08:00" itemprop="datePublished">Jan 17, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>《財政預算案》將於下月發表，面對千億財赤，財政司司長陳茂波表示，大方向是節約開支，但基建開支不會減。</p>

<p>展望今年，陳茂波認為市場波動較大，機遇大於挑戰。</p>

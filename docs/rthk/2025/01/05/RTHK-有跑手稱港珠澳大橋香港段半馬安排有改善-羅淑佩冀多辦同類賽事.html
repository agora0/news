  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">有跑手稱港珠澳大橋香港段半馬安排有改善　羅淑佩冀多辦同類賽事</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-05T12:20:14+08:00" itemprop="datePublished">Jan 5, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>港珠澳大橋香港段半馬拉松早上舉行，約8000名跑手參與。截至上午11時，有19名跑手報稱受傷或不適，其中3人需要送院。</p>

<p>不少跑手說今年安排比上屆好，亦有內地跑手特意來港參賽，形容在港珠澳大橋上作賽是難得機會。</p>

<p>參加2公里賽事的文化體育及旅遊局局長羅淑佩說，希望日後多舉辦同類型的賽事，吸引旅客。</p>

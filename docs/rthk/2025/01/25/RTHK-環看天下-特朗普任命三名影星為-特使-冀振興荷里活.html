  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">《環看天下》：特朗普任命三名影星為「特使」冀振興荷里活</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-25T08:37:22+08:00" itemprop="datePublished">Jan 25, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>美國總統特朗普在上任前宣佈，委任三名著名影星出任荷里活特使，讓荷里活重回黃金時代，變得更大、更好和更強。</p>

<p>他們是米路吉遜、史泰龍和尊威，暫時不清楚他們具體工作。</p>

<p>但有分析指，美國電影曾經風行世界，但如今已今非昔比。未來的「美國故事」該如何書寫，在美國國內有不同看法。</p>

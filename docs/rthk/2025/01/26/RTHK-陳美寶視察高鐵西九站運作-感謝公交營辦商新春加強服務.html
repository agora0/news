    <h1 class="post-title p-name" itemprop="name headline">陳美寶視察高鐵西九站運作　感謝公交營辦商新春加強服務</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-26T12:09:05+08:00" itemprop="datePublished">Jan 26, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>運輸及物流局局長陳美寶表示，農曆新年是市民與旅客的出行高峰，她早前視察高鐵西九龍站運作，感謝港鐵人員緊守崗位，為前線人員打氣，在佳節當前維持香港與連通內地93個直達站點的高鐵服務。</p>

<p>她亦感謝各公共交通營辦商，在新春佳節加強服務，讓全港市民與來自世界各地的旅客，可以在公眾假期的客流高峰期，繼續體驗香港高效、便捷、舒適的公共交通服務。</p>

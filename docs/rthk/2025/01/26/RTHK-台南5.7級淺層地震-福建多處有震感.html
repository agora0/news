  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">台南5.7級淺層地震　福建多處有震感</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-26T08:17:26+08:00" itemprop="datePublished">Jan 26, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>台灣台南市楠西區早上7時許發生5.7級地震，氣象部門錄得震源深度8.1公里，並向彰化縣、雲林縣、嘉義市、嘉義縣、台南市、高雄市、屏東縣發布警報，提醒民眾慎防強烈搖晃，就近避難。</p>

<p>中國地震台網錄得地震強度為5.1級，震源深度10公里，福建多處有震感，又指今次地震是1月21日台南6.2級地震的一次強餘震。</p>

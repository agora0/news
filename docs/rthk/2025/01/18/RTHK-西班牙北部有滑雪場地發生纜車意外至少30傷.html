  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">西班牙北部有滑雪場地發生纜車意外至少30傷</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-18T22:39:00+08:00" itemprop="datePublished">Jan 18, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>西班牙北部一個滑雪場地發生纜車意外，至少30人受傷，其中17人傷勢嚴重。</p>

<p>事發的滑雪場位處鄰近法國的比利牛斯山脈，有目擊者說，當時情況就好像纜索斷了，乘客被拋出纜車。</p>

<p>社交媒體流傳的圖片和影片顯示，有人倒卧纜車下的雪地，救護車和直升機將傷者送往附近醫院。</p>

<p>當地傳媒報道，意外後有幾十人被困纜車等候救援。</p>

<p>首相桑切斯說，對事件感到震驚。</p>

    <h1 class="post-title p-name" itemprop="name headline">省港盃足球賽第一回合賽事晚上在廣州舉行　崔劍及羅淑佩到場主禮</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-15T20:20:58+08:00" itemprop="datePublished">Jan 15, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>省港盃足球賽第一回合賽事，晚上在翻新後的廣州越秀山體育場舉行。賽事原本7時半開波，比賽推遲約15分鐘開始，現場球迷一度鼓譟，發出噓聲。</p>

<p>包括廣東省體育局局長崔劍、文化體育及旅遊局局長羅淑佩在內的一批主禮嘉賓，乘坐的大巴在晚上約7時40分到場。</p>

<p>羅淑佩在廣州期間，出席全運會和殘特奧會粵港聯絡會議第12次會議，並參觀比賽場地。</p>

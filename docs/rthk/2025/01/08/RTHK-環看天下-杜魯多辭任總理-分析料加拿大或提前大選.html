  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">《環看天下》：杜魯多辭任總理　分析料加拿大或提前大選</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-08T09:15:43+08:00" itemprop="datePublished">Jan 8, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>加拿大總理杜魯多宣布辭去執政自由黨黨魁和總理職務，會留任直至選出繼任人，同時確認國會暫停運作至3月下旬。外界預計，加拿大很可能會提前大選。</p>

<p>杜魯多做了加拿大總理超過9年，包括兩次成功連任。不少評論認為，他上任初期，在國內、外都贏取過掌聲，但近年，他的領導能力多次受到質疑，面對下台壓力亦越來越大。</p>

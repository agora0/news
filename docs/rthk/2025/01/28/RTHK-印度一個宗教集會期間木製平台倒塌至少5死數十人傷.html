  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">印度一個宗教集會期間木製平台倒塌至少5死數十人傷</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-28T15:22:31+08:00" itemprop="datePublished">Jan 28, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>印度北部一個宗教集會發生平台倒塌意外，造成至少5名信眾死亡，40多人受傷。</p>

<p>事發在首都新德里北部，數百名信眾在一座寺廟供奉，期間一個木製平台倒塌。</p>

<p>有在場信眾說，祭司派發糖果期間，平台突然倒塌，平台上的人跟隨跌下。</p>

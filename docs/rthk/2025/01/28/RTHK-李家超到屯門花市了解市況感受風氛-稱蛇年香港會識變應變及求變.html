    <h1 class="post-title p-name" itemprop="name headline">李家超到屯門花市了解市況感受風氛　稱蛇年香港會識變應變及求變</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-28T15:26:49+08:00" itemprop="datePublished">Jan 28, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>行政長官李家超下午到訪屯門天后廟廣場年宵市場，購買了10枝劍蘭、風車及「福字」掛物。</p>

<p>李家超見記者時表示，不同攤檔的產品和受歡迎程度不同，有些生意很好，有些正在繼續努力，相信入夜接近蛇年，生意會更好。他向市民拜早年，表示蛇寓意矯捷靈活，代表香港識變、應變、求變，希望大家大吉大利，一切順利，身體健康，家庭幸福。</p>

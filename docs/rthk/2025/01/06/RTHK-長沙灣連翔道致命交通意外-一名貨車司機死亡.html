    <h1 class="post-title p-name" itemprop="name headline">長沙灣連翔道致命交通意外　一名貨車司機死亡</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-06T10:19:49+08:00" itemprop="datePublished">Jan 6, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>長沙灣連翔道早上發生致命交通意外，一名貨車司機死亡。</p>

<p>早上約7時，一輛貨車沿連翔道往西隧方向行駛，駛至近海達邨對開，撞向前方一輛垃圾車的車尾，貨車車頭損毀嚴重，司機一度被困，由消防救出，他被送往廣華醫院搶救，其後證實不治。</p>

    <h1 class="post-title p-name" itemprop="name headline">陳美寶明日率團訪問廣西南寧　探討物流和航運合作機遇</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-06T17:30:57+08:00" itemprop="datePublished">Jan 6, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>運輸及物流局局長陳美寶明日率領香港物流發展局成員訪問廣西南寧，探討兩地在物流和航運方面合作的機遇。</p>

<p>陳美寶和代表團將參觀當地的物流設施，亦會出席桂港物流航運交流座談會，向當地業界推廣香港作為國際物流樞紐的優勢。她會與當地官員會面，就雙方關注的議題交換意見。</p>

<p>陳美寶將於星期三晚返港。她離港期間，運輸及物流局副局長廖振新將署任局長。</p>

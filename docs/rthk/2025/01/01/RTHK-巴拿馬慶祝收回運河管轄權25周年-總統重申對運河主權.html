  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">巴拿馬慶祝收回運河管轄權25周年　總統重申對運河主權</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-01T00:24:05+08:00" itemprop="datePublished">Jan 1, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>巴拿馬在運河管理局總部當地星期二舉行巴拿馬運河移交25周年紀念活動，巴拿馬總統穆利諾和數百名嘉賓出席。穆利諾在講話中重申巴拿馬對運河的主權。</p>

<p>他強調，正因為巴拿馬中立的管理，世界各國才放心，像巴拿馬運河這樣的戰略通道不會捲入任何衝突。</p>

<p>針對美國當選總統特朗普威脅試圖重新奪回巴拿馬運河，穆利諾說，巴拿馬運河只屬於巴拿馬人，這點永遠不會改變。</p>

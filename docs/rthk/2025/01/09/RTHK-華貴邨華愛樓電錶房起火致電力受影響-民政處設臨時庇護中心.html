  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">華貴邨華愛樓電錶房起火致電力受影響　民政處設臨時庇護中心</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-09T19:44:44+08:00" itemprop="datePublished">Jan 9, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>南區華貴邨華愛樓地下一個電錶房早上約11時半發生火警，現場一度傳出爆炸聲，消防員到場後大約半小時將火救熄，初步調查相信是電線短路引致起火。</p>

<p>事件中無人受傷，毋須疏散，但華愛樓的電力受影響，有6名居民一度被困電梯。</p>

<p>民政處表示，因應華愛樓停電事故，南區民政事務處晚上開放華貴社區會堂作臨時庇護中心，給有需要市民使用。</p>

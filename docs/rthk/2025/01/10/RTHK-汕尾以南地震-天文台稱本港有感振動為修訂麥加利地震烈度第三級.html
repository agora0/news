    <h1 class="post-title p-name" itemprop="name headline">汕尾以南地震　天文台稱本港有感振動為修訂麥加利地震烈度第三級</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-10T15:48:21+08:00" itemprop="datePublished">Jan 10, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>廣東汕尾以南海域發生4.2級地震。香港天文台表示，接獲超過十名市民報告，表示感到輕微震動，震動維持數秒。</p>

<p>天文台表示，初步分析，震央位於香港東南約200公里，震源深度約10公里，本港的地震烈度為修訂麥加利地震烈度表的第III (三)度，即室內有感，類似小型貨車駛過的振動。</p>

    <h1 class="post-title p-name" itemprop="name headline">以軍稱炮兵和戰機襲擊加沙北部和中部多個目標</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-19T15:40:02+08:00" itemprop="datePublished">Jan 19, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>以色列與巴勒斯坦武裝組織哈馬斯的停火及交換被扣押人員協議，首階段原定在本港時間下午2時半生效。以軍發言人表示，由於仍未收到哈馬斯提供應在當日獲釋的3名被扣押人員名單，以軍繼續作戰。</p>

<p>以色列國防軍發表聲明說，以軍炮兵和戰機襲擊了加沙北部和中部的多個目標。</p>

<p>哈馬斯就表示，確認將遵守停火協議有關條款，推遲提交第一批將被釋放的在押人員名單是因技術問題。</p>

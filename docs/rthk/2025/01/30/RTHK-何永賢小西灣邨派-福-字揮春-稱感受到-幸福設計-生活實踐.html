    <h1 class="post-title p-name" itemprop="name headline">何永賢小西灣邨派「福」字揮春　稱感受到「幸福設計」生活實踐</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-30T15:16:11+08:00" itemprop="datePublished">Jan 30, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>房屋局局長何永賢早前在臨近歲晚，到小西灣邨派「福」字揮春、探訪居民，她說，感受到「幸福設計」的生活實踐。</p>

<p>何永賢在社交專頁說，有長者分享自己的「樂齡安居」、「活力健康」和「綠色生活」，一對鄰居則展示多年的鄰里情，認為是「家社互聯」的體現，希望市民也感受到日常的幸福感，新一年幸福滿「舍」。</p>

    <h1 class="post-title p-name" itemprop="name headline">以軍稱在約旦河西岸打死18名槍手　拘捕逾60人</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-30T01:09:31+08:00" itemprop="datePublished">Jan 30, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>以色列國防軍說，在約旦河西岸北部傑寧和圖勒凱爾姆的持續突襲中，打死約18名槍手，並拘捕60多名被通緝的巴勒斯坦人。</p>

<p>以軍還表示，在過去兩天，部隊在傑寧地區拆除100多個爆炸裝置，並繳獲好多其他武器。在圖勒凱爾姆，部隊拆除30枚炸彈，繳獲了部分武器。</p>

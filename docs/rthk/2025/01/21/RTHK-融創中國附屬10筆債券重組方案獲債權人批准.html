    <h1 class="post-title p-name" itemprop="name headline">融創中國附屬10筆債券重組方案獲債權人批准</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-21T21:19:21+08:00" itemprop="datePublished">Jan 21, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>融創中國表示，附屬融創房地產10筆境內債券的重組方案，已全部經相關債券持有人會議審議通過，將對10筆債券的本息償付安排進行調整，並提供包括債券購回，即現金要約收購、股票、股票經濟收益權兌付及以資抵債等重組方案選項。</p>

<p>融創房地產下一步將根據債券持有人會議議案相關條款的約定， 安排債券持有人，就所持債券在重組方案選項中進行選擇及分配。</p>

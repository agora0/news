    <h1 class="post-title p-name" itemprop="name headline">特朗普簽署一系列行政命令　將派部隊到邊境阻止非法入境</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-21T08:17:58+08:00" itemprop="datePublished">Jan 21, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>再次宣誓就任美國總統的特朗普表明，將會簽署一系列行政會令，包括宣布南部邊境進入國家緊急狀態，會派部隊到邊境阻止非法入境；特朗普又指，美國的通脹危機源自能源價格不斷上升，會宣布國家進入能源緊急狀態，承諾會鑽探。</p>

<p>特朗普表示，美國會再次成為全球最強大的國家，稱會將墨西哥灣改名為「美國灣」，又會派太空人到火星。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">陳美寶：研究指將東九龍運輸系統落山位置隧道左移可讓數萬人受惠</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-03T12:34:02+08:00" itemprop="datePublished">Jan 3, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>運輸及物流局局長陳美寶接受報章專訪，表示按照最新可行性研究，將東九龍運輸系統落山位置的隧道左移，設藍田北站，可以讓德田邨、興田邨和藍田邨約數萬名居民受惠。</p>

<p>她又說，「粵車南下」是粵港澳大灣區「互聯互通」的重要舉措，已提上議程，會與廣東省交通運輸廳密切溝通，並向社會公開徵求意見。</p>

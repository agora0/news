  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">王毅將訪問非洲四國　是中國外長連續35年年初首訪非洲</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-03T19:59:09+08:00" itemprop="datePublished">Jan 3, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>中共中央政治局委員、外長王毅將於後日至本月11日應邀訪問納米比亞、剛果共和國、乍得、尼日利亞。</p>

<p>外交部發言人毛寧說，王毅今次訪問非洲四國，延續中國外長35年來每年首訪非洲的優良傳統。他今次外訪目的是推動落實中非合作論壇北京峰會成果，深化各領域務實合作，推動中非關係持續深入發展。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">內地當局歡迎記者採訪兩會　強調以現場採訪為主</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-27T08:19:06+08:00" itemprop="datePublished">Jan 27, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>今年第十四屆全國人大第三次會議將於3月5日在北京開幕，政協會議則於3月4日開幕。</p>

<p>新華社報道，全國人大常委會辦公廳和全國政協辦公廳宣布，歡迎中外記者屆時參加採訪，強調會議採訪以現場方式為主，綜合採用多種方式進行，將繼續秉持開放、透明的精神，為中外記者採訪報道提供服務。為兩會設立的新聞中心，將於2月27日正式開展工作。</p>

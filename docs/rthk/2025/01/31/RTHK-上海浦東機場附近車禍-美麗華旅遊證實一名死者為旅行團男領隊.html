  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">上海浦東機場附近車禍　美麗華旅遊證實一名死者為旅行團男領隊</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-31T18:37:14+08:00" itemprop="datePublished">Jan 31, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>美麗華旅遊一個本港旅行團在上海浦東機場附近發生車禍，車上一名男領隊死亡。</p>

<p>美麗華旅遊總經理李振庭表示，涉事為華東旅行團，事發時正前往浦東機場準備回港，十多名旅客將按照原定航班晚上回港，司機、導遊和乘客沒有受傷，但受到驚嚇。</p>

<p>李振庭說，暫時未知道事故原因，公司已聯絡死者家屬，將會協助處理後續事宜，又指有為領隊買保險。</p>

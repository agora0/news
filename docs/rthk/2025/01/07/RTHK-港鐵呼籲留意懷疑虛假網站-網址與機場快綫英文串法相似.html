  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">港鐵呼籲留意懷疑虛假網站　網址與機場快綫英文串法相似</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-07T16:17:05+08:00" itemprop="datePublished">Jan 7, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>港鐵呼籲公眾留意一個懷疑虛假網站，這網站的網址與機場快綫英文串法相似，容易令人混淆。港鐵說，有關網站透過邀請用戶登記，線上購買機場快綫車票及其他觀光景點的門票。公司強調，該網站並不是港鐵網站，機場快綫亦沒有透過該網站銷售車票，公司已就事件報警。</p>

<p>港鐵提醒公眾小心保管自己的個人資料，如有任何人士懷疑受騙，請盡快報警。</p>

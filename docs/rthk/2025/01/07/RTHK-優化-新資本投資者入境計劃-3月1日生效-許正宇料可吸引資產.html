  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">優化「新資本投資者入境計劃」3月1日生效　許正宇料可吸引資產</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-07T18:31:40+08:00" itemprop="datePublished">Jan 7, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>政府公布優化「新資本投資者入境計劃」詳情，包括放寬有關淨資產審查及計算的規定，而申請人透過全資擁有的合資格私人公司投資，亦可計入合資格投資金額內。優化措施今年3月1日起生效。</p>

<p>財經事務及庫務局局長許正宇相信，將進一步推進香港作為家族辦公室樞紐、吸引更多資產，令本港作為資產管理中心，起到正面作用。</p>

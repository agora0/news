    <h1 class="post-title p-name" itemprop="name headline">葵涌「旭逸酒店．荃灣」放售　市場估值5.3億元</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-07T15:50:18+08:00" itemprop="datePublished">Jan 7, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>物業顧問仲量聯行獲委任為獨家銷售代理，放售葵涌圳邊街「旭逸酒店．荃灣」，市場估值約5.3億元。仲量聯行說，項目有高潛力改建成逾十萬平方呎私人學生或優才住宿。</p>

<p>酒店前身是一幢24層高工業大廈，2013年初獲批豁免書改建為酒店，2017年第4季正式營運。地盤面積約9000平方呎，總樓面面積約10.7萬平方呎，提供160間客房。</p>

    <h1 class="post-title p-name" itemprop="name headline">載173名乘客客機因技術故障莫斯科機場緊急降落</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-07T21:37:07+08:00" itemprop="datePublished">Jan 7, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>俄羅斯傳媒報道，烏塔航空一班載著173名乘客的客機，因技術故障在莫斯科伏努科沃機場緊急降落，沒有人受傷。</p>

<p>報道指，該班波音737客機原定由聖彼得堡飛往烏茲別克撒馬爾罕，飛機因技術故障在莫斯科伏努科沃機場緊急降落。</p>

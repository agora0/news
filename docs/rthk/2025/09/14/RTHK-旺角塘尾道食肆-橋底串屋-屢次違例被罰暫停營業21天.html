    <h1 class="post-title p-name" itemprop="name headline">旺角塘尾道食肆「橋底串屋」屢次違例被罰暫停營業21天</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-09-14T15:31:56+08:00" itemprop="datePublished">Sep 14, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>旺角塘尾道食肆「橋底串屋」，持牌人因非法擴展營業範圍，屢次違反《食物業規例》，被食環署署長暫時吊銷牌照21天，即日起至下月4日須暫停營業。</p>

<p>食環署表示，有關食肆持牌人因違例事項，2019年3月至今年5月期間，4次被法庭定罪，共罰款13500元。署方亦根據違例記分制記下持牌人80分，食肆因此須先後停牌7天及14天，並連續執行。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">《環看天下》：印尼爆發示威浪潮　分析：反映貧富懸殊等深層問題</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-09-03T07:58:10+08:00" itemprop="datePublished">Sep 3, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>印尼全國多地連日來出現大規模示威，據報有示威者衝擊議會大樓，向警署及公共設施等縱火，亦有政府官員寓所被搶掠破壞，有人在示威中死亡，幾百人受傷，過千人被捕。</p>

<p>報道說，示威源於民眾不滿國會議員薪酬及福利過高。印尼總統普拉博沃宣布，取消多項議員福利，呼籲民眾保持冷靜。</p>

<p>有分析認為，印尼這次示威浪潮明顯反映當地貧富懸殊嚴重等深層次社會問題。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">政府稱現階段不宜繼續推進交椅洲人工島填海工程相關法定環評程序</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-09-10T18:56:14+08:00" itemprop="datePublished">Sep 10, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>政府表示，交椅洲人工島填海工程未有條件在本屆政府任期內開展，現階段不宜繼續推進有關的法定環評程序。</p>

<p>發展局局長甯漢豪解釋，是考慮到在未有目標填海時間表進行有關程序，可能令討論難以聚焦，亦希望避免引起公眾對交椅洲項目不必要的揣測及爭論。</p>

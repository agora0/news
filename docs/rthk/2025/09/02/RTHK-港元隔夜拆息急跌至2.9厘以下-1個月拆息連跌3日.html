  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">港元隔夜拆息急跌至2.9厘以下　1個月拆息連跌3日</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-09-02T11:38:04+08:00" itemprop="datePublished">Sep 2, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>港元短期拆息顯著回落，隔夜拆息單日急跌1.76厘，回落至約2.887厘，創1星期新低，結束5個交易日升勢。</p>

<p>1星期、2星期拆息分別跌逾15及約11個基點，處於3.1厘以上。</p>

<p>樓按相關1個月拆息微跌不足1個基點，跌至3.148厘，連跌3日。</p>

<p>其餘期限拆息有1個基點以上升幅，3、6、12個月拆息都在3.21厘以上。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">長沙灣順寧道公務員建屋合作社計劃項目本月進行強拍</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-09-02T14:32:43+08:00" itemprop="datePublished">Sep 2, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>仲量聯行宣佈獲委任為拍賣人，公開拍賣長沙灣順寧道308號、310號及312號、314號物業，底價1.23億元。</p>

<p>物業屬公務員建屋合作社計劃項目，佔地約4800平方呎，由兩幢5層高唐樓組成，每幢均設有一條公用樓梯，一梯兩伙，兩幢物業合共提供20個住宅單位。</p>

<p>物業於本月23日拍賣，將以部分交吉、部分連現有租約及現有建築物命令，以「現狀」為基礎出售。</p>

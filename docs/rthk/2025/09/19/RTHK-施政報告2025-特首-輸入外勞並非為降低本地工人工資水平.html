    <h1 class="post-title p-name" itemprop="name headline">施政報告2025｜特首：輸入外勞並非為降低本地工人工資水平</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-09-19T18:31:53+08:00" itemprop="datePublished">Sep 19, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>行政長官李家超出席本台英文台節目，繼續解說及回應施政報告內容。</p>

<p>李家超說，政府輸入外勞，目的是解決特定行業人手短缺，而不是降低本地工人工資水平。對於現政府重視的創科，李家超說，已創造好多競爭環境促進發展，相信有關範疇在未來日子將越來越強。</p>

    <h1 class="post-title p-name" itemprop="name headline">中國駐尼泊爾使館提醒當地中國公民繼續做好安全防範</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-09-13T15:29:59+08:00" itemprop="datePublished">Sep 13, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>中國駐尼泊爾使館提醒在當地的中國公民，繼續做好安全防範。</p>

<p>使館發聲明指，尼泊爾成立臨時政府，由內政部重新接管全國治安，各地政府分别實施不同安全管控措施，當地的社會秩序正在恢復，但依然存在較大安全風險。</p>

<p>使館提醒在尼泊爾的中國公民和機構，繼續做好安全防範，密切關注局勢發展，及時了解和遵守安全管控措施，做好應急準備，切實保護人身和財產安全。</p>

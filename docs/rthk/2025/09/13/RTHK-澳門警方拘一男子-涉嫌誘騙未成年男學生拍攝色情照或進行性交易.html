    <h1 class="post-title p-name" itemprop="name headline">澳門警方拘一男子　涉嫌誘騙未成年男學生拍攝色情照或進行性交易</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-09-13T18:29:51+08:00" itemprop="datePublished">Sep 13, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>澳門司警拘捕一名33歲男子，涉嫌利用社交平台，誘騙未成年男學生拍攝色情照片或進行性交易，估計至少有4名受害人。被捕男子涉嫌觸犯「性侵兒童」等三項罪名，今早被押送檢察院偵訊。</p>

<p>警方呼籲青少年保持警惕，如果遇到傷害應向老師、家長或社工求助及盡快報警。</p>

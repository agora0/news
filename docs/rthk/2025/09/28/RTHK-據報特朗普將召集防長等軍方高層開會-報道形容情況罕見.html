  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">據報特朗普將召集防長等軍方高層開會　報道形容情況罕見</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-09-28T23:54:02+08:00" itemprop="datePublished">Sep 28, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>據報美國總統特朗普，星期二將會罕有地召集軍方高層開會。</p>

<p>美國《華盛頓郵報》取得相關文件，指特朗普星期二將會在弗吉尼亞州一個海軍陸戰隊基地，召集多名軍方高層開會，包括防長赫格塞思。</p>

<p>據報會議約一小時長，期間赫格塞思將會發言，討論在全軍範圍保持「戰士精神」的必要性。報道形容總統與防長召集軍方領導人開會，情況罕見，白宮暫時未回應報道。</p>

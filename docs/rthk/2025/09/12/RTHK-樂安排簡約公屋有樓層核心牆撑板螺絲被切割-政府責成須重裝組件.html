  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">樂安排簡約公屋有樓層核心牆撑板螺絲被切割　政府責成須重裝組件</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-09-12T18:40:12+08:00" itemprop="datePublished">Sep 12, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>建築署上月底巡查小欖樂安排「簡約公屋」項目，發現部分樓層混凝土核心牆撑板上的螺絲被擅自切割。</p>

<p>房屋局及建築署高度重視並嚴肅跟進，已立即要求承建商暫停有關工序，並即時嚴肅責成承建商須將受影響的撑板重新安裝，重置相關的MiC組件。</p>

<p>建築署確認建築物整體結構安全，預計原定完工日期將不受影響。</p>

    <h1 class="post-title p-name" itemprop="name headline">三棟屋村命案死者兒子涉謀殺被捕正被扣留調查</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-09-23T21:19:07+08:00" itemprop="datePublished">Sep 23, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>荃灣三棟屋村發生謀殺案。</p>

<p>警方下午近2時接報，一名39歲男子聲稱用刀刺傷父親，該名父親送往仁濟醫院後不治。死者兒子涉嫌謀殺被捕，正被扣留調查。</p>

<p>警方表示，在該單位內檢獲一把20厘米長的生果刀，懷疑與案有關，又說人員趕赴現場後發現，一名70歲男子倒臥於單位，他的頭、頸、身體受傷，昏迷送院，其後證實死亡。警方稍後將安排驗屍，確定死者死因。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">何永賢：重推租置計劃要考慮定價和混合業權等問題</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-09-23T18:23:31+08:00" itemprop="datePublished">Sep 23, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>房屋局局長何永賢在一個電台節目表示，當局對會否重啟租置計劃持開放態度，但不同屋邨的住戶有不同考慮，需要考慮定價和混合業權等問題。</p>

<p>《施政報告》提出多項措施，加快發展北部都會區。何永賢提到在組裝合成法及建築工程應用新科技，節省一定工程費用，例如使用自動生成程式，研究樁柱和地底岩層配合，估算每座大樓成本可節省100萬元。</p>

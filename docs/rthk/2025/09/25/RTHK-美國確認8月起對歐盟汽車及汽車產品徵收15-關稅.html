  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">美國確認8月起對歐盟汽車及汽車產品徵收15%關稅</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-09-25T09:19:14+08:00" itemprop="datePublished">Sep 25, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>美國政府發布正式公告，落實與歐盟達成的貿易協議，確認自8月1日起，對歐盟進口汽車及汽車產品徵收15%的關稅，並列出部分豁免產品，包括特定藥物成分，所有飛機及零部件，以及某些自然資源。</p>

<p>美國總統特朗普7月宣布，美國與歐盟達成新貿易協議，對歐盟輸美商品徵收15%的關稅。歐盟委員會主席馮德萊恩說，這個稅率是歐委會能夠達成的最好結果。</p>

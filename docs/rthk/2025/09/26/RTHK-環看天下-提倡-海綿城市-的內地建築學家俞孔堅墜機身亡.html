    <h1 class="post-title p-name" itemprop="name headline">《環看天下》：提倡「海綿城市」的內地建築學家俞孔堅墜機身亡</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-09-26T09:01:21+08:00" itemprop="datePublished">Sep 26, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>內地著名都市設計建築學家俞孔堅，日前在巴西遇上空難離世，終年62歲。據報他當時正前往一個濕地進行紀錄片拍攝，但乘坐的小型飛機墜毀。</p>

<p>俞孔堅是最早提倡「海綿城市」設計概念的內地建築學者，透過參照海綿吸水排水的特性，構建出一個兼具防洪及生態保育功能的水利系統，加強人類應對氣候變化的能力，內地、本港，全球多國都有不同「海綿城市」的成功範例。</p>

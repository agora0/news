  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">立法會通過規範籃球博彩條例草案　馬會表示歡迎</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-09-11T16:09:52+08:00" itemprop="datePublished">Sep 11, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>立法會三讀通過修訂《博彩稅條例》及相關附屬法例，訂立籃球博彩活動的規管框架，並賦權民政及青年事務局局長參考現時賽馬和足球博彩的模式，向馬會發出單一籃球博彩牌照。</p>

<p>馬會表示歡迎，將繼續與政府緊密合作，打擊非法賭博。馬會將繼續推行嚴謹的「有節制博彩」政策及措施，並通過獨特的綜合營運模式支持香港慈善及體育發展。</p>

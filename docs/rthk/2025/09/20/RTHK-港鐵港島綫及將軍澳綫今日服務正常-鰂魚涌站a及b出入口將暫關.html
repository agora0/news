  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">港鐵港島綫及將軍澳綫今日服務正常　鰂魚涌站A及B出入口將暫關</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-09-20T02:49:06+08:00" itemprop="datePublished">Sep 20, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>港鐵表示，根據警方最新評估，警方於鰂魚涌進行的拆彈工作，不會影響港鐵列車服務，港島綫及將軍澳綫今日會維持正常服務。</p>

<p>港鐵又說，鰂魚涌站A及B出入口將會暫時關閉，請乘客使用其他出入口。港鐵會繼續留意有關情況，作出配合，有需要時會加強港島綫列車服務。</p>

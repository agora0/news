  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">《環看天下》：分析指李在明應對特朗普得宜避免出現外交尷尬局面</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-08-27T09:56:30+08:00" itemprop="datePublished">Aug 27, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>正在美國訪問的南韓總統李在明，在白宮與總統特朗普會晤。外界形容，這次會晤是李在明上任南韓總統後，首個重要的外交高層級會晤。</p>

<p>會前，特朗普在社交媒體貼文，表明關注南韓當前政局，語氣並不友善。不過，在會後，特朗普形容李在明是南韓偉大的領袖。分析認為，今次會晤顯示包括李在明在內的外國領袖，已經懂得應對特朗普，避免在傳媒前造成外交尷尬局面。</p>

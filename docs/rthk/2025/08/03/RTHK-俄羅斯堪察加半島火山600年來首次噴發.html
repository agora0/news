    <h1 class="post-title p-name" itemprop="name headline">俄羅斯堪察加半島火山600年來首次噴發</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-08-03T18:38:21+08:00" itemprop="datePublished">Aug 3, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>俄羅斯堪察加半島克拉舍寧尼科夫火山噴發，是600年來首次。</p>

<p>克拉舍寧尼科夫火山高接近1900米。</p>

<p>俄羅斯傳媒引述火山噴發響應小組負責人表示，火山噴出火山灰柱高度達6千米，山坡出現裂縫，熔岩穹丘形成，並伴有強烈的蒸汽活動，相信火山噴發，可能與近期的8.8級強烈地震有關。</p>

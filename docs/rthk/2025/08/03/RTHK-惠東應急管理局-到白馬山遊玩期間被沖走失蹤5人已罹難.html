    <h1 class="post-title p-name" itemprop="name headline">惠東應急管理局：到白馬山遊玩期間被沖走失蹤5人已罹難</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-08-03T17:09:12+08:00" itemprop="datePublished">Aug 3, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>廣東惠東縣應急管理局表示，前晚接報5人到白馬村白馬山遊玩期間被水沖走失聯，截至今日下午，5人已經全部找回，均已罹難。</p>

<p>當局說，接報後當地應急、公安、消防等部門組織救援力量，趕往事發地連夜搜救，但由於事發區域地形複雜、水流湍急，屬於未開發開放、不具備安全條件的區域，加上晚上能見度低、河流暗流較多，而連日來持續強降雨，搜救難度大。</p>

    <h1 class="post-title p-name" itemprop="name headline">馬尼拉發生槍擊案　兩名日本人中槍喪生</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-08-17T21:28:41+08:00" itemprop="datePublished">Aug 17, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>菲律賓首都馬尼拉遊客區發生槍擊案，兩名日本人中槍喪生。</p>

<p>日本駐馬尼拉大使館和馬尼拉警方表示，事發在星期五，兩名日本男子離開乘坐的的士期間，一名男子走近，向兩人開槍，掠去兩人的財物後，乘坐接應的電單車逃去。</p>

<p>大使館提醒在馬尼拉的日本人提高警覺，因為近期發生了連串針對日本人的持械行劫案。</p>

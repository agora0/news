    <h1 class="post-title p-name" itemprop="name headline">新界南總區重案組跟進港鐵有承建商疑交假文件　列「懷疑詐騙」案</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-08-28T19:26:14+08:00" itemprop="datePublished">Aug 28, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>警方昨日接獲港鐵報案，指懷疑工程承建商提交虛假文件，案件暫列作 「懷疑詐騙」，交由新界南總區重案組跟進。</p>

<p>港鐵東涌東站建造工程的一個分判商，被質疑磚材是否來自獲授權生產商。港鐵表示，分判商提供的物料和文件真實性未能釋除疑慮，昨日就事件報警。運輸及物流局高度關注，要求港鐵公司監督承建商嚴守合約規定。</p>

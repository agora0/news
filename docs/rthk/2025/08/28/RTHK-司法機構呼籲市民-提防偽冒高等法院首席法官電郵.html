    <h1 class="post-title p-name" itemprop="name headline">司法機構呼籲市民　提防偽冒高等法院首席法官電郵</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-08-28T20:16:45+08:00" itemprop="datePublished">Aug 28, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>司法機構呼籲市民提高警覺，提防偽冒電郵。</p>

<p>有關偽冒電郵經由電郵帳戶「jeremypoonshiuchor107@gmail.com」發出，訛稱由高等法院首席法官發出。司法機構已就事件向警方報案。</p>

<p>司法機構提醒市民，如收到可疑電郵，應提高警覺，不要開啓。任何人士若曾向該電郵寄件者提供個人資料，請即與警方聯絡。</p>

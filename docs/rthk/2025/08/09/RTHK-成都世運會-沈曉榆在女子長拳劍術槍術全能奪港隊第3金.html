  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">成都世運會　沈曉榆在女子長拳劍術槍術全能奪港隊第3金</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-08-09T20:05:23+08:00" itemprop="datePublished">Aug 9, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>成都世界運動會，港隊武術代表沈曉榆在女子長拳劍術槍術全能奪得金牌，為港隊取得今屆世運會第3金。</p>

<p>25歲的沈曉榆在長拳及槍術均取得9.75分，位列第一，在最後一項劍術再取得全場最高的9.76分，總分取得29.26分，較取得銀牌的馬來西亞選手高0.071分，銅牌就由日本選手奪得。</p>

<p>港隊在今屆世運會暫取得3面金牌，成績超越上屆。</p>

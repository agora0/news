  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">油價結束六連跌　布蘭特期油本周累計跌逾4%</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-08-09T07:11:41+08:00" itemprop="datePublished">Aug 9, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>油價結束6日跌勢，但全星期計仍急挫。</p>

<p>市場憂慮全球經濟前景受美國關稅措施打擊，並關注美俄元首會面，或會結束俄烏戰事。</p>

<p>倫敦布蘭特期油收報每桶66.59美元，升16美仙，升幅0.2%。紐約期油持平於63.88美元。</p>

<p>油價本周累計創6月底以來最大單星期跌幅，布蘭特期油跌4.4%，紐約期油跌5.1%。</p>

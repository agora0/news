  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">加拿大財長稱加美領導人或將通話　又認為兩國仍能達成貿易協議</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-08-04T00:35:50+08:00" itemprop="datePublished">Aug 4, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>加拿大財政部長勒布朗表示，總理卡尼未來數天可能會與美國總統特朗普通電話，商討兩國之間的貿易協議。</p>

<p>勒布朗接受美國傳媒訪問，說加拿大和美國近期的貿易談判進度令人鼓舞，但雙方仍未達成一份符合彼此最好經濟利益的協議。</p>

<p>勒布朗預告，兩國領導人未來幾天可能會通電話，並認為兩國仍然有可能達成協議、降低關稅，從而為投資提供更大確定性。</p>

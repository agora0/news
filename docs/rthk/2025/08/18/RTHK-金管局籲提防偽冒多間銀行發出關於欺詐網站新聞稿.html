    <h1 class="post-title p-name" itemprop="name headline">金管局籲提防偽冒多間銀行發出關於欺詐網站新聞稿</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-08-18T18:20:12+08:00" itemprop="datePublished">Aug 18, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>金管局呼籲市民提高警覺，留意由銀行所發出關於欺詐網站的新聞稿，包括東亞銀行有限公司、上海商業銀行有限公司、創興銀行有限公司及香港上海滙豐銀行有限公司。</p>

<p>金管局提醒公眾，銀行不會透過短訊或電郵超連結，引領到其網站進行交易，更不會以電話、電郵及手機短訊，包括以超連結方式，要求客戶提供任何敏感的個人資料，包括登入密碼及一次性密碼。</p>

    <h1 class="post-title p-name" itemprop="name headline">位於南海中部熱帶低氣壓已增強為熱帶風暴　並命名為劍魚</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-08-23T09:35:50+08:00" itemprop="datePublished">Aug 23, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>一號戒備信號，現正生效。表示有一熱帶氣旋，在香港約800公里內，可能影響本港。</p>

<p>位於南海中部的熱帶低氣壓已增強為熱帶風暴，並命名為劍魚。</p>

<p>在上午9時，劍魚集結在香港之東南偏南約610公里，即在北緯17.2度，東經116.4度附近，預料向西移動，時速約25公里，大致移向海南島以南海域。</p>

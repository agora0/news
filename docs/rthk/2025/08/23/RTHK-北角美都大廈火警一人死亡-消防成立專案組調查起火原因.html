  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">北角美都大廈火警一人死亡　消防成立專案組調查起火原因</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-08-23T22:36:09+08:00" itemprop="datePublished">Aug 23, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>北角英皇道美都大廈發生致命火警，一名男子死亡。</p>

<p>消防表示，起火樓層一梯四伙，有三個單位是分間單位，將成立專案小組，調查起火原因。</p>

<p>有大廈居民表示，事發後留在房間報警及打開窗戶求救，由消防用雲梯救到地面。亦有居民逃生時見到走廊有大量濃煙之後折返，最後由搭棚師傅協助到天台逃生。</p>

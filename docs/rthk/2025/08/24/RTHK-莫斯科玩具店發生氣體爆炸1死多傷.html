    <h1 class="post-title p-name" itemprop="name headline">莫斯科玩具店發生氣體爆炸1死多傷</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-08-24T18:44:27+08:00" itemprop="datePublished">Aug 24, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>俄羅斯首都莫斯科一間玩具店發生氣體爆炸，造成最少1人死亡。</p>

<p>警方封鎖現場調查，並有多輛警車和消防車戒備。爆炸發生在莫斯科市中心盧比揚卡廣場的中央兒童商店，消息指有氦氣罐爆炸，莫斯科市長說，爆炸造成1人死亡，多人受傷。</p>

<p>玩具店所在的大樓有多間餐廳、商店和戲院，當局已經疏散大樓內的人。</p>

    <h1 class="post-title p-name" itemprop="name headline">泰凌醫藥：應香港政府要求協助查實獨立第三方一份合約</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-08-19T22:29:57+08:00" itemprop="datePublished">Aug 19, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>泰凌醫藥發公告指，今日接到香港政府有關部門要求，協助查實與公司獨立第三方有關的一份合約。</p>

<p>公告並無透露有關合約詳情，但表示事件對公司日常業務沒有影響，目前董事及高階管理層亦沒有法律責任。</p>

<p>股份自今日下午1時起暫停買賣，停牌前報0.78元，將於明早9時起復牌。</p>

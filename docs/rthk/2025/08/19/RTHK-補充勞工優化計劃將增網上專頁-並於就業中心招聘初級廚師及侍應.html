    <h1 class="post-title p-name" itemprop="name headline">補充勞工優化計劃將增網上專頁　並於就業中心招聘初級廚師及侍應</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-08-19T17:34:32+08:00" itemprop="datePublished">Aug 19, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>勞工及福利局局長孫玉菡說，補充勞工優化計劃需要確保本地工人優先就業，將推出兩個優化安排。</p>

<p>他表示，勞工處將短期內推行計劃專頁，針對飲食業情況，當局下月起會要求餐飲業所有輸入外勞申請，如果涉及初級廚師和侍應，除了現時要求每名僱主先進行4星期本地招聘，將額外要求每名僱主到勞工處就業中心實地招聘，希望進一步加強配對。</p>

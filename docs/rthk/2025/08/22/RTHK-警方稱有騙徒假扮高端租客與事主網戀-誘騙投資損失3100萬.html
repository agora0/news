  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">警方稱有騙徒假扮高端租客與事主網戀　誘騙投資損失3100萬</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-08-22T12:47:28+08:00" itemprop="datePublished">Aug 22, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>警方留意到近期有騙徒假扮高端租客，接觸受害人行騙，有事主與騙徒建立網戀關係，被誘使到虛假平台投資，損失3100萬元。</p>

<p>警方表示，上半年的網上投資騙案宗數及損失金額，明顯按年上升，呼籲公眾要對被加入不明群組的情況，保持警覺。</p>

<p>WhatsApp平台母公司Meta表示，近期啟用新功能，讓用戶了解被加入群組的資訊及作出安全提示。</p>

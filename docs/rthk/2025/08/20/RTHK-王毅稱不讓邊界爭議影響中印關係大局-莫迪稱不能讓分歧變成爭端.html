  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">王毅稱不讓邊界爭議影響中印關係大局　莫迪稱不能讓分歧變成爭端</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-08-20T07:23:53+08:00" itemprop="datePublished">Aug 20, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>印度總理莫迪與到訪的中共中央政治局委員、中央外辦主任王毅會面。莫迪表示，印中是夥伴而不是對手，應該穩妥管控和處理邊界問題，不能讓分歧變成爭端。</p>

<p>王毅亦說，中印應堅持彼此是夥伴而非對手的正確定位，不讓邊界爭議影響兩國關係大局。</p>

<p>中方公布，中印雙方同意探討在條件成熟的地段推進劃界談判，亦同意盡早恢復直航航班及為兩國人員提供簽證便利。</p>

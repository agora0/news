  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">伊利沙伯醫院呼籲市民留意假冒院方的欺詐電話</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-08-20T17:43:48+08:00" itemprop="datePublished">Aug 20, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>伊利沙伯醫院表示，近日收到市民通知，表示收到聲稱來自伊利沙伯醫院的電話，以錄音或真人對話形式訛稱有緊急通知，院方已就事件向警方報案，呼籲市民留意來歷不明的欺詐電話。</p>

<p>院方重申，醫院如需要聯絡病人，一般會透過職員親自致電病人，並提供相關資料以核實身分，又提醒市民不應向來歷不明的來電提供任何個人資料，如接到懷疑欺詐電話應向警方求助。</p>

    <h1 class="post-title p-name" itemprop="name headline">廉署拘捕5人　涉嫌串謀詐騙社署長者社區照顧服務券津貼</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-08-14T22:37:51+08:00" itemprop="datePublished">Aug 14, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>廉署拘捕5人，涉嫌串謀詐騙社署長者社區照顧服務券津貼，是社署首次接獲涉及專業人士和服務使用者家屬的貪污舉報。案中兩名主腦各自經營一間私營護理機構，懷疑拉攏市民教唆家中長者，訛稱機構有派人上門提供服務，從而詐騙政府津貼，由護理機構與長者家人攤分。</p>

<p>社署說，需要顧及其他正接受服務的長者意願，暫未有即時終止兩個機構的服務，但署方會加強審核監管。</p>

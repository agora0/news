    <h1 class="post-title p-name" itemprop="name headline">立法會公共申訴辦事處、立法會圖書館及導賞團及教育服務等暫停</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-08-05T07:33:52+08:00" itemprop="datePublished">Aug 5, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>天文台已發出黑色暴雨警告信號，立法會公共申訴辦事處、立法會圖書館、立法會檔案館，以及導賞團和教育服務暫停。</p>

<p>當黑色暴雨警告信號取消後，各項服務將於兩小時後恢復正常。若黑色暴雨警告信號於下午3時或以後取消，各項服務則會全日暫停。</p>

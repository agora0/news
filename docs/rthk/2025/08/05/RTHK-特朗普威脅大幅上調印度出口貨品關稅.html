  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">特朗普威脅大幅上調印度出口貨品關稅</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-08-05T18:40:43+08:00" itemprop="datePublished">Aug 5, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>美國總統特朗普威脅，會大幅上調印度貨品出口到美國的關稅。他批評印度購買大量俄羅斯石油，之後在公開市場出售，謀取暴利，不在乎俄烏戰事令很多烏克蘭民眾喪命。</p>

<p>印度外交部表示，有關指控不公道、不合理，印度會採取一切必要措施，捍衛本身國家利益及經濟安全。</p>

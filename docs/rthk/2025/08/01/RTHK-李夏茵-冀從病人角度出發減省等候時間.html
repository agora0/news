  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">李夏茵︰冀從病人角度出發減省等候時間</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-08-01T18:18:26+08:00" itemprop="datePublished">Aug 1, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>新任醫管局行政總裁李夏茵說，希望醫療服務設計多從病人角度出發，例如在病人到專科門診，是否可以減省排隊和等候次數和時間。另外亦會檢視預約流程，減省沒有需要的等候時間。但她表明，普通科門診不會24小時運作。</p>

<p>她又說，上任後首要工作，是與員工等多溝通，並鼓勵員工直接反映意見。</p>

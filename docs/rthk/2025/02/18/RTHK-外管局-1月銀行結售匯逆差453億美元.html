  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">外管局：1月銀行結售匯逆差453億美元</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-02-18T21:54:00+08:00" itemprop="datePublished">Feb 18, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>國家外匯管理局公布，1月銀行結售匯逆差453億美元。</p>

<p>外管局表示，上月外資穩步凈買入境內債券，持有人民幣資產意願保持穩定。1月下旬涉外收支已轉為順差，2月以來繼續保持順差趨勢，銀行結售匯基本平衡。</p>

<p>外管局指，有能力維護人民幣匯率在合理均衡水平上基本穩定，保持外匯市場平穩運行，又指人民幣跨境使用明顯增多，可以更好緩釋外部衝擊，有助於市場交易更加理性有序。</p>

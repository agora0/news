  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">友邦完成120億美元股份回購計劃</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-02-12T18:04:35+08:00" itemprop="datePublished">Feb 12, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>友邦保險公布，已透過場內回購合共逾14.09億股公司股份，完成總價值約120億美元股份回購計劃，回購股份數目佔公司截至2022年3月公布回購計劃當日已發行股份總數11.7%，</p>

<p>公司指，仍然致力於嚴格的資本配置，並將根據資本管理政策評估未來機遇，以提升股東價值。</p>

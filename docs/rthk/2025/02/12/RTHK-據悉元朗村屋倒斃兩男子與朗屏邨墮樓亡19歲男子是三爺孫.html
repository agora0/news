    <h1 class="post-title p-name" itemprop="name headline">據悉元朗村屋倒斃兩男子與朗屏邨墮樓亡19歲男子是三爺孫</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-02-12T08:29:45+08:00" itemprop="datePublished">Feb 12, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>警方昨晚8時許分別接報，元朗振興新村一間村屋有兩名分別約九旬及近七旬的男子倒斃屋內，其後有一名19歲男子懷疑從元朗朗屏邨高處墮下後死亡。</p>

<p>據了解，初步顯示兩宗案件有關連，初步估計三人分別是祖父、父親及兒子的關係。警方正調查事件，由元朗警區重案組第二隊跟進。</p>

    <h1 class="post-title p-name" itemprop="name headline">《環看天下》：特朗普：烏克蘭加入北約不切實際</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-02-14T09:21:40+08:00" itemprop="datePublished">Feb 14, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>美國總統特朗普分別與俄羅斯總統普京及烏克蘭總統澤連斯基通電話。特朗普透露，他與普京稍後有機會在沙特阿拉伯會面；雙方亦同意派遣各自團隊，就結束俄烏戰爭立即開始談判。</p>

<p>特朗普又表明，烏克蘭加入北約是不切實際，亦不太可能收回所有土地。</p>

<p>不少西方傳媒認為，特朗普的表態明顯令烏克蘭一方，在未來結束衝突談判上處於被動位置。</p>

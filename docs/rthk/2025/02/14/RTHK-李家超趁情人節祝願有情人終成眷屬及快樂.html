    <h1 class="post-title p-name" itemprop="name headline">李家超趁情人節祝願有情人終成眷屬及快樂</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-02-14T08:26:45+08:00" itemprop="datePublished">Feb 14, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>行政長官李家超趁今日情人節，在社交平台祝大家情人節快樂，願天下有情人終成眷屬。</p>

<p>他說記得有一次，自己和太太在湖邊漫步，他伸手扶太太走過不平的草地時，情景被拍攝下來，之後畫成了一幅畫。</p>

<p>他十分感謝太太一直以來對自己的扶持和包容，感恩沿路有她，未來彼此會繼續攜手前行。</p>

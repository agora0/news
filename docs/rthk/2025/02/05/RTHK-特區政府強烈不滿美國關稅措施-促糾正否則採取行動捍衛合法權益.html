    <h1 class="post-title p-name" itemprop="name headline">特區政府強烈不滿美國關稅措施　促糾正否則採取行動捍衛合法權益</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-02-05T22:49:35+08:00" itemprop="datePublished">Feb 5, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>美國政府宣布對香港產品加徵一成關稅，特區政府表示強烈不滿，敦促美方即時糾正，否則將採取一切可能的行動，捍衛合法權益。</p>

<p>廠商會表示，近年不少以美國為主要市場的港商，已陸續將廠房搬到其他地方，相信措施影響有限。</p>

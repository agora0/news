    <h1 class="post-title p-name" itemprop="name headline">英美期油個別發展　市場關注美國對伊朗施壓及貿易戰</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-02-05T05:20:59+08:00" itemprop="datePublished">Feb 5, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>英美原油期貨個別發展。</p>

<p>紐約3月期油收市報每桶72.7美元，跌46美仙，跌幅0.63%。</p>

<p>布蘭特4月期油收市報每桶76.2美元，升24美仙，升幅0.32%。</p>

<p>中國與美國互相加徵關稅，觸發紐約期油最多跌逾3%；美國總統特朗普簽署總統備忘錄，命令財政部長對伊朗施加最大經濟壓力，包括制裁，目的為禁止伊朗石油出口，對油價有支持。</p>

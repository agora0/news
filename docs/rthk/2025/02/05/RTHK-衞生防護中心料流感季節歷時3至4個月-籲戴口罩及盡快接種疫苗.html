  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">衞生防護中心料流感季節歷時3至4個月　籲戴口罩及盡快接種疫苗</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-02-05T12:25:03+08:00" itemprop="datePublished">Feb 5, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>衞生防護中心總監徐樂堅表示，流感陽性個案仍處於攀升階段，暫未見何時到高峰，但目前未有出現病毒株轉移或雙高峰的情況，預計流感季節歷時約3至4個月。</p>

<p>他又說農曆新年假期後，陸續復工復課，傳播會轉趨嚴重，呼籲市民盡快接種流感疫苗，到人多地方最好佩戴口罩。</p>

<p>有家庭醫生表示，近日查詢和預約接種流感疫苗的數字倍增，疫苗供應仍然充裕，未見有加價。</p>

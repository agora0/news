    <h1 class="post-title p-name" itemprop="name headline">阿拉斯加失聯小型飛機墜毀機上10人遇難</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-02-08T09:36:42+08:00" itemprop="datePublished">Feb 8, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>美國當局證實，在阿拉斯加失聯小型飛機墜毀，機上的10人已經遇難。</p>

<p>當地時間星期四下午，一架白令航空公司的螺旋槳飛機，從尤納拉克利特飛往諾姆途中失聯，機上有9名乘客和1名機師。</p>

<p>救援人員出動直升機，在飛機最後出現的地點搜索，在結冰的海面發現殘骸。</p>

<p>氣象部門說，事發時當地落雪和有霧，氣溫零下8.3度。</p>

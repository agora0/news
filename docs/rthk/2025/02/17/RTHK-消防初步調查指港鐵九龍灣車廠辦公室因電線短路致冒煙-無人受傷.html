  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">消防初步調查指港鐵九龍灣車廠辦公室因電線短路致冒煙　無人受傷</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-02-17T14:21:47+08:00" itemprop="datePublished">Feb 17, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>港鐵九龍灣車廠一個辦公室在上午9時許有火警鐘響起，車廠職員到場見到辦公室內有電線槽冒煙，消防員到場後用滅火筒將煙撲熄。消防初步調查後，相信是電線短路。</p>

<p>港鐵表示，為安全起見，車廠內約680名職員按程序疏散，事件中無人受傷，亦不影響列車服務。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">市民接獲「#」號開頭懷疑詐騙短訊　蕭澤頤：切勿按附帶連結</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-02-15T18:24:55+08:00" itemprop="datePublished">Feb 15, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>通訊辦收到市民報告，指收到以「#」號開頭的短訊發送人名稱發出的懷疑詐騙短訊。警務處處長蕭澤頤表示，正與通訊辦等部門了解，暫時未清楚箇中原因。他呼籲市民，無論短訊是否由「#」號開頭發出，切勿點擊短訊附帶連結。</p>

<p>蕭澤頤又表示，留意到有人購入大批實名電話卡再轉讓做不法行為，指商務及經濟發展局今年將提出修例建議禁止轉售，並限制每人購買電話卡的數量。</p>

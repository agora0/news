    <h1 class="post-title p-name" itemprop="name headline">一名被禁錮在緬甸港人獲泰軍救走　保安局稱盡快安排返港</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-02-03T18:29:07+08:00" itemprop="datePublished">Feb 3, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>泰國軍方及警方周日救出一名被禁錮在緬甸妙瓦底詐騙園區的31歲香港女子，本港保安局表示，會盡快安排她返港。</p>

<p>另外，有家屬今早到泰國駐港總領事館遞交請願信，希望泰國當局協助營救他們的家人。</p>

<p>泰國警方說，正成立國際協調中心，由泰國警方和外國使館合作，防止外國人被招攬到緬甸的詐騙集團。</p>

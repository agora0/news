  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">4名土庫曼施襲球員罰即時停賽　香港代表團歡迎國際冰總公平處理</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-02-10T18:29:07+08:00" itemprop="datePublished">Feb 10, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>哈爾濱亞冬會冰球賽，有港隊球員在賽後握手環節，被土庫曼球員圍毆受傷，4名涉事的土庫曼球員，被判罰即時停賽，不能再參與其餘賽事。</p>

<p>中國香港代表團表示，歡迎國際冰球總會迅速回應、公平處理事件；3名受襲的港隊球員屬於輕傷，治療後並無大礙，今晚將如期出戰對吉爾吉斯的8強賽事。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">本港今個財政年度首10個月赤字599億元</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-02-28T17:03:05+08:00" itemprop="datePublished">Feb 28, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>政府公布，今個財政年度首10個月赤字599億元，當中已計入發行政府債券所得1181億元，以及償還政府債券219億元本金。</p>

<p>期內，整體開支5972億元，收入4411億元。</p>

<p>至1月底，財政儲備6747億元。</p>

<p>政府表示，計及餘下兩個月預期收入及開支，預計2024/25年度赤字將為872億元，財政儲備於3月底將為6473億元。</p>

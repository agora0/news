    <h1 class="post-title p-name" itemprop="name headline">澳門旅遊局：初步了解在台中氣爆事件中澳門居民2死1重傷</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-02-13T15:10:50+08:00" itemprop="datePublished">Feb 13, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>澳門旅遊局表示，高度關注台灣台中市購物商場懷疑氣體爆炸事件，並接到有澳門居民傷亡的通報，初步了解是兩死一重傷，具體情況需進一步核實。</p>

<p>旅遊局發出新聞稿表示，對死者家屬致以深切慰問，現正與家屬聯繫，提供適切協助，並在得悉事件後，即時聯絡了教育及青年發展局及旅遊業界了解情況，跟進事件。據業界回覆，目前無澳門旅行團在當地。</p>

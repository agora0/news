  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">亞冬會：國家隊冬季兩項女子4X6公里接力再添一金</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-02-13T17:31:59+08:00" itemprop="datePublished">Feb 13, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>在哈爾濱舉行的亞洲冬季運動會，冬季兩項女子4X6公里接力，唐佳琳、文穎、褚源蒙、孟繁棋一同為國家隊奪得今屆第32金。</p>

<p>第九屆亞冬會將會於明日閉幕，閉幕式在哈爾濱國際會展體育中心上演，製作團隊指閉幕式會以「望春」，呼應開幕式的「守冬」，寓意「冬去春來，生生不息」，共同展望屬於亞洲的繁榮發展與美好未來。</p>

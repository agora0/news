  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">調查：上月英國家庭通脹預期下降</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-02-07T09:11:08+08:00" itemprop="datePublished">Feb 7, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>有調查顯示，1月份英國家庭對一年後通脹率的預期降至3.5%，按月下跌0.2個百分點，結束早前連續攀升的趨勢；英國家庭對5-10年後通脹率預期亦下降0.2個百分點，降至3.7%。</p>

<p>調查機構之一的花旗銀行表示，市場對未來通脹率預期似乎保持穩定，但數據仍令人擔憂。隨著總體通脹率未來幾個月內明顯加快，基礎通脹變化的不確定性可能在未來數月仍然較高。</p>

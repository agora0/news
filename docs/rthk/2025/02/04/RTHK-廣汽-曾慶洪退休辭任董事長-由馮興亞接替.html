  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">廣汽：曾慶洪退休辭任董事長　由馮興亞接替</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-02-04T19:04:23+08:00" itemprop="datePublished">Feb 4, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>廣汽發公告指，收到董事長曾慶洪的辭職函，由於他已屆退休年齡，故申請辭任董事長、董事、董事會戰略委員會主任委員及委員職務。辭任上述職務後，曾慶洪將不在集團任職。</p>

<p>廣汽同時宣布，經董事會會議審議通過，公司執行董事馮興亞獲選舉為董事會新任董事長，已於周一生效。</p>

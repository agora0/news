    <h1 class="post-title p-name" itemprop="name headline">中美外長或本月於紐約會晤</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-02-04T18:35:31+08:00" itemprop="datePublished">Feb 4, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>中國常駐聯合國代表傅聰表示，外長王毅將在本月18日到紐約聯合國總部，主持一場討論多邊主義及全球管治的安理會會議，如果美國國務卿魯比奧到時在紐約，會是中美外長會面良機。</p>

<p>另外，傅聰表示，中美兩國能夠在很多事情合作，包括人工智能。他反問美國，除了華為、TikTok及DeepSeek，還有多少產品想禁制。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">梵蒂岡：教宗方濟各在醫院度過平靜一晚正在休息</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-02-26T15:52:03+08:00" itemprop="datePublished">Feb 26, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>梵蒂岡最新表示，感染肺炎的教宗方濟各在醫院度過平靜一晚，並正在休息。</p>

<p>88歲的方濟各在羅馬留醫超過十日。梵蒂岡在昨晚的聲明中說，方濟各仍然危殆但情況穩定，沒有出現急性呼吸道發作，心率和血壓等指數維持穩定。</p>

<p>方濟各本月14日因呼吸困難入院，隨後病情惡化，過去的周末曾經出現呼吸危機，需要接受高濃度輸氧和輸血治療。</p>

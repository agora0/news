    <h1 class="post-title p-name" itemprop="name headline">《環看天下》：德國大選由聯盟黨勝出　柏林未來外交取態惹關注</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-02-26T09:21:43+08:00" itemprop="datePublished">Feb 26, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>德國大選塵埃落定，由屬於保守派的聯盟黨勝出。領導聯盟黨的默茨，有望成為下任總理。另一方面，極右翼政黨另類選擇黨歷史性躍升成為德國議會第二大黨。</p>

<p>默茨在勝選後表明，希望推動歐洲逐步擺脫對美國的依賴。外界關注，下屆柏林政府的外交政策取向。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">天文台：早上寒冷　日間最高氣溫約17度</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-02-09T09:08:38+08:00" itemprop="datePublished">Feb 9, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>天文台科學主任麥佩緹表示，受強烈冬季季候風影響，本港今早寒冷，多處地區氣溫下降至10度左右，新界氣溫低一、兩度，高地氣溫顯著較低，大帽山錄得的最低氣溫為3.6度。</p>

<p>麥佩緹表示，預計今日天氣大致天晴，非常乾燥，早上寒冷，日間最高氣溫大概17度左右，吹和緩至清勁北風，今晚東風會增強。</p>

<p>天文台展望明日大致天晴和乾燥，隨後一、兩日雲量增多，較為潮濕，氣溫逐漸回升。</p>

    <h1 class="post-title p-name" itemprop="name headline">俄副外長：俄美計劃未來兩周舉行相關部門負責人磋商</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-02-23T00:13:32+08:00" itemprop="datePublished">Feb 23, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>俄羅斯外交部副部長里亞布科夫說，俄美兩國計劃未來兩周內舉行相關部門負責人磋商。</p>

<p>里亞布科夫接受俄新社採訪時說，俄美雙方原則上同意舉行相關全面磋商，以系統、詳細地處理一系列所謂敏感問題。俄方已向美方證實願盡快啟動這項工作。雙方已就在副部長級對話之前舉行相關部門負責人磋商一事達成理解，磋商可能未來兩周內在第三國舉行，具體地點正在商定。</p>

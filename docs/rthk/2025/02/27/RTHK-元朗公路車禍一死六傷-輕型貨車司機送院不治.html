    <h1 class="post-title p-name" itemprop="name headline">元朗公路車禍一死六傷　輕型貨車司機送院不治</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-02-27T09:57:48+08:00" itemprop="datePublished">Feb 27, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>元朗公路發生7車相撞意外，1人死亡、6人受傷。</p>

<p>事發在早上約7時半，現場是元朗公路往上水方向近十八鄉交匯處，意外涉及私家車及貨車，一名輕型貨車男司機被困，救援人員接報到場將他救出，送往博愛醫院搶救後不治。</p>

<p>意外中另有6人受傷需要送院，包括3男2女以及1名男童。</p>

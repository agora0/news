  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">《環看天下》：美歐就獲烏克蘭礦產各提協議　分析：美歐嫌隙加深</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-02-27T08:49:03+08:00" itemprop="datePublished">Feb 27, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>美國總統特朗普表示，美國和烏克蘭之間的礦產協議即將達成，據報烏克蘭總統澤連斯基最快星期五，可能前往華盛頓簽署協議。歐盟亦提出有關烏克蘭礦產資源的協議，但否認是要同美國競爭。</p>

<p>有分析認為，歐盟同美國近期在處理烏克蘭問題上，分歧明顯進一步加深，不排除雙方近年持續緊密的關係，隨著特朗普第二次入主白宮後，再次受到動搖。</p>

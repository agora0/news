  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">截至晚上9時本港逾102萬人次出入境　入境佔逾53萬人次</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-02-01T22:38:18+08:00" itemprop="datePublished">Feb 1, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>截至晚上9時，有超過102萬人次經各口岸進出本港，當中入境人次超過53萬，出境人次超過48萬。</p>

<p>入境方面，最多人經羅湖入境，超過9萬人次，其次是落馬洲支線。出境方面，以港珠澳大橋最多，有超過8萬人次，其次是落馬洲支線。</p>

<p>當局早前預計，明天為入境高峰期，預料有64萬人次入境，下午時段會有較多旅客入境，預計輪候時間較長。</p>

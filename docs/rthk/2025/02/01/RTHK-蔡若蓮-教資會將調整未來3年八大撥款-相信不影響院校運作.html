  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">蔡若蓮：教資會將調整未來3年八大撥款　相信不影響院校運作</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-02-01T12:27:36+08:00" itemprop="datePublished">Feb 1, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>教育局局長蔡若蓮表示，政府財政正面對挑戰，教資會未來3年對8間大學的撥款將有所調整，但相信不會影響院校運作及競爭力。</p>

<p>近年政府各項人才計劃帶動專才子女來港就學，蔡若蓮說，正檢視專上院校取錄學生時的「本地生定義」，會考慮本地生設有不同的學費收費層級。</p>

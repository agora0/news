    <h1 class="post-title p-name" itemprop="name headline">宏福苑五級火｜保監局設專責組協調保險公司接觸傷者及受影響家庭</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-12-03T18:23:46+08:00" itemprop="datePublished">Dec 3, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>保監局表示，已成立專責小組，協調保險公司接觸大埔宏福苑火災傷者及受影響家庭成員，以及找尋受影響人士的保單，認為業界反應快及非常合作。</p>

<p>保險業聯會表示，一般在香港的保險公司都會投保再保險，以分散風險，相信事件不會對單一保險公司造成龐大財務損失。</p>

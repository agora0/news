  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">印尼首都雅加達一座建築物發生大火　據報21人死亡</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-12-09T19:50:41+08:00" itemprop="datePublished">Dec 9, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>印尼首都雅加達中部一座建築物發生大火，當地傳媒報道，已造成21人死亡。初步相信火警是建築物內一塊電池首先起火引致。</p>

<p>報道說，發生火警的建築物有7層，火警發生時，有多人被困，救援人員用救援雲梯疏散多人。</p>

<p>報道引述雅加達警方說，事發在當地中午12時30分左右，建築物一個倉庫內有一塊電池首先起火，員工試圖滅火但未能成功。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">日本東京都一個動物園據報有隻狼逃脫　園方暫停遊客入園</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-12-28T11:45:23+08:00" itemprop="datePublished">Dec 28, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>日本東京都日野市多摩動物園飼養的一隻狼，據報從圍欄中逃脫，暫無人員傷亡報告。</p>

<p>日本傳媒報道，事發在當地今早10時左右，飼養員向園方報告一隻狼逃到遊客區。經確認，逃脫的狼仍在動物園內，園方正在搜捕。目前多摩動物園已暫停遊客入園，園區呼籲園內所有遊客留在安全地點。</p>

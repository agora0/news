  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">宏福苑五級火｜建造業議會：承建商須按ISO標準為棚網採樣</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-12-12T18:34:43+08:00" itemprop="datePublished">Dec 12, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>政府提出監管外牆棚網新制度，建造業議會表示，承建商須按ISO標準為棚網採樣，數量、採樣位置及方法等均有規定，相信可以大大提升棚網質量保證。</p>

<p>建造業總工會就指，早前政府要求拆除棚網時，相關工人工資已上漲不少，預料日後安裝棚網時，承建商亦會面對相同情況。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">內地代購稱今年雙十一整體生意較以往差　學者料補貼或抵銷吸引力</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-12-29T12:56:15+08:00" itemprop="datePublished">Dec 29, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>中央政策繼續推動內需，而多個電商平台近兩個月的「雙十一」、「雙十二」再推折扣促銷，不過，有內地消費者認為優惠不太吸引。</p>

<p>有做代購平台的人士指，今年整體平均生意較以往差，「雙十一」期間提供更多優惠，並延長優惠期，生意額才上升。</p>

<p>有學者分析，政府早前補貼刺激內需，抵銷了「雙十一」對消費者的吸引力；而持續增加內需，需先有穩定經濟政策。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">公院病理學檢驗元旦起推共付模式　醫管局：逾九成檢查毋須收費</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-12-23T18:29:15+08:00" itemprop="datePublished">Dec 23, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>醫管局明年1月1日起，實施公營醫療收費改革，公立醫院的病理學檢驗服務將會引入共付收費模式，主要分三層，基礎項目包括日常慢性病需要驗血和血脂等，維持免費，其餘兩層收費每項50至200元不等。</p>

<p>醫管局說，在新收費安排下，超過九成檢驗都屬於基礎項目，可以免費。如病人有經濟困難，可以申請減免。</p>

    <h1 class="post-title p-name" itemprop="name headline">海關從印尼空運到港貨物檢獲34隻瀕危物種活蜥蝪</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-12-10T17:47:58+08:00" itemprop="datePublished">Dec 10, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>海關在機場檢獲34隻懷疑受管制屬瀕危物種的活蜥蝪，估計市值約2萬400元。</p>

<p>關員昨日檢查一批由印尼進口至香港，報稱載有包裝物料的空運貨物。經檢查後，發現該批懷疑受管制屬瀕危物種的活蜥蝪被藏於一個木盒的暗格内。</p>

<p>案件已轉交漁農自然護理署跟進。</p>

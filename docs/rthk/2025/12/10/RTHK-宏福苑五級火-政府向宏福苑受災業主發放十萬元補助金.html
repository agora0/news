    <h1 class="post-title p-name" itemprop="name headline">宏福苑五級火｜政府向宏福苑受災業主發放十萬元補助金</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-12-10T18:17:58+08:00" itemprop="datePublished">Dec 10, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>政府宣布向大埔宏福苑受火災影響業主發放每戶十萬元補助金。政務司副司長卓永興表示，接觸到有宏福苑業主靠出租單位收入，應付日常開支，亦有業主剛投入資金裝修單位，希望向他們提供支援。</p>

<p>卓永興又透露，「大埔宏福苑援助基金」已收到31億元外界捐款，連同政府的3億元啟動資金，基金至今共有約34億元，當中各項支援措施的承擔額約佔四億六千多萬元。</p>

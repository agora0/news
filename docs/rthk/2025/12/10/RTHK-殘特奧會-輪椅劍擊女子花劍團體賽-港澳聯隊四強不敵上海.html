  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">殘特奧會｜輪椅劍擊女子花劍團體賽　港澳聯隊四強不敵上海</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-12-10T15:22:48+08:00" itemprop="datePublished">Dec 10, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>在馬鞍山體育館舉行的殘特奧會輪椅劍擊女子花劍團體賽，由香港與澳門組成的聯隊，四強以18:45不敵上海隊，將轉戰銅牌賽。</p>

<p>港澳聯隊派出余翠怡、湯雅婷和林嘉雯出場，面對強敵上海，首四節之後，已經落後5:20，余翠怡第二次上場，雖然在第五節由對手手上取得5分，但聯隊未能保持氣勢，最終以27分差距落敗。</p>

<p>港澳聯隊銅牌戰對手是江蘇隊。</p>

  <div class="post-content e-content" itemprop="articleBody">
    <p>《蘋果日報》3間公司被裁定一項「串謀發布煽動刊物罪」及一項「串謀勾結外國勢力罪」罪名成立。</p>

<p>控罪指，被告及黎智英於2019年4月1日至2021年6月24日，串謀6名《蘋果日報》前高層及其他人刊印、發布、出售、要約出售、分發、展示或複製煽動刊物，以及串謀請求外國機構、組織或人員，對香港特區或中華人民共和國實施制裁、封鎖或其他敵對行動。</p>

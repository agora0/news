    <h1 class="post-title p-name" itemprop="name headline">除夕中環有倒數活動　公共交通延長服務時間</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-12-31T18:15:00+08:00" itemprop="datePublished">Dec 31, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>旅發局今晚於中環舉行跨年倒數活動，多項公共交通都會延長服務時間，其中港鐵多條路綫會通宵行駛，東鐵綫前往羅湖站的尾班車，會於凌晨0時56分於金鐘站開出。</p>

<p>有市民外出逛街、看戲，迎接新年。有內地旅客特地來港體驗倒數活動氛圍。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">財政部明年首季擬發行4期超長期國債</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-12-31T18:09:15+08:00" itemprop="datePublished">Dec 31, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>財政部公布明年首季國債發行計劃，預計季內發行1至10年期國債共18期，每個月發行6期；超長期限國債共發行4期，當中1至3月每月發行1期30年期，3月亦會發行1期50年期國債。</p>

<p>另外，明年首季會發行19期短期國債，亦會發行一次性憑證式儲蓄國債。</p>

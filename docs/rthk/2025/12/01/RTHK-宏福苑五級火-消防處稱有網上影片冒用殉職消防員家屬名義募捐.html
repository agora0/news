  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">宏福苑五級火｜消防處稱有網上影片冒用殉職消防員家屬名義募捐</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-12-01T18:15:02+08:00" itemprop="datePublished">Dec 1, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>消防處表示，近日網上流傳一段不明來歷影片，冒用殉職消防員何偉豪家屬名義進行募捐，並使用與家屬真實銀行戶口姓名極其相似的名字，企圖詐騙。消防處已即時將個案轉介至警方跟進。</p>

<p>消防處說，如市民欲向殉職屬員的家屬捐款，可存入何偉豪父親何勝的銀行戶口；或簽發支票，抬頭郵寄或親身遞交消防處轉交。</p>

    <h1 class="post-title p-name" itemprop="name headline">宏福苑五級火｜有災民稱專屬社工可供情緒支援和處理生活所需</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-12-25T12:38:30+08:00" itemprop="datePublished">Dec 25, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>社署透過「一戶一社工」安排為大埔宏福苑居民提供支援。有居民認為，專屬社工提供情緒支援和處理生活所需，有助減少徬徨和無助。</p>

<p>有專屬社工說，面對今次大型災難，居民情緒不穩，希望給予承諾，陪伴和聆聽感受，面對漫長前路。</p>

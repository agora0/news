    <p class="post-meta">
      <time class="dt-published" datetime="2025-12-25T11:09:59+08:00" itemprop="datePublished">Dec 25, 2025

  <div class="post-content e-content" itemprop="articleBody">
    <p>俄羅斯黑海港口有石油存儲缸遇襲起火。</p>

<p>位於俄國西南部的克拉斯諾達爾邊疆區政府指，黑海沿岸捷姆留克區一處港口，有兩個石油存儲缸，遭無人機襲擊，火場面積2000平方米，暫時相信未有傷亡報告。</p>

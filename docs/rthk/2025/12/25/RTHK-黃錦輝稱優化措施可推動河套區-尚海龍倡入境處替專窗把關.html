    <h1 class="post-title p-name" itemprop="name headline">黃錦輝稱優化措施可推動河套區　尚海龍倡入境處替專窗把關</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-12-25T12:38:03+08:00" itemprop="datePublished">Dec 25, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>創新科技署推出科技人才入境計劃的優化措施，中大工程學院副院長兼立法會議員黃錦輝形容，是落實港深創新及科技園的重要配套，相信可推動河套區發展。</p>

<p>香港高才通人才服務協會創會會長兼立法會議員尚海龍表示，為港深創新及科技園增設申請專窗服務是重要看點，建議由入境處負責專窗服務的把關工作，增加公信力。</p>

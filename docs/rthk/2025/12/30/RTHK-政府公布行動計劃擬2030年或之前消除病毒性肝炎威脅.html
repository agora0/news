  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">政府公布行動計劃擬2030年或之前消除病毒性肝炎威脅</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-12-30T12:38:50+08:00" itemprop="datePublished">Dec 30, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>政府公布《2025-2030年香港病毒性肝炎行動計劃》，對接世衞制訂的全球目標，以期在2030年或之前，消除這種公共衞生威脅。</p>

<p>政府目標是9成乙肝或丙肝患者獲得診斷，而每年死於病毒性肝炎的人數減少至每10萬人口中，少於6人。</p>

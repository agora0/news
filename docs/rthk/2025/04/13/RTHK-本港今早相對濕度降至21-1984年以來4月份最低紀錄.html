  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">本港今早相對濕度降至21% 　1984年以來4月份最低紀錄</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-04-13T09:54:27+08:00" itemprop="datePublished">Apr 13, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>天文台表示，今早多處地區的相對濕度下降至30%或以下，而截至上午9時40分，天文台的相對濕度曾下降至21%，是天文台總部自1984年設置自動氣象站以來4月份的最低紀錄。</p>

<p>天文台說，東北季候風正為廣東沿岸帶來非常乾燥的天氣。受沙塵天氣影響，廣東部分地區能見度較低。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">澤連斯基：烏克蘭「技術團隊」將於華盛頓與美方就礦產協議磋商</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-04-10T08:51:03+08:00" itemprop="datePublished">Apr 10, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>烏克蘭媒體報道，總統澤連斯基表示，烏克蘭的「技術團隊」將會在美國首都華盛頓與美方就礦產協議展開磋商。</p>

<p>澤連斯基說，團隊很可能由經濟部副部長卡奇卡率領，與美方的就技術性問題進行首次磋商，烏方願意在準備達成協議的基礎上進行討論。</p>

<p>報道又引述外媒指，由烏克蘭經濟部、外交部、司法部和財政部代表組成的談判團隊將於星期五及星期六訪問美國。</p>

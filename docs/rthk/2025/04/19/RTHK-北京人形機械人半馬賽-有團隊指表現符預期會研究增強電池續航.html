    <h1 class="post-title p-name" itemprop="name headline">北京人形機械人半馬賽　有團隊指表現符預期會研究增強電池續航</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-04-19T12:50:48+08:00" itemprop="datePublished">Apr 19, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>全球首個有人形機械人參賽的半馬賽事，早上在北京亦莊舉行。有觀賽的市民形容機械人跑馬拉松，是技術上的一大進步。</p>

<p>首名衝線的機械人以2小時40分鐘完成賽事，團隊指機械人表現符合預期，未來會研究繼續增強電池的續航能力。</p>

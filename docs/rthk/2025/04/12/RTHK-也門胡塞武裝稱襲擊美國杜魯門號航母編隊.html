  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">也門胡塞武裝稱襲擊美國杜魯門號航母編隊</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-04-12T04:31:57+08:00" itemprop="datePublished">Apr 12, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>也門胡塞武裝表示，組織星期五襲擊了部署在紅海北部的美國航母編隊。</p>

<p>發言人薩雷亞說，組織使用巡航導彈和無人機襲擊美國杜魯門號航母及其隨行艦隻，報復美國侵略也門及對也門人民犯下的罪行，又說胡塞武裝將繼續在陸地和海上實施防禦。</p>

<p>胡塞武裝較早時說，美軍當日向也門首都薩那多個目標發動11輪空襲。</p>

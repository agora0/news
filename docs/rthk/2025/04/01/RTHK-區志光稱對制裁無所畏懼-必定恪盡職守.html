  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">區志光稱對制裁無所畏懼　必定恪盡職守</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-04-01T18:06:31+08:00" itemprop="datePublished">Apr 1, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>美國國務院以進行跨國打壓及損害香港自治為由，制裁六名中央和香港特區官員，其中包括特區維護國家安全委員會秘書長區志光。</p>

<p>區志光回應，不會被制裁恫嚇，會繼續堅定履行維護國家安全的光榮任務，無所畏懼。美國的霸權手段進一步證明他所執行任務的方向正確，未來必定恪盡職守，全力維護國家安全，讓香港更安全穩定，不受外來威脅影響。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">警方打鼓嶺村屋搗種植場　檢逾600棵懷疑大麻</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-04-01T17:59:23+08:00" itemprop="datePublished">Apr 1, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>警方在打鼓嶺一間村屋檢獲669棵、重約21公斤的懷疑大麻植物、約5公斤大麻花收成品及大量用作栽植大麻植物的工具和裝備，行動中檢獲的毒品市值約530萬元，拘捕一男一女。</p>

<p>警員昨日下午搜查打鼓嶺坪洋村一間村屋單位，搗破懷疑大麻種植場，拘捕一名43歲女子，其後在元朗拘捕一名42歲男子，兩人涉嫌「栽植大麻植物」及「販運危險藥物」。</p>

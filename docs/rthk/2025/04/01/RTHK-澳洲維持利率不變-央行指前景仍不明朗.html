  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">澳洲維持利率不變　央行指前景仍不明朗</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-04-01T12:02:54+08:00" itemprop="datePublished">Apr 1, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>澳洲央行維持指標利率在4.1厘不變，符合市場預期。</p>

<p>央行說，前景仍不明朗，基礎通脹正在緩和，當務之急是讓通脹回到目標水平，又指貨幣政策仍具限制性。</p>

<p>央行提到，海外前景不確定性仍很大，美國最近宣布的關稅措施影響全球信心，若關稅範圍擴大，影響或會加劇。</p>

<p>央行又說，如果國際形勢對澳洲經濟活動產生重大影響，貨幣政策將能夠很好地應對。</p>

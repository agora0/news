  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">《環看天下》：日本總人口連續14年減少　東京人口持續上升</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-04-16T10:15:45+08:00" itemprop="datePublished">Apr 16, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>日本政府公布，去年10月包括外國居民在內的總人口，錄得大約有1億2300萬人，人口連續14年減少。當中日本公民佔大約1億2千萬，減少接近90萬人。</p>

<p>另一方面，東京首都圈地區的人口持續上升，但全國其餘地方人口都錄得跌幅。有當地分析認為，數據反映當局早年推出鼓勵年輕人避免集中湧到東京發展，願意留在城鎮生活的政策措施，未見到顯著成效。</p>

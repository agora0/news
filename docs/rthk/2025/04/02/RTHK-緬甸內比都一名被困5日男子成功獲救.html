  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">緬甸內比都一名被困5日男子成功獲救</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-04-02T15:02:25+08:00" itemprop="datePublished">Apr 2, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>緬甸地震救援工作持續，國家管理委員會說，內比都一名被困5日的男子成功獲救。</p>

<p>緬甸消防部門和土耳其救援隊昨天在內比都一棟倒塌的酒店廢墟中開始救援。被困男子26歲，是酒店工作人員，他今天凌晨零時30分左右獲救。</p>

<p>救援人員正在努力搜救其他被困人士。</p>

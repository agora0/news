  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">民進黨稱「零關稅」與美談判　國台辦批令台灣「任美宰割」</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-04-30T18:38:10+08:00" itemprop="datePublished">Apr 30, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>在北京，國台辦發言人回應有關賴清德聲稱以「零關稅」為基礎，與美方展開貿易協商的提問，批評民進黨當局將推動兩岸「脫鉤斷鏈」作為與美國談判籌碼，只會讓台灣更加「任美宰割」。</p>

<p>發言人又指「外人靠不住」，呼籲島內產業與農漁民，多來大陸融合發展。</p>

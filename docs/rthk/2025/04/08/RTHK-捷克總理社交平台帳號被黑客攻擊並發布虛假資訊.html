    <h1 class="post-title p-name" itemprop="name headline">捷克總理社交平台帳號被黑客攻擊並發布虛假資訊</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-04-08T19:17:32+08:00" itemprop="datePublished">Apr 8, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>捷克總理菲亞拉的社交平台「X」帳號被黑客攻擊，並發布虛假資訊。</p>

<p>菲亞拉的帳號當地今早6時左右，發布一則帖文，提到俄羅斯軍隊襲擊位於加里寧格勒邊境附近的捷克軍隊，該帖文其後被刪除。</p>

<p>捷克政府辦公室發言人表示，有關帖文的內容不實，又說即使當局採取所有安全措施預防被黑客攻擊，但都未能倖免，目前正調查事件。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">《環看天下》：南韓擬6月3日總統選舉　議長倡修憲分散總統權力</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-04-08T10:18:51+08:00" itemprop="datePublished">Apr 8, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>南韓憲法法院上星期通過彈劾尹錫悅的裁決，他即時被罷免總統職務。南韓傳媒報道，政府初步定於6月3日舉行下任總統選舉。</p>

<p>尹錫悅去年底運用總統權力宣布戒嚴令，引發軒然大波。國會議長日前提議，在總統選舉當日同步進行公投，尋求修憲限制總統權力。早前亦有人提出應該修憲，解決朝野政黨嚴重分化的問題。</p>

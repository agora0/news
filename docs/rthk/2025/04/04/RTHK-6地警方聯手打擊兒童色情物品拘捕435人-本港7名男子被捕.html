    <h1 class="post-title p-name" itemprop="name headline">6地警方聯手打擊兒童色情物品拘捕435人　本港7名男子被捕</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-04-04T18:45:10+08:00" itemprop="datePublished">Apr 4, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>本港警方聯同日本、南韓、新加坡等合共6個地方的執法機關，聯手打擊兒童色情物品，拘捕435人。</p>

<p>當中本港警方拘捕7名涉案男子，其中一名被捕少年，涉嫌在其11歲妹妹知情之下，拍攝她的不雅照片。</p>

    <h1 class="post-title p-name" itemprop="name headline">屯門公路往九龍方向有跑車起火　女司機無受傷</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-04-11T16:48:44+08:00" itemprop="datePublished">Apr 11, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>屯門公路往九龍方向近珠海學院有跑車起火，女司機及時離開車廂，沒有受傷，現場交通受影響。</p>

<p>警方表示，下午3時許接獲女事主報案指，駛至珠海學院附近時，發現跑車起火，隨即下車及報案。</p>

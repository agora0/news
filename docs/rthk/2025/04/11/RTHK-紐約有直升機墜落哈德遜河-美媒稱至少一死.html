    <h1 class="post-title p-name" itemprop="name headline">紐約有直升機墜落哈德遜河　美媒稱至少一死</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-04-11T04:36:24+08:00" itemprop="datePublished">Apr 11, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>美國紐約有直升機墜落哈德遜河，哥倫比亞廣播公司報道，至少一人死亡。</p>

<p>事發在當地星期四下午3時15分左右，社交媒體上的影片顯示，直升機大部分沉入水中，機身上下反轉。有目擊者說，事發時聽到巨響。</p>

<p>航班追蹤網站數據顯示，直升機墮河前在空中飛行約15分鐘。報道引述紐約市警方說，直升機上當時有最少6人，包括三名成人和三名兒童。</p>

    <h1 class="post-title p-name" itemprop="name headline">聶新平稱橫琴可與香港在財富管理方面展開合作</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-04-29T12:27:25+08:00" itemprop="datePublished">Apr 29, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>廣東省橫琴辦主任聶新平表示，澳門與橫琴要成為實現國家高水平對外開放的新平台，未來會出台相應政策，支持企業走出去。</p>

<p>他又說，橫琴可以與香港在財富管理方面展開合作，又歡迎香港青年到橫琴粵澳深度合作區創業。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">當局建議引入嚴重濫用公屋新罪行　何永賢稱為加強罰則</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-04-17T18:38:45+08:00" itemprop="datePublished">Apr 17, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>當局為打擊濫用公屋，提出修訂《房屋條例》建議引入「嚴重濫用公屋」的新罪行。</p>

<p>房屋局局長何永賢強調，是為了加強罰則，停止有人並非在單位租住但出租等行為。至於在單位從事商業行為，她表示，要視乎有否造成滋擾等程度。如視作小店舖，當局可直接發出遷出通知書。</p>

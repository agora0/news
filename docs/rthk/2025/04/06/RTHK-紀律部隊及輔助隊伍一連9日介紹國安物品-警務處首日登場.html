  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">紀律部隊及輔助隊伍一連9日介紹國安物品　警務處首日登場</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-04-06T10:20:00+08:00" itemprop="datePublished">Apr 6, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>本月15日是全民國家安全教育日，6支紀律部隊和兩個輔助隊伍由今日起一連9日，發布影片介紹部門具意義的國家安全物品。</p>

<p>首日的影片由警務處介紹「國安號」國家安全展覽，展覽模擬高鐵列車車廂，寓意國家安全猶如高鐵連繫內地與香港，與市民息息相關。</p>

<p>影片介紹香港警察學院，形容是每位警務人員工作的起點，至於國安處就是警方專責維護國家安全的部門。</p>

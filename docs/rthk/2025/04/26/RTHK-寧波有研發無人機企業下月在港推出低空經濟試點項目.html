  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">寧波有研發無人機企業下月在港推出低空經濟試點項目</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-04-26T12:32:59+08:00" itemprop="datePublished">Apr 26, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>行政長官李家超近日率團訪問浙江，促進浙港兩地合作。在寧波，有研發無人機的企業，下月將於香港推出低空經濟試點項目，負責人說，公司在內地已累積一定經驗，不擔心項目在港落地會有困難。他又認為浙港政府成立合作機制，有利低空經濟行業發展。</p>

<p>工業專員葛明表示，本港面對經濟轉型、產業升級的壓力，更多內地從事新興產業的公司落戶香港，將會為創科生態帶來新啟示。</p>

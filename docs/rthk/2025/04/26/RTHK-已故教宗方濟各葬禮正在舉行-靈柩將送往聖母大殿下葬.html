  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">已故教宗方濟各葬禮正在舉行　靈柩將送往聖母大殿下葬</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-04-26T16:27:39+08:00" itemprop="datePublished">Apr 26, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>已故教宗方濟各的葬禮在梵蒂岡聖伯多祿大殿前的石階舉行。</p>

<p>殯葬彌撒在本港時間下午4時過後開始，方濟各的靈柩從大殿抬出聖伯多祿廣場，現場響起掌聲。</p>

<p>150多個國家的政要、王室成員及數萬信眾出席儀式，預計儀式持續大約90分鐘。</p>

<p>意大利警方表示，約有14萬人聚集在聖伯多祿廣場及周邊街道向教宗致意。</p>

<p>儀式結束後，教宗的靈柩將送往羅馬聖母大殿下葬。</p>

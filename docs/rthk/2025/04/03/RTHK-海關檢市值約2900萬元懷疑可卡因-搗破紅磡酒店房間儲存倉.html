    <h1 class="post-title p-name" itemprop="name headline">海關檢市值約2900萬元懷疑可卡因　搗破紅磡酒店房間儲存倉　</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-04-03T16:26:41+08:00" itemprop="datePublished">Apr 3, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>海關在紅磡搗破一個懷疑毒品儲存倉，檢獲約34公斤懷疑可卡因，估計市值約2900萬元，拘捕一名23歲男子。</p>

<p>海關人員昨天下午在紅磡進行反毒品行動，在一間酒店內截查一名男子，在他手持的膠袋內檢獲約2公斤懷疑可卡因，將他拘捕。關員其後押解該名到酒店內一個房間搜查，再檢獲約32公斤懷疑可卡因。</p>

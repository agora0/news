  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">消防處呼籲小心處理燃點燈籠蠟燭　不要煲蠟</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-10-06T17:05:47+08:00" itemprop="datePublished">Oct 6, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>消防處表示，市民要時刻保持防火意識，千萬不要煲蠟、不要玩火，要小心處理燃點的燈籠蠟燭，不要隨便棄置，以及記得確保火種徹底熄滅才離開。</p>

<p>消防處在社交網頁說，萬一遇上山火，切勿向山火蔓延方向逃生、向植物較稀疏地方走避、安全情況下報警求助。即使山火在前方遠處，仍應馬上離開。</p>

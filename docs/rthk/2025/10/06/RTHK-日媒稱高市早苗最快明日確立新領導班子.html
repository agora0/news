    <h1 class="post-title p-name" itemprop="name headline">日媒稱高市早苗最快明日確立新領導班子</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-10-06T12:36:02+08:00" itemprop="datePublished">Oct 6, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>日本自民黨新當選總裁高市早苗著手安排黨內高層和內閣成員，前首相麻生太郎可能擔任副總裁。</p>

<p>共同社引述相關人士透露，麻生派的總務會長鈴木俊一可能擔任黨幹事長，而在黨總裁選舉落敗的前幹事長茂木敏充，亦可能會在高市獲任命為首相後，擔任內閣職務。預計新的領導班子最快將在明日確立。</p>

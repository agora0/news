    <h1 class="post-title p-name" itemprop="name headline">ADP新發布每周美國就業數據　首次估算新增職位逾1.4萬個</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-10-28T21:46:58+08:00" itemprop="datePublished">Oct 28, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>人力資源顧問公司ADP發布全新的美國就業初步估值數據，顯示截至本月11日的四個星期，私人市場平均新增就業職位有14250個。</p>

<p>新數據今日起逢星期二公布，提供私人市場就業變動四星期移動平均值，數據為滯後兩星期，並基於逾2600萬名私人市場僱員的匿名薪酬數據。</p>

<p>至於每月ADP全國就業報告就維持於每月的第一個星期三公布。</p>

    <h1 class="post-title p-name" itemprop="name headline">哈馬斯同意加沙和平方案部分內容　特朗普：中東和平已非常接近</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-10-04T18:33:42+08:00" itemprop="datePublished">Oct 4, 2025

  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>巴勒斯坦武裝組織哈馬斯同意美國總統特朗普提出的加沙和平方案部分內容，但並沒有提及是否同意解除武裝。</p>

<p>特朗普就在社交平台發布影片，形容這是大日子，認為中東和平已非常接近實現，感謝多個國家的努力。</p>

    <h1 class="post-title p-name" itemprop="name headline">立陶宛維爾紐斯機場懷疑受氣球影響要暫停</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-10-05T09:22:35+08:00" itemprop="datePublished">Oct 5, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>立陶宛維爾紐斯機場懷疑受到氣球飛入而要暫停空中交通，航班需要轉飛至鄰國。</p>

<p>機場營運商在社交平台說，多個汽球飛近機場，導致航班受到影響，有客機轉飛至拉脫維亞和波蘭，預計關閉時間將持續至當地星期日凌晨，比之前的預計長了兩個小時。</p>

<p>近期多個歐洲機場受到無人機干擾，導致空中交通混亂，包括哥本哈根和慕尼黑機場。</p>

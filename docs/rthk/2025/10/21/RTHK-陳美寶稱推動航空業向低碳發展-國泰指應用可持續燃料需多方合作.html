    <h1 class="post-title p-name" itemprop="name headline">陳美寶稱推動航空業向低碳發展　國泰指應用可持續燃料需多方合作</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-10-21T18:38:13+08:00" itemprop="datePublished">Oct 21, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>運輸及物流局局長陳美寶表示，將全力跟進貨機墮海事故及善後工作，亦會以同樣的全力以赴精神，推動航空業邁向低碳及綠色發展。</p>

<p>國泰集團行政總裁林紹波表示，推動應用可持續航空燃料，需要多方合作。</p>

    <h1 class="post-title p-name" itemprop="name headline">美財長擬推薦3至4名聯儲局主席候選人予特朗普進行面試</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-10-15T22:34:05+08:00" itemprop="datePublished">Oct 15, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>美國財政部長貝森特表示，計劃在感恩節後，向總統特朗普推薦3至4名接替聯儲局主席職位的候選人，由總統進行面試。</p>

<p>貝森特在出席國際貨幣基金組織和世界銀行年會期間的一個活動時表示，特朗普最終像過往一樣，聽取數十甚至數百人的意見，然後作出決定。</p>

<p>被問到合適人選的標準之一，是否要有減息意願時，貝森特表示，其中一個標準是要有開放的心態。</p>

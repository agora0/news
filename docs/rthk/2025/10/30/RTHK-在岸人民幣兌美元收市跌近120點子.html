    <h1 class="post-title p-name" itemprop="name headline">在岸人民幣兌美元收市跌近120點子</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-10-30T17:19:51+08:00" itemprop="datePublished">Oct 30, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>在岸人民幣兌美元收市報7.1107兌1美元，較上日收市跌116點子。中間價亦自1年多高位回落，報7.0864，較市場偏強逾190點子。</p>

<p>交易員指，聯儲局政策基調偏鷹支持美元指數，人民幣受壓，預計短期維持區間上落。</p>

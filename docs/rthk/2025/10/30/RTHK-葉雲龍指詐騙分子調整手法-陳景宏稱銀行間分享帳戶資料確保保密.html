  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">葉雲龍指詐騙分子調整手法　陳景宏稱銀行間分享帳戶資料確保保密</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-10-30T12:42:37+08:00" itemprop="datePublished">Oct 30, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>警方今年首9個月錄得3萬2000多宗詐騙案，連同洗黑錢案共拘捕4500多人。</p>

<p>副處長葉雲龍說，9月案件數量輕微反彈，相信與詐騙份子因應大型活動調整詐騙手法有關。</p>

<p>另外，金管局助理總裁陳景宏說，容許銀行間分享個人帳戶資料的修訂條例下星期一生效，短期內刊憲公布具體操作指引，強調會確保客戶資料保密。</p>

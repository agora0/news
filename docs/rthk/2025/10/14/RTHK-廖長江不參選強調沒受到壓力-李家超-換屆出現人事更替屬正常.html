  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">廖長江不參選強調沒受到壓力　李家超：換屆出現人事更替屬正常</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-10-14T18:43:37+08:00" itemprop="datePublished">Oct 14, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>立法會議員廖長江，宣布不會參選新一屆立法會選舉，認為現時是合適時候交棒。他下午回應記者追問時強調，退選絕對沒有受到壓力，而是因為有其他事情要做，時間上未必可以兼顧到。</p>

<p>對於多名立法會議員決定不參選。行政長官李家超說，任何組織因換屆而出現人事更替屬於正常，他尊重議員的決定，他又說，沒收到身兼行會成員的議員表示會提早辭任。</p>

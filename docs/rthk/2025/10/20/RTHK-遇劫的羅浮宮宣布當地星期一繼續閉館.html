  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">遇劫的羅浮宮宣布當地星期一繼續閉館</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-10-20T16:42:28+08:00" itemprop="datePublished">Oct 20, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>法國巴黎羅浮宮說，當地星期一將繼續閉館。</p>

<p>羅浮宮當地星期日早上被搶劫，館方隨後宣佈臨時閉館一日。</p>

<p>當局說8件拿破崙時期珠寶被盜，另一件尋回的珠寶，據報已經受損。警方正追捕4名劫匪。</p>

<p>總統馬克龍說，正竭盡全力追回被盜珍寶，並會將犯案者繩之於法，重申會加強遺產保護。</p>

<p>司法部長承認羅浮宮劫案顯示當局失敗，為法國帶來非常負面的形象。</p>

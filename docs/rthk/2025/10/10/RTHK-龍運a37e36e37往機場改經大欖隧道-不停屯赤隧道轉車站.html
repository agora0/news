  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">龍運A37E36E37往機場改經大欖隧道　不停屯赤隧道轉車站</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-10-10T16:14:13+08:00" itemprop="datePublished">Oct 10, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>九巴表示，受屯門公路往九龍方向近新墟街市交通意外影響，交通嚴重擠塞，龍運路線A37、E36及E37往機場方向由下午4時起，改經大欖隧道，不停屯門-赤鱲角隧道轉車站。</p>

<p>乘客可致電九巴顧客服務熱線2745 4466、龍運顧客服務路線2261 2791，或使用九巴及龍運網頁www.kmb.hk及智能手機應用程式App1933查詢詳情。</p>

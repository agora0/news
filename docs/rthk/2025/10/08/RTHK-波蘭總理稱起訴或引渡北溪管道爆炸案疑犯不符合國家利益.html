  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">波蘭總理稱起訴或引渡北溪管道爆炸案疑犯不符合國家利益</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-10-08T05:27:40+08:00" itemprop="datePublished">Oct 8, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>波蘭總理圖斯克表示，起訴或引渡北溪天然氣管道爆炸案的一名烏克蘭籍疑犯，不符合波蘭國家利益。</p>

<p>圖斯克在首都華沙會見立陶宛總理魯吉尼埃內後，舉行記者會。</p>

<p>圖斯克指出，波蘭方面拘捕該名烏克蘭男子是按照司法程序，最終決定將由波蘭法院作出，但波蘭政府在事件上的立場沒有改變，幾個月前他已向烏克蘭總統澤連斯基及時任德國總理朔爾茨闡明波方立場。</p>

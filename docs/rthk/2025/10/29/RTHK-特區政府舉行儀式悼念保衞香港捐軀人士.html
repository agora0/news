    <h1 class="post-title p-name" itemprop="name headline">特區政府舉行儀式悼念保衞香港捐軀人士</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-10-29T18:23:35+08:00" itemprop="datePublished">Oct 29, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>今日是重陽節，特區政府早上在香港大會堂紀念花園，舉行官方紀念儀式，悼念於1941至45年間，為保衞香港而捐軀的人士。</p>

<p>公務員事務局局長楊何蓓茵較早時代表特區政府，到浩園悼念因公殉職的公務員，向逝者獻上鮮花，並致以最崇高的敬意及哀思，亦有到景仰園，向菲律賓馬尼拉人質事件的死難者獻花致意。</p>

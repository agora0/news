    <h1 class="post-title p-name" itemprop="name headline">港元拆息接近全線上升　1個月拆息結束5日跌勢</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-10-03T11:36:06+08:00" itemprop="datePublished">Oct 3, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>港元拆息近乎全線上升，只有1年期拆息持平。</p>

<p>樓按相關的1個月拆息反彈約1.8個基點，升至約3.515厘，結束5日跌勢。</p>

<p>隔夜拆息亦反彈2個基點，報3.62厘。</p>

<p>反映銀行資金成本的3個月拆息連升兩日，升至3.589厘，創逾1星期新高，單日升4.9個基點。</p>

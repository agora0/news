  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">許樹昌：夏季流感季節未完或與冬季流感爆發連接　籲盡快接種疫苗</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-10-24T12:29:42+08:00" itemprop="datePublished">Oct 24, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>中大呼吸系統科講座教授許樹昌說，按現時數據，夏季流感季節「未有耐」完結，可能會與冬季流感爆發連接，呼籲市民盡快接種疫苗。他又說，目前主要流行的流感病毒是H3N2，與2024-25年度的不同，社區免疫力降低，因此今年的爆發較為嚴重。</p>

<p>有小學校長指，已與外展機構協調，提早近一個月為學生打針。</p>

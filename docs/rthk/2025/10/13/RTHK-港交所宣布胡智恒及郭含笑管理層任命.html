    <h1 class="post-title p-name" itemprop="name headline">港交所宣布胡智恒及郭含笑管理層任命</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-10-13T17:58:13+08:00" itemprop="datePublished">Oct 13, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>港交所宣布，委任胡智恒為董事總經理兼交易營運主管，他將於下周一加入港交所，負責領導現貨及衍生產品市場的交易營運團隊，將向營運主管徐亮匯報。</p>

<p>另外，港交所委任交易部聯席主管郭含笑，明年起擔任董事總經理兼互聯互通業務主管，她將負責帶領市場部新設立的互聯互通團隊，統籌港交所在各種資產類別下的互聯互通項目，並向市場主管余學勤匯報。</p>

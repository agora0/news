    <h1 class="post-title p-name" itemprop="name headline">上水麒麟村附近一個貨倉三級火警　11人自行疏散暫未有受傷報告</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-10-31T14:37:40+08:00" itemprop="datePublished">Oct 31, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>上水麒麟村附近一個貨倉下午1時許發生火警，並於下午2時03分升為三級，暫時未有接獲受傷報告。</p>

<p>消防員正動用2條喉及2隊煙帽隊灌救，11人自行疏散到安全地方。</p>

<p>消防處表示，如市民受到隨風飄散的煙霧和異味影響，請盡量留在室內及關閉門窗，並保持鎮定。</p>

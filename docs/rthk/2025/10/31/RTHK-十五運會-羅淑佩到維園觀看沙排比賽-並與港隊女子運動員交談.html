    <h1 class="post-title p-name" itemprop="name headline">十五運會｜羅淑佩到維園觀看沙排比賽　並與港隊女子運動員交談</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-10-31T14:19:36+08:00" itemprop="datePublished">Oct 31, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>十五運會香港賽區首個競賽項目沙灘排球比賽，在銅鑼灣維多利亞公園展開。文化體育及旅遊局局長羅淑佩中午到場，與港隊女子沙排運動員交談。</p>

<p>羅淑佩又到露天看台區觀賞賽事，當港隊歐陽瑋欣及袁廷芝對戰江蘇隊並得分時，羅淑佩拍手鼓勵。</p>

<p>沙灘排球共有約104名來自內地、香港和澳門共52支隊伍的運動員參賽，香港派出2男4女運動員作賽。</p>

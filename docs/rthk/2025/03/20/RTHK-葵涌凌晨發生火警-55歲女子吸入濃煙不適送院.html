    <h1 class="post-title p-name" itemprop="name headline">葵涌凌晨發生火警　55歲女子吸入濃煙不適送院</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-03-20T07:15:04+08:00" itemprop="datePublished">Mar 20, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>葵涌凌晨發生火警，1名女子吸入濃煙不適送院，大約30人自行疏散到安全位置。</p>

<p>火警發生在凌晨近2時，警方接報葵涌葵義路14號一個單位有濃煙冒出，消防到場破門入內，將火救熄。單位內一名55歲女子吸入濃煙不適，半昏迷被送往瑪嘉烈醫院治理，其後回復清醒。</p>

<p>經初步調查，相信單位內有電子產品過熱引致火警，現階段並無證據顯示案件涉及刑事成份。</p>

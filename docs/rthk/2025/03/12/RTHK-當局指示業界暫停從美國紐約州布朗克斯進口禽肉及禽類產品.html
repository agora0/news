  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">當局指示業界暫停從美國紐約州布朗克斯進口禽肉及禽類產品</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-03-12T20:34:10+08:00" itemprop="datePublished">Mar 12, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>食物安全中心宣布，因應世界動物衞生組織通報，指美國紐約州布朗克斯縣爆發高致病性H5N1禽流感，中心指示業界暫停從該地區及其附近的紐約州韋斯特切斯特縣進口禽肉，及包括禽蛋的禽類產品。</p>

<p>中心發言人說，根據政府統計處的資料，本港去年從美國進口約79630公噸冰鮮和冷藏禽肉及約1960萬隻禽蛋。</p>

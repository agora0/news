    <h1 class="post-title p-name" itemprop="name headline">廉署拘捕十多名銀行前線職員涉助中介公司騙取按揭貸款轉介費</h1>

  <div class="post-content e-content" itemprop="articleBody">
    <p>廉署拘捕22人，包括18名銀行前線職員，涉嫌協助一間中介公司騙取銀行按揭貸款的轉介費。</p>

<p>廉署說，被捕人士來自10間本地銀行，他們將轉介表格混入申請按揭貸款文件給客戶簽署，騙取銀行向中介公司發放轉介費，而按揭申請人則對貪污勾當毫不知情。</p>

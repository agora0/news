  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">立法會換屆選舉12月7日舉行　選委會界別分組補選9月7日進行</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-03-18T12:14:07+08:00" itemprop="datePublished">Mar 18, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>行政長官李家超宣布，第8屆立法會選舉將定於12月7日舉行，選出90名議員；而在選舉前會舉行選委會界別分組補選，有關補選定於9月7日進行。</p>

<p>李家超說，為確保順利辦好今年兩場重要選舉，已指示政制及內地事務局做好準備，與選管會緊密合作，確保立法會選舉順利舉行。</p>

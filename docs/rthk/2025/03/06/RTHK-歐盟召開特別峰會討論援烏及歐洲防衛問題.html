  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">歐盟召開特別峰會討論援烏及歐洲防衛問題</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-03-06T15:57:13+08:00" itemprop="datePublished">Mar 6, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>歐盟多國領袖召開特別峰會，討論如何支援烏克蘭及歐洲防衛問題。歐盟內唯一擁有核武的國家法國，總統馬克龍在峰會前夕就說，會就法國向歐洲盟國提供「核保護傘」的問題展開戰略討論。</p>

<p>美國日前暫停對烏克蘭的軍事援助後，中央情報局局長拉特克利夫證實美國亦已暫停和烏克蘭分享情報，但他相信最終會恢復，強調美國會繼續與烏克蘭合作，推動和平進程。</p>

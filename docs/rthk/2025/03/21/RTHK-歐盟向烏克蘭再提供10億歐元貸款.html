  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">歐盟向烏克蘭再提供10億歐元貸款</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-03-21T01:53:13+08:00" itemprop="datePublished">Mar 21, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>歐盟委員會表示，向烏克蘭再提供10億歐元貸款，相關貸款將以被凍結的俄羅斯資產收益來償還，連同這筆貸款，歐盟今年來向烏克蘭提供的貸款總額達40億歐元。</p>

<p>歐盟委員會主席馮德萊恩表示，透過提供這筆貸款，歐盟重申對烏克蘭的堅定承諾，強調歐盟正幫助烏克蘭經濟保持正常運轉，重建被破壞的關鍵基礎設施。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">埃及南部有樓宇倒塌至少6死11傷</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-03-21T21:31:25+08:00" itemprop="datePublished">Mar 21, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>埃及南部一座樓宇倒塌，造成至少6人死亡，11人受傷。</p>

<p>事發在艾斯尤特省，省政府發表聲明說，一座3層高的樓宇在當地星期五倒塌，造成死傷，傷者已被送往附近醫院救治。救援人員在瓦礫中搜尋是否有人被困，當局正調查樓宇倒塌原因。</p>

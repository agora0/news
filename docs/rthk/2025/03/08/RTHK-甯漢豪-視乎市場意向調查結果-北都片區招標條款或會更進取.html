  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">甯漢豪：視乎市場意向調查結果　北都片區招標條款或會更進取</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-03-08T12:30:45+08:00" itemprop="datePublished">Mar 8, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>政府正就北部都會區三個片區開發試點做市場意向調查，本月底完結。發展局局長甯漢豪說，有內地開發商提出平整片區產業地後，興建並營運園區，政府會檢視是否屬主流意見，日後招標條款或會更加進取。</p>

<p>另外，甯漢豪重申，交椅洲人工島已開啟的研究可繼續，未開啟的就暫停，相信日後起動工程時有關研究大致不會過時，只需作一些更新即可。</p>

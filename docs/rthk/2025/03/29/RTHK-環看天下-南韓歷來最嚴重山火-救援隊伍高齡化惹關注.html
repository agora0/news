  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">《環看天下》：南韓歷來最嚴重山火　救援隊伍高齡化惹關注</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-03-29T09:39:55+08:00" itemprop="datePublished">Mar 29, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>南韓東南部的山林大火，持續至今一個星期。截至昨日，山火累計範圍據報增至4萬8千公頃，相當於香港面積四成，規模打破了當地紀錄；傷亡人數增至28人，亦是歷來最嚴重。數以萬計居民緊急疏散。</p>

<p>有當地專家認為，災區近日天氣異常乾燥大風、加上樹木品種特别易燃，增加撲救難度。亦有意見關注，參與救火的臨時救援隊伍嚴重高齡化，加上裝備有限，阻礙救火進度。</p>

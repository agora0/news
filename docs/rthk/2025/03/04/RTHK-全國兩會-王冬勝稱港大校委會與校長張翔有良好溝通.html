  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">全國兩會｜王冬勝稱港大校委會與校長張翔有良好溝通</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-03-04T20:43:12+08:00" itemprop="datePublished">Mar 4, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>在北京，身兼港大校委會主席的全國政協委員王冬勝說，1月上任後召開了一次會議，過程順暢，各人有很多討論，認為校委會與校長張翔有良好溝通。</p>

<p>被問到是否代表管治風波已完結，王冬勝說，希望集中將來的事，已有計劃將來如何發展。</p>

<p>港大上年曾發生委任暫委副校長風波，行政長官李家超責成教育局了解事件，其後委任王冬勝出任港大校務委員會主席，今年1月1日起生效。</p>

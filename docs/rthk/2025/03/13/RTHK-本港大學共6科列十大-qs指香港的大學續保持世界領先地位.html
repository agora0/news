  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">本港大學共6科列十大　QS指香港的大學續保持世界領先地位</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-03-13T18:22:48+08:00" itemprop="datePublished">Mar 13, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>國際高等教育資訊機構QS公布最新「世界大學學科排名」，本港大學排名整體上升，合共有6個學科位列十大，以港大牙醫學科排名最高，位列全球第二。</p>

<p>QS表示，香港的大學今年排名表現出色，繼續保持世界領先地位。港大校長張翔表示，今次國際排名反映港大對學術嚴謹堅守，以及對創新知識的追求。</p>

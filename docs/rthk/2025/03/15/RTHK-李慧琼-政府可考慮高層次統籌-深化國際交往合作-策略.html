    <h1 class="post-title p-name" itemprop="name headline">李慧琼：政府可考慮高層次統籌「深化國際交往合作」策略</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-03-15T18:26:14+08:00" itemprop="datePublished">Mar 15, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>國務院總理李強發表的政府工作報告，港澳篇幅提出「深化國際交往合作」，全國人大常委李慧琼認為，特區政府可以考慮高層次統籌「深化國際交往合作」策略，推動民間一齊參與。</p>

<p>在中央惠港措施方面，李慧琼表示，很有信心「一簽多行」陸續有序開放到其他城市。</p>

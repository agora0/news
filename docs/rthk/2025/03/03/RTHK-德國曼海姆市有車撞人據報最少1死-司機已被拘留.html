  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">德國曼海姆市有車撞人據報最少1死　司機已被拘留</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-03-03T21:27:18+08:00" itemprop="datePublished">Mar 3, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>德國西部城市曼海姆有汽車衝向人群，多人受傷倒地，當地傳媒報道，事件造成至少1人死亡。警方說，涉案司機已被拘留，正調查有沒有其他人涉案。</p>

<p>外電報道，事發時，德國多個城市都舉行節慶嘉年華活動。在曼海姆市中心，一架黑色汽車高速衝向聚集的人群。</p>

<p>德國警方說，曼海姆市中心出現危及生命的情況，正在市中心展開搜捕行動，呼籲民眾遠離有關地區。</p>

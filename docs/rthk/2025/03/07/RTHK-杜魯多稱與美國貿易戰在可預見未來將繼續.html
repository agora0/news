  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">杜魯多稱與美國貿易戰在可預見未來將繼續</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-03-07T00:08:37+08:00" itemprop="datePublished">Mar 7, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>加拿大總理杜魯多表示，在可預見的未來，加拿大與美國的貿易戰將繼續。</p>

<p>杜魯多在前一天與美國總統特朗普通電話，他說，加拿大將繼續與特朗普政府的高級官員，就關稅問題進行溝通，並重申目標是取消這些措施。</p>

<p>在特朗普對加拿大商品的關稅星期二生效後，加拿大立即對價值300億加元的美國進口產品徵收25%關稅，杜魯多表示，這些措施將一直實施，直到特普政府結束貿易行動。</p>

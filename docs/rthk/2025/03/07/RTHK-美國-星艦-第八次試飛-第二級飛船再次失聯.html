    <h1 class="post-title p-name" itemprop="name headline">美國「星艦」第八次試飛　第二級飛船再次失聯</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-03-07T08:58:27+08:00" itemprop="datePublished">Mar 7, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>美國太空探索技術公司SpacX新一代重型運載火箭「星艦」當地星期四從得州發射升空，實施第八次試飛。升空後不久，火箭第二級飛船與地面失去聯繫，是連續第二次發生類似情況。</p>

<p>直播畫面顯示，發射後約7分鐘，火箭第一級助推器再次實現發射塔回收，在降落時由發射塔上的機械臂「夾住」，在半空中「捕獲」回收。但火箭第二級飛船失控，隨後與地面團隊失去聯繫，飛船直播畫面中斷。</p>

    <h1 class="post-title p-name" itemprop="name headline">法院批准取消逮捕申請　尹錫悅獲釋</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-03-07T13:28:02+08:00" itemprop="datePublished">Mar 7, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>因涉嫌帶頭發動內亂而被逮捕起訴的南韓總統尹錫悅獲釋。</p>

<p>韓聯社報道，首爾中央地方法院批准尹錫悅撤銷逮捕的申請，尹錫悅將在非羈押狀態下繼續受審。</p>

<p>尹錫悅方面上月4日向法院提出撤銷逮捕申請，法院其後進行審理。尹錫悅一方認為，檢方在羈押期限結束後對他提起公訴是非法，檢方強調起訴過程合法合規。</p>

    <h1 class="post-title p-name" itemprop="name headline">出口日本空運貨物企圖走私金條　海關檢懷疑金條約值4600萬元</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-03-11T17:45:28+08:00" itemprop="datePublished">Mar 11, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>海關在香港機場偵破一宗空運走私懷疑金條案件，檢獲約64公斤懷疑金條，估計市值約4600萬元。案中檢獲走私金條的重量及市值，是海關有紀錄以來最大宗走私金條案件。</p>

<p>海關本月5日在機場海關驗貨場檢查一個準備出口往日本，報稱載有玩具、燈及帽的空運貨物。經查驗後，關員在其中4個紙箱內檢獲該批懷疑走私金條。</p>

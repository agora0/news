  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">《環看天下》：卡尼出任加拿大新總理　同時應對中美關稅勢成考驗</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-03-11T07:33:23+08:00" itemprop="datePublished">Mar 11, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>加拿大執政自由黨選出新黨魁，由被形容為「政治素人」的加拿大央行前行長卡尼勝出，將會接替杜魯多成為新總理。</p>

<p>卡尼強調，政府會維持對美國的報復性關稅措施，不能讓美國總統特朗普的貿易戰威脅得逞。</p>

<p>另外，中國日前作為反制措施，宣布對加拿大部分產品加徵關稅。分析相信，加拿大正同時面對中、美關稅兩條貿易「戰線」，將成為卡尼上台後的重大考驗。</p>

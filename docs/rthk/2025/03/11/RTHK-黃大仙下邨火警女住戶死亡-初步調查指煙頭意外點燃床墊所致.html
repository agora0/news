    <h1 class="post-title p-name" itemprop="name headline">黃大仙下邨火警女住戶死亡　初步調查指煙頭意外點燃床墊所致</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-03-11T16:46:45+08:00" itemprop="datePublished">Mar 11, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>黃大仙下邨早上發生火警，一名女住戶死亡，消防及警方經初步調查，相信上址一間睡房有煙頭意外點燃床墊引致火警。</p>

<p>事發在早上10時許，龍禧樓一個單位起火冒出濃煙，消防接報到場。61歲女住戶臉部及手部燒傷，昏迷送往廣華醫院，其後證實死亡，她的死因有待驗屍後確定。</p>

<p>事件中約有40人自行疏散到安全位置。</p>

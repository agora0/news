  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">俄官員形容澤連斯基於白宮遭訓斥　俄外交部指澤連斯基說謊</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-03-01T06:17:21+08:00" itemprop="datePublished">Mar 1, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>美國總統特朗普與烏克蘭總統澤連斯基在白宮會談期間，氣氛緊張。</p>

<p>俄羅斯聯邦安全會議副主席梅德韋傑夫形容，澤連斯基在白宮遭到嚴厲訓斥。</p>

<p>俄羅斯外交部發言人扎哈羅娃就說，澤連斯基最大的謊言就是聲稱烏克蘭孤立無援，又形容特朗普及副總統萬斯在白宮會見澤連斯基時，能夠克制自己而無對澤連斯基採取行動是一項奇跡。</p>

    <h1 class="post-title p-name" itemprop="name headline">何立峰與美國貿易代表格里爾舉行視像通話</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-03-26T21:56:27+08:00" itemprop="datePublished">Mar 26, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>中美經貿中方牽頭人、國務院副總理何立峰應約與美國貿易代表格里爾舉行視像通話。雙方圍繞落實今年1月17日中美兩國元首通話達成的重要共識，就雙邊經貿領域重要問題坦誠、深入交換意見。中方就美方以芬太尼為由對華加徵關稅、有關301調查以及計劃出台「對等」關稅等表達嚴正關切。雙方認為保持穩定的中美經貿關係符合兩國利益，同意就彼此關心的問題繼續保持溝通。</p>

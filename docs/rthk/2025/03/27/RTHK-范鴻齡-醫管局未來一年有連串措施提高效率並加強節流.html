  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">范鴻齡：醫管局未來一年有連串措施提高效率並加強節流</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-03-27T22:40:18+08:00" itemprop="datePublished">Mar 27, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>醫管局在新一個財政年度，獲近一千億元經常撥款。醫管局主席范鴻齡說，未來一年會有連串措施提高效率，同時加強節流，研究簡化採購流程。</p>

<p>對於急症室收費改革的同時，會否擴大夜診服務等配套，醫管局行政總裁高拔陞說，每個地區情況不同，暫時難以一概而論。</p>

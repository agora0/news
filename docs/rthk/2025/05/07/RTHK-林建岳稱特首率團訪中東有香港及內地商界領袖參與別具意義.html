  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">林建岳稱特首率團訪中東有香港及內地商界領袖參與別具意義</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-05-07T12:27:52+08:00" itemprop="datePublished">May 7, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>行政長官李家超將會率領代表團訪問中東。代表團成員之一的、貿發局主席林建岳表示，今次有香港及內地省市的商界領袖參與，別具意義，期望向外展示香港獨特優勢、協助內地企業走出去。</p>

<p>兩年多前亦有份跟隨出訪中東的林建岳說，當年簽署13份備忘錄，一些合作已經落地，他對兩地未來合作充滿信心，又指關稅戰對香港或內地企業雖然造成一定困難，但亦可能是一個商機。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">科學實驗樣本隨神十九返回艙順利返回地球　生命類樣本已運抵北京</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-05-01T14:50:08+08:00" itemprop="datePublished">May 1, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>中國空間站第八批空間科學實驗樣本，昨日隨神舟十九號載人飛船返回艙，順利返回地球。</p>

<p>根據中國科學院空間應用工程與技術中心，今次返回的科學實驗樣本，涉及空間生命科學、空間材料科學等領域的25項實驗項目，總重量約37.25公斤。</p>

<p>其中生命類科學實驗樣本已運抵北京，交付科學家，材料類等科學樣本，後續將隨神十九飛船返回艙，運輸回京。</p>

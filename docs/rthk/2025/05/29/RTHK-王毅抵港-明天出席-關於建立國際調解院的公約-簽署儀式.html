    <h1 class="post-title p-name" itemprop="name headline">王毅抵港　明天出席《關於建立國際調解院的公約》簽署儀式</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-05-29T18:06:25+08:00" itemprop="datePublished">May 29, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>中共中央政治局委員，外長王毅抵港，明天會出席《關於建立國際調解院的公約》簽署儀式。</p>

<p>行政長官李家超說，國際調解院在港設立，對香港帶來的利益是影響深遠，可不斷發揮影響力，凝聚不同國家地區的人才。</p>

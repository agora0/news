  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">印巴就喀什米爾槍擊事件關係緊張之際　伊朗外長突訪巴基斯坦</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-05-05T16:59:28+08:00" itemprop="datePublished">May 5, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>印度與巴基斯坦關係近日因喀什米爾槍擊事件持續緊張之際，路透社報道，伊朗外長阿拉格齊抵達巴基斯坦首都伊斯蘭堡，將同巴方高層會面。</p>

<p>巴基斯坦外交部表示，雙方將就地區和全球發展交換意見，未有明確表示會討論印巴局勢，但伊朗駐巴基斯坦大使穆加達姆表示，印巴議題在討論議程上。</p>

<p>路透社透露，阿拉格齊之後還會訪問印度。</p>

<p>印度外交部暫時未有回應。</p>

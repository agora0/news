    <h1 class="post-title p-name" itemprop="name headline">《環看天下》：印巴同意暫時停火　分析比較兩國空戰實力異同</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-05-13T07:33:31+08:00" itemprop="datePublished">May 13, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>印度與巴基斯坦日前同意停火，雖然雙方一度互相指責對方違反協議，但衝突情況已明顯較上星期克制。</p>

<p>兩國空軍上星期曾經在空中進行大規模激烈戰鬥，據報印度多架戰機被巴方的中遠程導彈擊落。</p>

<p>有報道就指兩國互相發動無人機攻擊。雙方近期連場攻防戰、軍備以至實戰能力，到底誰勝誰負，引起不少關注。</p>

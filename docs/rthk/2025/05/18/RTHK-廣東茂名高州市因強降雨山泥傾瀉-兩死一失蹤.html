  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">廣東茂名高州市因強降雨山泥傾瀉　兩死一失蹤</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-05-18T17:12:26+08:00" itemprop="datePublished">May 18, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>廣東茂名高州市發生山泥傾瀉，7人被困，已救出6人，其中2人經搶救無效死亡、4人已送醫院救治，剩餘失聯1人正在全力搜救中。</p>

<p>事發在早上7時許，荷花鎮平頭崗村因強降雨致山泥傾瀉。接報後，當局派人趕赴現場開展救援。</p>

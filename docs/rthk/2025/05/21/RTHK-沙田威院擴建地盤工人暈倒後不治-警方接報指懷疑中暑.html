    <h1 class="post-title p-name" itemprop="name headline">沙田威院擴建地盤工人暈倒後不治　警方接報指懷疑中暑　</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-05-21T18:34:02+08:00" itemprop="datePublished">May 21, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>警方接報，一名年約40歲男工人在威爾斯醫院附近地盤懷疑中暑，送威院治理，其後死亡。</p>

<p>警方下午3時許接報，在沙田銀城街30至48號附近地盤，一名工人懷疑中暑暈倒，送院後證實不治。</p>

<p>工業傷亡權益會表示，死者為威院擴建地盤石屎工人。事發時正值酷熱天氣警告生效期間，工權會深感難過，職員已接觸家屬，將繼續跟進及提供適切援助。</p>

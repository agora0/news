  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">消息：政府增渠道吸引電工等8種技術工種專才來港　本月內公布</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-05-21T14:49:03+08:00" itemprop="datePublished">May 21, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>消息指，政府將於本月內公布新措施，增設渠道吸引指定技術工種專才來港。據了解，就一般就業政策及輸入內地人才計劃，新增渠道涵蓋8項工種，包括電工、升降機技工、海員、飛機維修、新型工業，例如人工智能及機械工程技術員等。</p>

<p>當局亦會放寬年齡限制，由原本35歲放寬至40歲以下，3年有1萬個配額暫時維持不變。消息強調當局會視乎情況，適時調整。</p>

    <h1 class="post-title p-name" itemprop="name headline">旺角帝京酒店女子受傷死亡　警方拘捕42歲涉案男子</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-05-03T16:01:28+08:00" itemprop="datePublished">May 3, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>旺角帝京酒店一名46歲女子昨日早上在房間內暈倒，面部有瘀傷，昏迷送往廣華醫院，延至昨日下午約5時不治。警方拘捕一名42歲懷疑涉案男子，他正被扣查。</p>

<p>警方昨日早上約6時半接獲酒店職員報案，指一名女子在房內暈倒，被捕男子懷疑曾以手襲擊事主，其後逃去。警方之後在旺角區拘捕該名男子，涉嫌襲擊致造成身體傷害，案件交由旺角警區刑事調查隊第十隊跟進。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">漁護署稱網購寵物或涉釣魚詐騙　設立專責小組跟進</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-05-16T12:32:46+08:00" itemprop="datePublished">May 16, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>漁護署首席獸醫師楊莉表示，網購寵物可能涉及釣魚詐騙，署方設立專責調查小組跟進，發現部分情況與網騙很相似，不法分子會利用假帳戶，令買家難以追查真實身份，當中亦可能涉及金錢交易。</p>

<p>她強調，寵物店售賣寵物時要出示實物，而且要在其獲發牌照的實際處所進行，市民可致電署方熱線核實牌照是否有效。</p>

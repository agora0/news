  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">海天味業：上市委員會已審閱H股上市申請　不構成正式上市批准</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-05-16T21:32:48+08:00" itemprop="datePublished">May 16, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>海天味業表示，正進行H股在香港上市相關工作，發行上市聯席保薦人在星期五收到聯交所向發出信函，指聯交所上市委員會已審閱公司上市申請，不過公司強調，信函不構成正式的上市批准，聯交所仍有對上市申請提出進一步意見的權力。</p>

<p>外電較早時指，海天味業上市申請已獲港交所上市委員會批准，目標集資約10億美元。</p>

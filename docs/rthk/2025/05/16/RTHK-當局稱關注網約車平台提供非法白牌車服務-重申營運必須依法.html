  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">當局稱關注網約車平台提供非法白牌車服務　重申營運必須依法</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-05-16T18:56:24+08:00" itemprop="datePublished">May 16, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>運輸及物流局表示，關注現時網約車平台提供非法「白牌車」服務，政府與平台公司會面，重申其營運必須依法。</p>

<p>一批的士車主向政府遞交請願信，要求立即取締白牌車；有立法會議員認為，網約車平台合法化是大勢所趨，呼籲的士業界認清形勢，盡快與政府磋商規管網約車平台，保障的士業界利益。</p>

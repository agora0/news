    <h1 class="post-title p-name" itemprop="name headline">澤連斯基與萬斯羅馬會面　特朗普將與普京通話</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-05-19T16:12:44+08:00" itemprop="datePublished">May 19, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>烏克蘭總統澤連斯基與美國副總統萬斯、美國國務卿魯比奧在羅馬會面。澤連斯基說雙方討論俄烏代表在土耳其會面，指出俄羅斯派出沒有決策權的低級別代表團與會，烏方是真正希望透過外交途徑達成停火。</p>

<p>美國總統特朗普早前預告本港時間晚上10時，與俄羅斯總統普京通電話。他說希望通話有成果，能夠實現停火。他又會與澤連斯基及部分北約成員國領袖通話。</p>

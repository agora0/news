    <h1 class="post-title p-name" itemprop="name headline">郵儲銀行配股獲中證監同意註冊批復</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-05-23T20:54:06+08:00" itemprop="datePublished">May 23, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>郵儲銀行表示，向特定對象發行A股股票的申請，獲得中國證監會同意註冊批復。</p>

<p>公告指，由於A股股票在2024年度權益分派已實施完畢，根據有關定價原則，對今次發行價格進行調整，由每股6.32元人民幣，調整為6.21元，預計發行量為209.3億股。</p>

<p>今次集資規模為1300億元，扣除相關發行費用後，將全部用於補充銀行的核心一級資本。</p>

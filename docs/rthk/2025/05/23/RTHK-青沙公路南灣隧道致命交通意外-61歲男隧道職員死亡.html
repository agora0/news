  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">青沙公路南灣隧道致命交通意外　61歲男隧道職員死亡</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-05-23T11:16:01+08:00" itemprop="datePublished">May 23, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>青沙公路南灣隧道凌晨發生致命交通意外，一名61歲男隧道職員死亡。</p>

<p>警方表示，凌晨零時40分，一名40歲男子駕駛私家車沿青沙公路往九龍方向行駛，當駛至南灣隧道入口時，據報撞倒一名男隧道職員。他腿部嚴重受傷，昏迷被送往瑪嘉烈醫院治理，於凌晨2時許被證實死亡。</p>

<p>私家車司機涉嫌危險駕駛引致他人死亡被捕，被扣留調查。</p>

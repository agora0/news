  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">北區醫院護士疑被非禮　59歲男病人被捕</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-05-20T23:05:25+08:00" itemprop="datePublished">May 20, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>北區醫院下午有護士在內科病房懷疑被非禮，院方接報後隨即報警，警方及後在病房拘捕一名59歲男病人。
　　 
醫管局說，院方高度關注事件，強烈譴責涉嫌非禮院方員工的行為，會採取「零容忍」態度，嚴肅跟進事件及全力配合警方調查。院方已向該名護士致以慰問及提供支援。</p>

<p>醫院已透過早期事故通報系統向醫院管理局總辦事處呈報事件。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">吳海龍：透過關稅戰解決所謂不公平貿易是行不通</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-05-20T18:37:26+08:00" itemprop="datePublished">May 20, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>全球繁榮峰會在本港舉行，中國公共外交協會會長吳海龍表示，中國無意與美國進行戰略競爭或對抗，也不打算取代美國成為世界第一。中國的崛起不僅為自己，也為世界帶來巨大利益，又指美國不願通過自我反省尋求解決問題方案，強調透過關稅戰解決所謂不公平貿易是行不通。</p>

<p>峰會召集人之一、行政會議召集人葉劉淑儀期望峰會講述香港真實故事，幫助世界認識香港的獨特橋樑作用。</p>

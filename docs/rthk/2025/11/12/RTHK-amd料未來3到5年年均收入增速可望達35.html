  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">AMD料未來3到5年年均收入增速可望達35%</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-11-12T08:08:44+08:00" itemprop="datePublished">Nov 12, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>晶片製造商AMD董事長蘇姿丰預計，未來3到5年，年均收入增速可望達35%，受到人工智能需求帶動，而人工智能數據中心收入年均增長將達到80%。</p>

<p>她在公司分析師日活動上表示，AMD的數據中心晶片與系統市場預計到2030年將增長至1萬億美元。</p>

<p>她表示，人工智能將主要推動有關市場增長，涵蓋AMD的中央處理器（CPU）、專用AI晶片等。</p>

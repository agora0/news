  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">屯門青麟路小巴撞輕鐵　小巴司機一度被困車內</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-11-02T04:40:24+08:00" itemprop="datePublished">Nov 2, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>屯門青麟路發生小巴與輕鐵相撞的意外，12人受傷，小巴司機一度被困車內。</p>

<p>事發在凌晨零時48分，涉事輕鐵沿青麟路往屯門方向行駛，而涉事小巴則沿青麟路往落馬洲方向行駛，期間小巴懷疑在麒麟站附近撞向輕鐵，64歲小巴司機被困在車內，消防到場後將他救出，他腳部受傷。</p>

<p>輕鐵司機頭部受傷，小巴及輕鐵上共10名乘客輕傷，所有傷者清醒被送往屯門醫院治理。</p>

    <h1 class="post-title p-name" itemprop="name headline">美國紐約拉瓜迪亞機場兩機於停機坪擦碰　事故中無人受傷</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-11-02T01:18:38+08:00" itemprop="datePublished">Nov 2, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>美國紐約拉瓜迪亞機場有兩架客機在停機坪上擦碰。</p>

<p>事發在當地過去的星期五晚上，當時機場因惡劣天氣及政府停擺，導致人手短缺，並面對嚴重延誤。</p>

<p>聯合航空一名發言人說，一架從佛羅里達州奧蘭多返回的聯合航空客機，在轉向到登機口時，機翼擦到停在滑行道上另一架聯合航空飛機的尾部。被碰撞到的飛機當時處於靜止狀態，事故中無人受傷。</p>

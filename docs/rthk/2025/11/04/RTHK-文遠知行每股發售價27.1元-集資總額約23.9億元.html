    <h1 class="post-title p-name" itemprop="name headline">文遠知行每股發售價27.1元　集資總額約23.9億元</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-11-04T23:18:23+08:00" itemprop="datePublished">Nov 4, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>文遠知行公布，最終發售價每股27.1元，釐定發售價已考慮美國存託股份昨日在納斯達克的收市價等因素。發售價較招股文件公布的最高招股價35元，低近23%。</p>

<p>扣除承銷費及發售開支前，上市集資總額約23.9億元，約40%用於開發自動駕駛技術解決方案及營運平台、另有約40%用於加快L4級車隊商業化量產及營運等。</p>

<p>股份將於本周四主板掛牌。</p>

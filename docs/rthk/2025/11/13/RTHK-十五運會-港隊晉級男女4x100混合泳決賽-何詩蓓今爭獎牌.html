    <p class="post-meta">

  <div class="post-content e-content" itemprop="articleBody">
    <p>十五運會游泳項目，港隊晉級男女4X100米混合泳接力決賽。女泳手何詩蓓將於晚上出戰女子200米自由泳決賽，力爭個人首面全運獎牌。</p>

<p>乒乓項目方面，廣東組合林高遠、劉詩雯在混雙4強賽，苦戰7局，以局數4:3擊敗遼寧的袁勵岑、王藝迪，晉級決賽。</p>

    <h1 class="post-title p-name" itemprop="name headline">IMF料美國第4季經濟增長低於1.9%</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-11-14T07:45:17+08:00" itemprop="datePublished">Nov 14, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>國際貨幣基金組織(IMF) 表示，美國聯邦政府停擺將對經濟產生負面影響，預計今年4季美國經濟增速將低於之前預測的1.9%。</p>

<p>IMF表示，美國經濟過去幾年展現韌性，但目前面臨越來越大壓力，國內需求疲弱、就業增長放緩、移民流入減少、關稅以及更廣泛的政策不確定性等因素，壓制美國經濟活動。</p>

<p>IMF又指，受到政府停擺造成數據缺失，對美國經濟表現的評估能力受到影響。</p>

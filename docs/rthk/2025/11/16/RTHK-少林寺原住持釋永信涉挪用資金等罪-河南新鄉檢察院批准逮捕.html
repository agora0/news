    <h1 class="post-title p-name" itemprop="name headline">少林寺原住持釋永信涉挪用資金等罪　河南新鄉檢察院批准逮捕</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-11-16T12:41:37+08:00" itemprop="datePublished">Nov 16, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>少林寺原住持釋永信涉及挪用資金等罪，河南省新鄉市檢察院批准逮捕。</p>

<p>少林寺在7月通報，釋永信涉嫌刑事犯罪，挪用、侵佔項目資金和寺院資產，以及嚴重違反佛教戒律，長期與多名女性維持不正當關係並育有私生子，正接受多個部門聯合調查。</p>

<p>央視新聞報道，新鄉市人民檢察院日前依法以涉嫌職務侵佔罪、挪用資金罪、非國家工作人員受賄罪，批准逮捕釋永信。</p>

    <p class="post-meta">
      <time class="dt-published" datetime="2025-11-16T14:31:45+08:00" itemprop="datePublished">Nov 16, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>香港劍擊代表，出戰十五運會女子佩劍個人賽，三名劍手分別突破分組賽，其中梁洛文和朱詠翹，分別晉身16強。</p>

<p>港隊劍手梁洛文，面對廣東的林可斯，以15:4勝出，另外兩名港隊劍手，薛雅齊和朱詠翹就在32強碰頭，最終朱詠翹以 15:11淘汰隊友晉級。</p>

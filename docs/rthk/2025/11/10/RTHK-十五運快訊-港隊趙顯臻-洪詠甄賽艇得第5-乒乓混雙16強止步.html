    <h1 class="post-title p-name" itemprop="name headline">十五運快訊｜港隊趙顯臻、洪詠甄賽艇得第5　乒乓混雙16強止步</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-11-10T18:49:24+08:00" itemprop="datePublished">Nov 10, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>十五運會，港隊在多個項目分途出擊，賽艇代表趙顯臻和洪詠甄在男、女子輕量級單人雙槳，分別第5名完成。</p>

<p>港隊乒乓混雙組合姚鈞濤、吳詠琳在16強不敵廣東隊，無緣晉級。</p>

<p>男子籃球成年組賽事，9至11名排位賽，港隊以83:64擊敗江蘇，明早再迎戰吉林。</p>

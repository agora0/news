    <h1 class="post-title p-name" itemprop="name headline">十五運會│黃澤林男單四強不敵吳易昺奪得銅牌</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-11-19T18:11:31+08:00" itemprop="datePublished">Nov 19, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>十五運會網球男子單打半決賽，港隊代表黃澤林與浙江代表吳易昺激戰兩個多小時，以盤數1：2落敗，在不設季軍戰下，奪得一面銅牌，是港隊首次於全運會網球單打賽事奪得獎牌。</p>

<p>黃澤林賽後表示有些少可惜，但已拼盡全力，日後會繼續努力，希望可以在全運會奪得銀牌甚至金牌。</p>

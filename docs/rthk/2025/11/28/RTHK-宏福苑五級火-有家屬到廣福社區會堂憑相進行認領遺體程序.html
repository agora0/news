  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">宏福苑五級火｜有家屬到廣福社區會堂憑相進行認領遺體程序</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-11-28T11:23:16+08:00" itemprop="datePublished">Nov 28, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>大埔廣福社區會堂第二日開放予宏福苑大火中與家人失聯的家屬，嘗試憑相行進行認領遺體程序，早上大批家屬前來社區會堂，警員在場維持秩序。有家屬離開時神情哀傷，要由旁人攙扶。</p>

<p>居民胡先生表示，家中外傭在火災中失去聯絡，當日起火後，外傭已即時逃生，但估計她未能趕及逃離，希望她只是受傷被送院救治。胡太太形容，外傭猶如家人一樣，她感到很傷心。</p>

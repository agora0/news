    <h1 class="post-title p-name" itemprop="name headline">宏福苑五級火｜死者增至94人　死傷者主要在火勢較猛烈兩座找到</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-11-28T12:49:47+08:00" itemprop="datePublished">Nov 28, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>大埔宏福苑五級火造成的死亡人數增至94人，包括一名殉職消防員。截至早上10時，在79名傷者中，有12人危殆、28人嚴重、17人穩定，其餘22人已出院。</p>

<p>消防表示，7座大廈火勢已大致救熄，死傷者主要在火勢比較猛烈的宏昌閣及宏泰閣找到。</p>

    <h1 class="post-title p-name" itemprop="name headline">大埔足球會作客澳洲對FC麥克阿瑟　賽前將默哀一分鐘</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-11-27T11:30:44+08:00" itemprop="datePublished">Nov 27, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>大埔足球會今晚會在澳洲出戰亞足聯冠軍聯賽二級聯賽，對FC麥克阿瑟的賽事，球會在社交網頁表示，已得到亞洲足協批准，在今晚的賽事開始前，將進行一分鐘默哀。球會又表示，感謝亞洲足協和FC麥克阿瑟對大埔火災的關注，同時感謝消防員的付出及區內居民對事件的支援。</p>

<p>球會早前表示，會在賽事戴上黑色臂紗作賽，並已獲亞洲足協批准。</p>

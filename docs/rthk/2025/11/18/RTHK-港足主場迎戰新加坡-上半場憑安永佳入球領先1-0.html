  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">港足主場迎戰新加坡　上半場憑安永佳入球領先1:0</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-11-18T20:53:34+08:00" itemprop="datePublished">Nov 18, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>2027年足球亞洲盃外圍賽，港隊晚上在啟德主場館，迎戰新加坡，上半場憑隊長安永佳的入球，領先1:0。</p>

<p>港隊多次在兩路側擊，發動高空攻勢。第15分鐘，陳俊樂前場搶斷成功，得球的艾華頓禁區外右路送出傳中，伏兵門前、無人看管的安永佳頭槌頂入。</p>

<p>幾分鐘後，孫銘謙左路斜傳入禁區，茹子楠頭槌二傳，祖連奴在對方球員壓迫下門前頂高，錯失擴大比分的黃金機會。</p>

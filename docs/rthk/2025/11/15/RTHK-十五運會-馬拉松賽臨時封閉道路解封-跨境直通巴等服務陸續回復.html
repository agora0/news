    <h1 class="post-title p-name" itemprop="name headline">十五運會｜馬拉松賽臨時封閉道路解封　跨境直通巴等服務陸續回復</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-11-15T11:58:46+08:00" itemprop="datePublished">Nov 15, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>運輸署表示，早前十五運會馬拉松比賽臨時封閉的道路現已解封。</p>

<p>另外，公共運輸服務方面，經深圳灣口岸來往香港和內地的跨境直通巴士、來往深圳灣口岸的本地公共交通服務包括專營巴士、專線小巴、市區及新界的士的服務已陸續回復正常。</p>

<p>運輸署呼籲跨境及本地旅客及早計劃行程，請預留足夠時間。</p>

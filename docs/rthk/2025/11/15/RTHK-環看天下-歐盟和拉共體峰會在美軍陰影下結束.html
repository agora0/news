    <h1 class="post-title p-name" itemprop="name headline">《環看天下》：歐盟和拉共體峰會在美軍陰影下結束</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-11-15T07:45:25+08:00" itemprop="datePublished">Nov 15, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>歐盟、拉美和加勒比國家共同體在哥倫比亞舉行的峰會結束，同意維護區域持久和平、捍衛多邊主義、深化貿易與投資合作。</p>

<p>不過，歐盟與歐洲多名高級別官員並無出席峰會。有分析認為，可能影響峰會成效；而美軍在加勒比海加強部署，亦帶來隱憂。</p>

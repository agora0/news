  <div class="post-content e-content" itemprop="articleBody">
    <p>歐盟反海盜海上力量在索馬里附近海域，解救了一艘被海盜襲擊的馬耳他籍運油輪，運油輪上24名船員安全無恙。</p>

<p>公報說，海盜當地星期四上午，在距離索馬里首都摩加迪沙約700海里的海域，襲擊這艘運油輪並登船，西班牙海軍艦船等歐盟多國武裝力量展開營救行動，海盜迫於壓力棄船逃走。</p>

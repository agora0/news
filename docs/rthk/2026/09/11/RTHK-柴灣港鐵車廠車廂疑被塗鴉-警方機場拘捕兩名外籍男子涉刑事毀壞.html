    <h1 class="post-title p-name" itemprop="name headline">柴灣港鐵車廠車廂疑被塗鴉　警方機場拘捕兩名外籍男子涉刑事毀壞</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-09-11T00:28:46+08:00" itemprop="datePublished">Sep 11, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>柴灣港鐵車廠一節車廂懷疑被人塗鴉，警方在機場拘捕兩名外籍男子，涉嫌刑事毀壞。</p>

<p>警方是在星期三接報，經調查及翻查「銳眼計劃」下所安裝的閉路電視片段後，當晚在機場警區拘捕兩名年齡分別30及34歲的外籍男子，行動中檢獲一批懷疑犯案工具及案發時被捕人身穿的衣物。案件由東區警區重案組第一隊跟進。</p>

<p>編輯︰張萬燕</p>

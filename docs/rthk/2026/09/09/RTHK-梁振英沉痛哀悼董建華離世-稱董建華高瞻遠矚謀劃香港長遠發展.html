    <h1 class="post-title p-name" itemprop="name headline">梁振英沉痛哀悼董建華離世　稱董建華高瞻遠矚謀劃香港長遠發展</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-09-09T01:24:21+08:00" itemprop="datePublished">Sep 9, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>前行政長官董建華離世，享年89歲。</p>

<p>全國政協副主席梁振英表示沉痛哀悼。梁振英表示，董建華領導香港成立特別行政區及政府，獲得國家高度信任，落實一國兩制，港人治港，高度自治，高瞻遠矚謀劃香港的長遠發展及解決深層次民生問題。</p>

<p>梁振英形容，董建華宅心仁厚、以理服人，是後輩的典範，願他安息。</p>

<p>編輯：羅宇光</p>

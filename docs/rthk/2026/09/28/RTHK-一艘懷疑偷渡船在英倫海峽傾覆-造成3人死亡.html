  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">一艘懷疑偷渡船在英倫海峽傾覆　造成3人死亡</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-09-28T22:43:34+08:00" itemprop="datePublished">Sep 28, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>一艘懷疑偷渡船在英倫海峽傾覆，造成3人死亡。</p>

<p>法國傳媒引述當地救援部門報道，涉事船隻當地星期一載著105人，從法國北部加來海峽省出發，試圖穿越英倫海峽，但在加來海峽省維桑附近傾覆，造成3人死亡、4人輕傷。</p>

<p>近年有不少來自非洲及中東的民眾為躲避戰亂逃至歐洲，其中部分人從法國經英倫海峽偷渡至英國，不時發生偷渡船傾覆事件。</p>

<p>編輯：鄭皓璟</p>

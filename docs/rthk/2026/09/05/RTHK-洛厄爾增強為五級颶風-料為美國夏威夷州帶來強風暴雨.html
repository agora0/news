    <h1 class="post-title p-name" itemprop="name headline">洛厄爾增強為五級颶風　料為美國夏威夷州帶來強風暴雨</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-09-05T15:15:27+08:00" itemprop="datePublished">Sep 5, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>颶風「洛厄爾」快速增強至最高級別的五級颶風，預計為美國夏威夷州帶來強風暴雨，州長格林已宣布全州進入緊急狀態。</p>

<p>美國國家颶風中心表示，截至夏威夷當地時間星期五下午，「洛厄爾」的最高持續風速達到每小時近260公里，位於夏威夷州利胡埃以南約990公里，預計「洛厄爾」將會轉向北或東北移動，夏威夷群島部分地區累計雨量可能達到約250毫米。</p>

<p>編輯：許敬軒</p>

    <h1 class="post-title p-name" itemprop="name headline">港隊黃卓莉於亞運空手道女子組手68公斤以下級奪銅牌</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-09-21T17:46:49+08:00" itemprop="datePublished">Sep 21, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>亞運空手道項目，港隊代表黃卓莉在女子組手68公斤以下級銅牌戰，擊敗沙特阿拉伯選手，為港隊再添一面銅牌。</p>

<p>連同較早前劉慕裳在女子個人形項目奪銀，以及洪晧崴在男子個人形項目摘銅，空手道港隊在今屆亞運已累積取得一銀兩銅，共三面獎牌。</p>

<p>編輯：李俊傑</p>

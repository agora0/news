  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">當局擬禁未獲准處所使用「醫學」等名稱　盧寵茂：很難列出所有名</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-06-12T19:47:08+08:00" itemprop="datePublished">Jun 12, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>政府計劃最快明年底，禁止未獲牌照或豁免書的處所，使用可能誤導公眾字眼，例如醫學、醫療等詞語，作名稱或描述。</p>

<p>醫務䘙生局局長盧寵茂說，很難將所有名稱列出來，如有關非醫療處所，即使在名稱上避開使用有關字眼，但實際運作牽涉到醫療手段或程序，或從非法行醫的方向處理。</p>

<p>編輯：王濱南</p>

    <h1 class="post-title p-name" itemprop="name headline">SpaceX將納入恒生港美科技指數</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-06-12T18:54:42+08:00" itemprop="datePublished">Jun 12, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>全球集資規模最大的新股SpaceX星期五在美國上市。</p>

<p>恒指公司表示，恒生港美科技指數的編算方法，將新增SpaceX至指定美國上市成份股名單。</p>

<p>8隻美國上市成份股的比重將於本月23日，亦即是SpaceX上市後的第7個交易日，收市後重新計算至等權重，新增成份股和更新後的成份股權重將於本月29日生效。</p>

<p>編輯：羅煒皓</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">男子涉販毒機場落網　警方指販毒團伙被招募從歐洲運毒到香港</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-06-20T19:50:30+08:00" itemprop="datePublished">Jun 20, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>一名30歲男子涉嫌販毒在機場被捕，被暫控一項「販運危險藥物」罪，案件下星期一在西九龍裁判法院提堂。</p>

<p>警方毒品調查科昨日與海關採取聯合行動，在機場截查該名從意大利飛抵本港的男子，在他的行李中找到6包、共重約25公斤懷疑毒品氯胺酮，估計市值約980萬。</p>

<p>警方相信，有不法集團招募販毒團伙，安排他們從歐洲販運毒品到香港。</p>

<p>編輯：陳曉慶</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">太子唐樓單位租務糾紛　業主及租客疑向對方潑淋液體兩人同被捕</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-06-14T16:43:51+08:00" itemprop="datePublished">Jun 14, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>太子有唐樓發生租務糾紛，兩名男子涉嫌襲擊被捕。</p>

<p>警方上午11時許接報，指兩名男子在太子道西129至131號一幢唐樓單位内，懷疑因租務問題發生爭執，兩人報稱期間懷疑被對方潑淋不明液體。</p>

<p>事件涉及一名41歲男業主及42歲男租客，兩人分別胸口及手部受傷，清醒由救護車送往廣華醫院治理。警方其後以涉嫌普通襲擊拘捕兩人。</p>

<p>編輯：汪溟曦</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">日本岩手縣近海發生6級以上地震　暫無海嘯風險</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-06-28T05:48:08+08:00" itemprop="datePublished">Jun 28, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>日本岩手縣近海發生黎克特制6.1級地震。</p>

<p>央視新聞引述日本氣象廳資料報道，當地清晨5時21分左右，岩手縣近海發生6.1級地震，震源深度40公里，暫無海嘯風險。</p>

<p>本港天文台初步分析，地震發生在本港時間4時21分，震央位於青森東南偏東約150公里。</p>

<p>編輯：羅宇光</p>

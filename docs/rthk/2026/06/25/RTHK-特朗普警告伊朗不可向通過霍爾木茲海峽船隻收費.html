    <h1 class="post-title p-name" itemprop="name headline">特朗普警告伊朗不可向通過霍爾木茲海峽船隻收費</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-06-25T19:48:01+08:00" itemprop="datePublished">Jun 25, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>美國總統特朗普稱伊朗在談判中作出重大讓步，並再次警告，伊朗不可向通過霍爾木茲海峽的船隻收取費用。</p>

<p>伊朗方面就表示，船隻通過霍爾木茲海峽，必須與伊朗革命衛隊海軍協調。</p>

<p>編輯：王濱南</p>

    <h1 class="post-title p-name" itemprop="name headline">美股初段上升　晶片股向上</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-06-25T21:42:07+08:00" itemprop="datePublished">Jun 25, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>美股在開市初段上升，晶片股向上。</p>

<p>道瓊斯指數較早時報52161點，升312點，升幅0.6%。</p>

<p>納斯達克指數報25631點，升154點，升幅0.61%。</p>

<p>標準普爾500指數報7404點，升45點，升幅0.62%。</p>

<p>部分晶片股升幅顯著，美光科技較早時急升逾19%，高通升近9%，英特爾升逾6%。</p>

<p>編輯：張詩民</p>

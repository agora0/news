  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">水務署工地裝水喉工被硬物擊中危殆　署方責成承建商調查</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-06-24T19:56:55+08:00" itemprop="datePublished">Jun 24, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>黃大仙竹園道一個水務署工地，一名約60歲男工人早上懷疑被硬物擊中，昏迷送院，情況危殆。</p>

<p>水務署回覆查詢時表示，署方一名承建商工人在該工地進行安裝水喉工程時受傷，已要求承建商停止有關工作並展開安全檢查，同時責成承建商就意外展開深入調查。署方又說，會全力協助相關部門調查。</p>

<p>　</p>

<p>編輯：鍾慧儀</p>

    <h1 class="post-title p-name" itemprop="name headline">黃大仙地盤有男工疑被硬物擊中昏迷　情況危殆</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-06-24T19:08:01+08:00" itemprop="datePublished">Jun 24, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>黃大仙一個地盤發生工業意外，一名年約60歲男工人懷疑被硬物擊中，昏迷送伊利沙伯醫院治理，目前情況危殆。</p>

<p>警方早上約10時半接報，翠竹街6號附近一個地盤，一名工人疑被硬物擊中。警方接報到場，初步調查相信，傷者於工作期間遭硬物意外擊中，面部受傷。</p>

<p>編輯：鍾慧儀</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">慶祝特區成立29周年　將有交通及消費等優惠</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-06-09T19:12:44+08:00" itemprop="datePublished">Jun 9, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>為慶祝七月一日香港特區成立29周年，政府和社會各界將推出一系列特別優惠及活動，涵蓋公共交通、文化藝術及消閒、飲食及消費等範疇。</p>

<p>優惠包括港鐵會經抽獎送出7.1萬份本地單程車程，多條渡輪航線派發免費乘船券，逾千間食肆提供餐飲優惠等。</p>

<p>編輯：梁家奇</p>

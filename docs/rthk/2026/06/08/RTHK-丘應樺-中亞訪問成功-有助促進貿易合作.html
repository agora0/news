  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">丘應樺：中亞訪問成功　有助促進貿易合作</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-06-08T20:13:09+08:00" itemprop="datePublished">Jun 8, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>行政長官早前率領商貿代表團訪問中亞兩國，達成96份協議及備忘錄。隨團的商務及經濟發展局局長丘應樺表示，今次訪問非常成功，有助促進兩地的貿易和投資合作。</p>

<p>中華廠商聯合會表示，會在今年內再訪問中亞，期望與當地的行業商談細節和落實合作。</p>

<p>編輯：朱錫君</p>

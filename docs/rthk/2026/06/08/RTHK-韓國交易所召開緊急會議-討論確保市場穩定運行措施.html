  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">韓國交易所召開緊急會議　討論確保市場穩定運行措施</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-06-08T08:44:47+08:00" itemprop="datePublished">Jun 8, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>韓國交易所表示，已召開緊急會議，評估不斷上升的市場波動，並討論確保市場穩定運行的措施。</p>

<p>交易所評估美國股市上周五大幅下跌以及隔夜期貨市場走勢，並討論市場管理措施。</p>

<p>交易所表示，將強化公司層面的應對機制，密切關注全球市場、中東局勢發展以及外匯市場波動。交易所亦計劃加大對不公平交易的監管力度，並擴大對非法賣空交易的檢查。</p>

<p>編輯：張詩民</p>

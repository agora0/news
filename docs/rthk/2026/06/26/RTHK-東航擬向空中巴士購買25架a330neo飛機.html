  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">東航擬向空中巴士購買25架A330neo飛機</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-06-26T19:09:06+08:00" itemprop="datePublished">Jun 26, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>中國東航公布，計劃向空中巴士公司購買25架A330neo系列飛機，目錄價格合計約93.5億美元。</p>

<p>集團指出，經過多輪商業談判，公司與空中巴士協商達成實際價格低於基本目錄價，預計2029-2033年分批交付。</p>

<p>東航說，今次交易將用於補充未來運力及置換更新存量機型，優化公司機隊結構及航線網絡、提升運行及服務質量、降低單位運營成本。</p>

<p>編輯：張詩民</p>

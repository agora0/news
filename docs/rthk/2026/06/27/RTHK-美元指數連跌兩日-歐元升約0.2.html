    <h1 class="post-title p-name" itemprop="name headline">美元指數連跌兩日　歐元升約0.2%</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-06-27T06:21:17+08:00" itemprop="datePublished">Jun 27, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>美元指數連跌兩日，較早時報101.36，下跌0.15%。美國最新的通脹數據符合預期，加上油價回落，市場對聯儲局加息預期降溫。</p>

<p>歐元兌美元上升0.18%，報1.1389美元。英鎊兌美元升約0.1%，報1.3203美元。</p>

<p>美元兌日圓微跌至161.74日圓。</p>

<p>編輯：李意琴</p>

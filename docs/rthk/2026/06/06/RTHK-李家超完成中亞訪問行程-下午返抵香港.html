  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">李家超完成中亞訪問行程　下午返抵香港</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-06-06T16:55:28+08:00" itemprop="datePublished">Jun 6, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>行政長官李家超完成訪問哈薩克和烏茲別克，下午返抵本港。</p>

<p>李家超早前總結行程時說，今次訪問共達成90多項合作協議和諒解備忘錄，其中涉及具體金額總值超過16.5億美元，形容中亞之行成果豐碩。</p>

<p>他又指，商貿代表團訪問當地期間，成功推動多方面成果，包括建立特區政府與兩地政府之間的高層接觸和聯繫，並達成多領域合作共識。</p>

<p>編輯：任順熙</p>

    <h1 class="post-title p-name" itemprop="name headline">李家超社交專頁上載蛋糕照片　祝大家父親節快樂</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-06-21T10:01:16+08:00" itemprop="datePublished">Jun 21, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>今日是父親節，行政長官李家超在社交專頁發布帖文，祝大家父親節快樂。</p>

<p>本身是兩子之父的李家超，在社交專頁上載一張寫上「HAPPY FATHER’S DAY」的蛋糕照片，表示工作雖然忙碌，但感謝有家人的默默支持。</p>

<p>編輯：汪溟曦</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">屯門三聖邨父子涉將告票擲向交通督導員被捕</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-06-21T19:16:58+08:00" itemprop="datePublished">Jun 21, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>屯門一對父子涉嫌襲擊兩名交通督導員被捕。</p>

<p>警方在中午約12時接報，兩名交通督導員在三聖邨巡邏時，發現一輛私家車懷疑違例泊車，上前發出告票，期間一名31歲男子及其61歲父親先後將告票擲向一男一女交通督導員。</p>

<p>兩名交通督導員沒有表面傷，清醒被送往屯門醫院檢查，案件由屯門警區刑事調查隊第三隊跟進。</p>

<p>編輯：陳樂謙</p>

    <h1 class="post-title p-name" itemprop="name headline">美國芝加哥發生槍擊案　最少12人受傷其中2人傷勢較重</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-06-21T03:12:20+08:00" itemprop="datePublished">Jun 21, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>美國芝加哥發生槍擊案，最少12人受傷。</p>

<p>芝加哥警方表示，案發在當地星期五深夜，兩人駕駛一輛多用途車，到市中心一個公園附近，之後在車上向人群開槍；最少8男4女中槍，傷者年齡介乎17至47歲，分別送往4間醫院治理，其中兩名男子傷勢較重。</p>

<p>警方正調查案件，暫時未公布與疑犯相關的信息。</p>

<p>編輯：盧曉珊</p>

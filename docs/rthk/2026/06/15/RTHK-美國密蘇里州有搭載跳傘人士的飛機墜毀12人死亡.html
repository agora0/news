  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">美國密蘇里州有搭載跳傘人士的飛機墜毀12人死亡</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-06-15T08:40:22+08:00" itemprop="datePublished">Jun 15, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>美國密蘇里州有飛機墜毀，造成11名跳傘人士及一名機師喪生。</p>

<p>事發在當地星期日上午11時許，出事飛機是一架單引擎渦輪螺旋槳飛機，用於搭載乘客進行跳傘活動，飛機起飛後未能爬升並突然左轉，最終在堪薩斯城以南106公里的巴特勒紀念機場附近墜毀，機上12人全部遇難。</p>

<p>美國國家運輸安全委員會已對事故展開調查。</p>

<p>編輯：許敬軒</p>

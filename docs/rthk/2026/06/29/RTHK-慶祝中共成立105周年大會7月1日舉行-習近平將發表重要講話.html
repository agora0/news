    <h1 class="post-title p-name" itemprop="name headline">慶祝中共成立105周年大會7月1日舉行　習近平將發表重要講話</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-06-29T20:08:27+08:00" itemprop="datePublished">Jun 29, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>慶祝中國共產黨成立105周年大會，將於7月1日早上10時在北京人民大會堂舉行。</p>

<p>新華社報道，中共總書記、國家主席、中央軍委主席習近平屆時將會向「七一勳章」獲得者頒授勳章，並發表重要講話，大會亦會對全國優秀共產黨員、全國優秀黨務工作者和全國先進基層黨組織，進行表彰。</p>

<p>編輯：許敬軒</p>

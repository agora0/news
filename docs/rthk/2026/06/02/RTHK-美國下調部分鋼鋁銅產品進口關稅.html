  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">美國下調部分鋼鋁銅產品進口關稅</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-06-02T18:34:43+08:00" itemprop="datePublished">Jun 2, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>美國總統特朗普簽署文件，下調部分鋼鋁銅產品的進口關稅。</p>

<p>根據文件，收割機和部分其他農業機械適用的進口從價關稅從25%下調至15%。調整後的關稅措施將從當地下星期一開始實施，但從2028年1月1日開始將恢復適用現行關稅稅率。</p>

<p>特朗普在首個總統任期曾對進口鋼鋁加徵關稅，去年再度入主白宮後，特朗普調整前總統拜登政府時期的鋼鋁政策，並出台銅關稅政策。</p>

<p>編輯：鄭皓璟</p>

    <h1 class="post-title p-name" itemprop="name headline">《環看天下》：韓國啟動國家級AI機械人項目力追中美</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-05-22T10:02:13+08:00" itemprop="datePublished">May 22, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>韓國政府據報近日啟動國家級項目，積極推進人工智能人形機械人產業發展，透過構建綜合平台，加強人工智能模型、電池、零部件、量產與現場驗證等方面的協作。</p>

<p>當地有專家指出，韓國在相關技術領域的水平，已達到中國與美國的八、九成；不過在制度設計、人才培育及產業生態方面，仍然存在明顯差距，有必要急起直追，才能收窄與主要競爭對手之間的距離。</p>

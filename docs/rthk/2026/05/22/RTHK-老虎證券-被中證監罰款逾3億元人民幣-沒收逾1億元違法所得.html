  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">老虎證券：被中證監罰款逾3億元人民幣　沒收逾1億元違法所得</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-05-22T23:37:26+08:00" itemprop="datePublished">May 22, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>老虎證券指，中國證監會已就公司涉嫌非法從事證券、基金及期貨業務立案調查，處以約3.081億元人民幣罰款，並沒收約1.031億元違法所得。</p>

<p>老虎證券又指，公司已注意到相關通知，將嚴格按照監管要求積極配合相關工作，目前公司各項業務運營正常。老虎始終將合規置於首位，並持續與監管機構保持密切溝通。</p>

<p>編輯：張詩民</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">巴基斯坦總理夏巴茲由浙江省轉抵北京繼續行程</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-05-24T19:56:35+08:00" itemprop="datePublished">May 24, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>訪華的巴基斯坦總理夏巴茲，晚上由浙江省轉抵北京繼續行程，將會與國家主席習近平及總理李強會談，並出席慶祝中巴建交75周年招待會。</p>

<p>外交部發言人日前表示，中巴兩國是好朋友和全天候戰略合作夥伴。中方期待雙方以訪問為契機，賡續傳統友誼，深化全方位合作，共同譜寫構建新時代更加緊密的中巴命運共同體新篇章。</p>

<p>編輯：許敬軒</p>

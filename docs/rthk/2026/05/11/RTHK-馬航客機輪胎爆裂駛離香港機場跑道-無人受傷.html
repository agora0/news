  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">馬航客機輪胎爆裂駛離香港機場跑道　無人受傷　</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-05-11T12:50:33+08:00" itemprop="datePublished">May 11, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>香港機場有客機發生爆胎事故，無人受傷。</p>

<p>早上9時許，警方接報機場一架編號MH079的馬來西亞航空客機有輪胎爆裂。涉事客機之後駛離跑道，停泊在停機坪。</p>

<p>救援人員到場戒備，事件中無人受傷。航班上的乘客坐接駁巴士離開。</p>

<p>編輯：譚佩貞</p>

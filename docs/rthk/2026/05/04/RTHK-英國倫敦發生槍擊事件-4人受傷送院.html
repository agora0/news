  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">英國倫敦發生槍擊事件　4人受傷送院</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-05-04T01:11:35+08:00" itemprop="datePublished">May 4, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>英國倫敦南部布里克斯頓地區發生無差別槍擊事件，4人受傷送院，其中一名25歲男子性命垂危。事件仍在調查，暫時未有人被捕。</p>

<p>英國傳媒報道，事發在當地星期六凌晨，有人從一輛汽車內開槍射擊。警方說事件是無差別的暴力行為。</p>

<p>布里克斯頓距離倫敦市中心大約10分鐘車程，是一個以多元文化為特色的街區，亦是倫敦頗受歡迎的旅遊目的地之一。</p>

<p>編輯︰張萬燕</p>

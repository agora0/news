  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">五一黃金周首三日累計逾71萬人次內地旅客訪港</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-05-04T13:08:14+08:00" itemprop="datePublished">May 4, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>本港入境處數據顯示，內地五一黃金周首三日累計超過71萬人次內地旅客訪港，單是昨天第三日有超過20萬人次內地旅客入境。</p>

<p>昨日入境的20萬516人次內地旅客，最多經落馬州支線口岸入境，其次是高鐵西九龍站。</p>

<p>本港勞動節假期連周末昨日結束，昨日是港人回港高峰期，有超過48萬人次香港居民入境。</p>

<p>編輯：黃佩珊</p>

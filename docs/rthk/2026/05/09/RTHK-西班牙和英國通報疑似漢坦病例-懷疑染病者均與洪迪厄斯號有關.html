  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">西班牙和英國通報疑似漢坦病例　懷疑染病者均與洪迪厄斯號有關</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-05-09T17:55:32+08:00" itemprop="datePublished">May 9, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>出現漢坦病毒疫情的郵輪洪迪厄斯號，今天前往西班牙特內里費島，安排乘客返回各自國家，當局表示整個過程將實施封閉管理。</p>

<p>至於西班牙和英國通報發現漢坦病毒疑似病例，懷疑染病的人士均與洪迪厄斯號有關。</p>

<p>佛得角衛生部亦公布，之前從洪迪厄斯號上轉送離開的3人中，2人的生物樣本檢測證實感染漢坦病毒家族中的安第斯病毒。</p>

<p>編輯：鄭皓璟</p>

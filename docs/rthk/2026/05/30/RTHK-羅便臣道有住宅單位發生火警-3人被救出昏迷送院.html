    <h1 class="post-title p-name" itemprop="name headline">羅便臣道有住宅單位發生火警　3人被救出昏迷送院</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-05-30T12:15:03+08:00" itemprop="datePublished">May 30, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>半山羅便臣道住宅有單位早上發生火警，消防到場救出3人，昏迷送院治理。</p>

<p>警方上午近11時接報，羅便臣道9號薈萃苑有單位冒煙，消防到場救出1男2女，分別送往瑪麗醫院及律敦治醫院治理，期間有住戶需要疏散。</p>

<p>編輯：黃佩珊</p>

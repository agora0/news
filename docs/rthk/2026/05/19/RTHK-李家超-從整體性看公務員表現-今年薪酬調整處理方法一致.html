    <h1 class="post-title p-name" itemprop="name headline">李家超：從整體性看公務員表現　今年薪酬調整處理方法一致</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-05-19T18:45:05+08:00" itemprop="datePublished">May 19, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>行政長官李家超表示，應該從整體性角度來看公務員表現，指公務員薪酬調整一向都是考慮六大因素，今年的處理方法會是一致，會充分考慮各項因素，作出平衡和最適合的決定。</p>

<p>李家超又表示，一直收到大埔宏福苑居民回覆接納政府收購業權建議的信件，形容方案是希望由政府主動承擔各種風險，以及對受影響家庭的壓力及影響。</p>

<p>編輯：王濱南</p>

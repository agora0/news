  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">69名中國公民在菲被扣　中國使館派員領事探視</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-05-19T05:19:33+08:00" itemprop="datePublished">May 19, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>新華社引述中國駐菲律賓大使館消息報道，菲律賓軍警近日在一間鋼鐵廠採取突擊行動，扣查69名中國公民。</p>

<p>使館昨日派員前往菲律賓國家調查局看守所，對這69名中國工人進行領事探視，並敦促菲方盡快依法公正妥善處理有關案件，切實保障中國公民安全和合法權益。</p>

<p>編輯：盧曉珊</p>

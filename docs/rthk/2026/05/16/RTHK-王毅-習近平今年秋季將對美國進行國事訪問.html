  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">王毅：習近平今年秋季將對美國進行國事訪問</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-05-16T18:20:45+08:00" itemprop="datePublished">May 16, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>中共中央政治局委員、外長王毅表示，國家主席習近平應美國總統特朗普邀請，將於今年秋季對美國進行國事訪問。</p>

<p>王毅表示，中美元首會晤達成豐富成果，雙方同意在對等降稅框架下，推動擴大雙向貿易，又指在會晤中感受到美方重視中方對台灣問題的關切，不認同也不接受台灣走向獨立。</p>

<p>編輯：梁家奇</p>

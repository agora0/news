  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">德法股市高收逾1%　英股復市後偏軟</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-05-06T05:50:43+08:00" itemprop="datePublished">May 6, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>歐洲主要股市普遍升逾1%至逾2%，意大利股市升幅較大。</p>

<p>德國DAX指數收報24401點，接近全日高位，升410點，升幅1.71%，創半個月收市新高。</p>

<p>法國CAC指數重返8000點以上，收報8062點，升86點，升幅1.08%。</p>

<p>英國股市復市後偏軟，富時100指數收報10219點，跌144點，跌幅1.4%，連跌兩個交易日。</p>

<p>編輯：方嘉莉</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">青衣有水管爆裂致翠怡花園及附近一帶停水　料早上10時恢復供水</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-05-08T00:43:11+08:00" itemprop="datePublished">May 8, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>青衣鄉事會路有水管爆裂。</p>

<p>水務署網站顯示，翠怡花園及附近一帶現正停水，並安排水車到青衣邨及翠怡花園，預計今早10時恢復供水。</p>

<p>運輸署表示，因水管爆裂，青衣鄉事會路往青衣港鐵站方向，介乎涌美路與楓樹窩路之間的一段全線仍然封閉，附近超過十條巴士線受影響要改道。</p>

<p>編輯：許敬軒</p>

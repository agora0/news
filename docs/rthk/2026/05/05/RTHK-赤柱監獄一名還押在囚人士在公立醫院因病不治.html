    <h1 class="post-title p-name" itemprop="name headline">赤柱監獄一名還押在囚人士在公立醫院因病不治</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-05-05T15:24:40+08:00" itemprop="datePublished">May 5, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>赤柱監獄一名56歲男性還押在囚人士在公立醫院因病不治。
　　 
該名人士患有肝硬化，一直需要接受院所醫院和公立醫院治療及跟進。他於上月30日因身體不適被送往公立醫院接受治療，留院期間情況惡化，延至今日上午證實不治。懲教署已將事件通知警方，死因裁判法庭將進行死因研訊。
　　 
該名還押在囚人士於去年10月因保管或控制偽製紙幣及硬幣罪而被還押。</p>

<p>編輯：黃佩珊</p>

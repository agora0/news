    <h1 class="post-title p-name" itemprop="name headline">蔡若蓮明日率團赴杭州出席世界數字教育大會</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-05-10T15:57:49+08:00" itemprop="datePublished">May 10, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>教育局局長蔡若蓮明日率領本港中小學及高等院校代表團，出席在杭州舉行的2026世界數字教育大會，與海內外教育部門官員，以及教育界和企業代表探討數字教育發展的最新趨勢。她將發表專題演講。
　　 
行程期間，蔡若蓮會到訪當地學校和創科機構，與教育專家會面和交流經驗。
　　 
蔡若蓮將於星期三返港，離港期間由教育局副局長施俊輝署任局長。</p>

<p>編輯：陳樂謙</p>

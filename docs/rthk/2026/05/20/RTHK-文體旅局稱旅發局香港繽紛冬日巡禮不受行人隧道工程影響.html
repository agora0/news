  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">文體旅局稱旅發局香港繽紛冬日巡禮不受行人隧道工程影響</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-05-20T22:51:11+08:00" itemprop="datePublished">May 20, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>文化體育及旅遊局表示，據局方了解，位於皇后像廣場花園北面部分的擬建行人隧道工程，將於2027年初展開，旅發局今年底在皇后像廣場花園舉辦的「香港繽紛冬日巡禮」將不受影響，活動詳情稍後公布。</p>

<p>局方回覆查詢說，當局聯同旅發局會與相關部門保持緊密聯繫，確保將來舉辦的活動繼續保持吸引力。</p>

<p>編輯：李俊傑</p>

    <h1 class="post-title p-name" itemprop="name headline">伊朗首都有市場發生大火未造成傷亡</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-02-04T04:17:36+08:00" itemprop="datePublished">Feb 4, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>伊朗首都德黑蘭西部一個市場發生大火，未有造成傷亡。</p>

<p>火警在星期二上午發生，報道引述消防部門發言人說，市場之前三次因為未遵守安全措施而收到警告，但都未予以重視，市場沒有安裝警報系統，亦沒有採取其他安全措施，例如對存放的商品和材料進行安全分類。</p>

<p>當地傳媒報道，市場出售大量衣物、化妝品等商品，助長火勢蔓延，火警造成的經濟損失非常大。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">洲頭村單位發現多具貓隻和倉鼠屍體　28歲男子疑涉案被捕</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-02-02T10:35:49+08:00" itemprop="datePublished">Feb 2, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>落馬洲洲頭村一名28歲男子涉嫌殘酷對待動物被捕，警方在他的寓所發現20具貓隻屍體及一具倉鼠屍體。</p>

<p>警方昨日接獲居民報案指，該村屋傳出異味，警員接報到場，發現9隻貓，部分健康情況欠佳，懷疑被不恰當對待，同時亦發現動物屍體。</p>

<p>警方表示，所有貓隻及倉鼠屍體會由相關機構撿走，該9隻貓亦分別交予相關機構及部門照顧，並進一步檢查。</p>

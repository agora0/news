  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">伊美將舉行新一輪談判　阿拉格齊駁斥特朗普對伊朗導彈計劃指控</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-02-26T05:22:59+08:00" itemprop="datePublished">Feb 26, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>伊朗與美國新一輪間接談判今天在瑞士日內瓦舉行。</p>

<p>伊朗代表團已經抵達當地，率團的外長阿拉格齊駁斥美國總統特朗普在國情咨文中對伊朗導彈計劃的指控，強調伊朗導彈計劃只用於防禦和威懾。</p>

<p>美國參與談判的代表，包括特朗普的女婿庫什納及總統特使威特科夫。據報威特科夫表示，美方的立場是與伊朗達成的任何協議都應該無限期有效。</p>

<p>編輯：盧曉珊</p>

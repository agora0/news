    <h1 class="post-title p-name" itemprop="name headline">聲稱年初一金鐘站放炸彈疑犯　被暫控炸彈嚇詐罪明早提堂</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-02-08T11:07:12+08:00" itemprop="datePublished">Feb 8, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>警方日前拘捕一名31歲男子，涉嫌在網上聲稱於年初一在港鐵金鐘站放置炸彈。該名男子被暫控一項「炸彈嚇詐」罪，明日上午在東區裁判法院提堂。</p>

<p>警方昨日公布，上月27日接獲舉報，指線上遊戲見到一名玩家在網上遊戲群組，聲稱會在農曆年初一，在港鐵金鐘站放炸彈。警方經情報分析後，於上星期五晚在沙田拘捕涉案男子，並在其住所找到仿製槍械。</p>

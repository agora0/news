    <h1 class="post-title p-name" itemprop="name headline">朝鮮勞動黨第九次代表大會選舉金正恩為黨總書記</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-02-23T08:37:33+08:00" itemprop="datePublished">Feb 23, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>朝中社報道，朝鮮勞動黨第九次代表大會昨日舉行會議，選舉金正恩為黨總書記。</p>

<p>大會通過相關的決議書。決議書說，朝鮮勞動黨第九次代表大會根據全體代表、數百萬黨員、全國人民和人民軍官兵的意志和要求，決定擁戴金正恩為朝鮮勞動黨總書記。</p>

<p>報道說，大會又選舉勞動黨中央委員會委員和候補委員，以及一致表決通過關於修改朝鮮勞動黨章程的決議書。</p>

<p>編輯：方潤南</p>

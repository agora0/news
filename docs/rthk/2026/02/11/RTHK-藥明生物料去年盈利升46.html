  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">藥明生物料去年盈利升46%</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-02-11T08:53:41+08:00" itemprop="datePublished">Feb 11, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>藥明生物預計，去年度盈利按年增長46%至近49.1億元人民幣，經調整盈利增長22%至近65.9億元。</p>

<p>公司又預計，收益增長近17%至217.9億元，毛利率提升約5個百分點至46%。</p>

<p>公司表示，增長受到多個先進技術產生研究服務收益增長、利用好現有及新增產能、數字化方案實現節約成本等多個因素帶動。</p>

<p>編輯：宋家樑</p>

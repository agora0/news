    <h1 class="post-title p-name" itemprop="name headline">上水清河邨有單位起火女住戶送院　警方相信因電熱墊電線短路引致</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-02-11T04:51:54+08:00" itemprop="datePublished">Feb 11, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>上水清河邨發生火警，一名女住戶不適送院。</p>

<p>事發在凌晨1時許，警方接獲報案，指清頌樓一個單位有濃煙冒出，懷疑發生火警。消防接報到場後將火救熄，一名87歲女住戶吸入濃煙不適，清醒送往北區醫院治理，事件中約3百人自行疏散到安全位置。</p>

<p>警方表示，相信起火是由一個電熱墊電線短路引致，現階段無證據顯示事件涉及刑事成分。</p>

<p>編輯：羅宇光</p>

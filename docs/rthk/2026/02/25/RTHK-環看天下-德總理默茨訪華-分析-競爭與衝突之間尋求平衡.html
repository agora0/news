  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">《環看天下》：德總理默茨訪華　分析：競爭與衝突之間尋求平衡</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-02-25T10:09:35+08:00" itemprop="datePublished">Feb 25, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>應國務院總理李強邀請，德國總理默茨今日起一連兩日對中國進行正式訪問，據報行程包括在北京出席德中經濟顧問委員會座談會，並與中國領導人會晤。</p>

<p>默茨是今年繼加拿大總理卡尼，以及英國首相施紀賢後，另一位訪華的西方國家領袖。</p>

<p>德國近年既視中國為合作伙伴，亦是競爭對手。外界關注，默茨如何透過此行闡述德國立場，尋求在兩者之間取得平衡。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">三機構洩僱員個人資料　私隱公署介入</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-02-03T18:33:32+08:00" itemprop="datePublished">Feb 3, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>個人資料私隱專員公署早前介入三宗涉及個人資料保安事故，三宗個案的被投訴機構，均為投訴人的僱主，因缺失導致個人資料被不當披露等，違反《私隱條例》相關規定，私隱專員已發出執行通知或警告信，指示糾正。</p>

<p>另外，公署在去年合共處理了308宗「起底」個案，按年減少30%；至於資料外洩事故通報，全年共接獲246宗，按年增加21%。</p>

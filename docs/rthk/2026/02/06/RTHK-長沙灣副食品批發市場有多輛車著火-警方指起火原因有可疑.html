  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">長沙灣副食品批發市場有多輛車著火　警方指起火原因有可疑</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-02-06T19:50:42+08:00" itemprop="datePublished">Feb 6, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>長沙灣副食品批發市場有8輛車著火，兩人受傷送院，其中一名46歲非華裔男子情況危殆。警方指起火原因有可疑。</p>

<p>網上片段所見，現場火勢猛烈，濃煙升上半空。</p>

<p>事發在下午3時許，至少有4輛輕型貨車、兩輛中型貨車、及一輛私家車著火，其中兩名司機受傷，分別送往瑪嘉烈醫院及伊利沙伯醫院。消防出動兩條喉及兩隊煙帽隊灌救，其後將火救熄。</p>

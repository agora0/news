  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">林定國近日到訪勵德邨　籲新一年多關心鄰里並送暖社區</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-02-15T15:17:24+08:00" itemprop="datePublished">Feb 15, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>律政司司長林定國表示，早前到大坑勵德邨探訪居民，提早拜年。</p>

<p>林定國在社交專頁表示，其中一戶一家三口，他們從劏房到過渡性房屋，再在年前搬到勵德邨，很滿意現在的居住環境。</p>

<p>他表示，農曆新年將近，大家準備過年時，不妨多關心左鄰右里，把迎接新一年的溫暖和朝氣送到社區。</p>

<p>編輯：陳樂謙</p>

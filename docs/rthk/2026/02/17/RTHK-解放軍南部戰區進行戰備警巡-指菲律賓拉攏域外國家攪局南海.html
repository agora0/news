  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">解放軍南部戰區進行戰備警巡　指菲律賓拉攏域外國家攪局南海</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-02-17T11:27:08+08:00" itemprop="datePublished">Feb 17, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>解放軍南部戰區新聞發言人表示，前日至昨日，南部戰區組織海空兵力在南海海域進行戰備警巡，指菲律賓拉攏域外國家組織所謂「聯合巡航」，攪局南海，破壞地區和平穩定。</p>

<p>發言人強調，戰區部隊將堅決捍衛國家領土主權和海洋權益，堅定維護地區和平穩定。</p>

<p>編輯︰張萬燕</p>

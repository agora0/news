    <h1 class="post-title p-name" itemprop="name headline">以色列防長稱拉里賈尼在以軍空襲中喪生　伊朗暫未回應</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-03-17T17:47:50+08:00" itemprop="datePublished">Mar 17, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>以色列傳媒引述以色列國防部長卡茨表示，伊朗最高國家安全委員會秘書拉里賈尼，在以色列對伊朗的一次空襲中喪生，伊朗暫時未有回應。</p>

<p>新華社較早時引述伊朗一間通訊社報道，將發布來自拉里賈尼的信息。</p>

<p>編輯︰張萬燕</p>

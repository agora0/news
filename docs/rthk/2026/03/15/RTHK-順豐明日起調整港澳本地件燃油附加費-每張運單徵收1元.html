  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">順豐明日起調整港澳本地件燃油附加費　每張運單徵收1元</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-03-15T20:04:26+08:00" itemprop="datePublished">Mar 15, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>順豐香港表示，因應近期國際局勢導致全球燃油價格劇烈波動，明日起調整香港及澳門本地件的燃油附加費，非月結形式支付的文件及包裹，每張運單徵收1元港幣或澳門幣。</p>

<p>順豐表示，有關收費是臨時性，公司會密切留意市場變化及油價走勢，按機制作出調整。</p>

<p>編輯：陳曉慶</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">宏福苑居民稱曾目睹很多街坊被拒絕進入業主大會</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-03-30T12:44:57+08:00" itemprop="datePublished">Mar 30, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>大埔宏福苑火災獨立委員會首輪第5場聽證會，早上繼續傳召多名宏福苑居民作供。</p>

<p>有居民提到曾經在業主大會上目睹有大量授權票被放入投票箱，又說與很多街坊都曾經被拒絕進入業主大會。</p>

<p>亦有居民作供表示，颱風後被換上的新棚網比較單薄，曾經向承建商投訴，但對方無回應。</p>

<p>編輯：譚佩貞</p>

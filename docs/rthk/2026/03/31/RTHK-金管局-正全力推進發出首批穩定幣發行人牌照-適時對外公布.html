  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">金管局：正全力推進發出首批穩定幣發行人牌照　適時對外公布</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-03-31T19:06:43+08:00" itemprop="datePublished">Mar 31, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>金管局回查詢時表示，正全力推進發出首批穩定幣發行人牌照事宜，會適時對外公布。</p>

<p>金管局總裁余偉文上月表示，收到36個穩定幣牌照申請，爭取3月發出牌照。他強調首輪發牌數目一定不多，以安穩為目標。</p>

<p>編輯：宋家樑</p>

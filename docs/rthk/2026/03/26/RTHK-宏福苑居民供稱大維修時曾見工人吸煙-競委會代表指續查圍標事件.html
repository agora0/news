  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">宏福苑居民供稱大維修時曾見工人吸煙　競委會代表指續查圍標事件</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-03-26T18:54:52+08:00" itemprop="datePublished">Mar 26, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>大埔宏福苑火災獨立委員會完成首輪第4場聽證會，共傳召12名證人作供。多名作供的宏福苑居民表示，大維修期間曾經見到有工人吸煙，又或者曾經聞到煙味。</p>

<p>競委會代表陳詞表示，宏福苑的圍標事件，可能涉及兩個以上圍標集團，調查仍然繼續，不排除有進一步檢控，又指以往坊間指圍標最多只是民事罰款的思維已不再適用。</p>

<p>編輯：任順熙</p>

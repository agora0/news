    <h1 class="post-title p-name" itemprop="name headline">亞殘運輪椅劍擊女子花劍團體賽　港隊晉決賽與國家隊爭金</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-10-20T11:48:12+08:00" itemprop="datePublished">Oct 20, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>亞殘運輪椅劍擊項目，港隊在女子花劍團體賽四強擊敗泰國晉級，將與國家隊爭奪金牌。</p>

<p>港隊由林嘉雯、鍾婉萍、余翠怡和湯雅婷出賽，港隊在兩節後一度落後1:10，主將余翠怡於第三節力追，單節取得14分，帶領港隊反先15:13，之後港隊保持優勢，最終贏30:23晉身決賽。</p>

<p>男子花劍團體賽方面，港隊八強以12:30不敵日本，無緣晉級。</p>

<p>編輯：譚佩貞</p>

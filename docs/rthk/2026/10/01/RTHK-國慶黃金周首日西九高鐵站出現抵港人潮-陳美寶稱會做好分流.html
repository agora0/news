    <h1 class="post-title p-name" itemprop="name headline">國慶黃金周首日西九高鐵站出現抵港人潮　陳美寶稱會做好分流</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-10-01T17:46:55+08:00" itemprop="datePublished">Oct 1, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>內地國慶黃金周假期首日，高鐵西九龍站早上出現抵港人潮。有內地旅客特意趁長假期帶家人來港遊覽，打算遊覽多個熱門景點。亦有市民自製長假期北上。</p>

<p>運輸及物流局局長陳美寶早上到場視察，預料未來幾日仍有大量旅客南下或北上，當局會做好分流措施。</p>

<p>編輯：譚佩貞</p>

    <h1 class="post-title p-name" itemprop="name headline">林文健：相信李自力豐富國際經驗　能帶領香港革新醫藥審批制度</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-10-26T13:03:07+08:00" itemprop="datePublished">Oct 26, 2026

  <div class="post-content e-content" itemprop="articleBody">
    <p>剛上任的藥物及醫療器械監督管理總監李自力表示，將成立以臨床評審為核心的跨專業科學團隊，建立具全面能力、國際信任和獨立戰略定位的藥監機構，服務香港以至全世界的患者。</p>

<p>衞生署署長林文健指出，相信李自力豐富的國際經驗和領導才能，能夠帶領香港革新醫藥審批制度。</p>

    <h1 class="post-title p-name" itemprop="name headline">觀塘翠屏北邨火警13歲男童單位外冷氣機頂獲救　其母涉虐兒被捕</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-10-08T01:16:46+08:00" itemprop="datePublished">Oct 8, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>觀塘翠屏北邨翠桃樓一個單位昨晚發生火警，消防在單位外的冷氣機頂部救出一名13歲男童，他懷疑吸入濃煙感到不適，清醒送院治理。警方經進一步調查，相信男童被獨留在單位，以涉嫌對所看管兒童或少年人虐待或忽略拘捕他的42歲母親。</p>

<p>初步調查相信，起火單位客廳的外置充電器引起火警，火警期間有70人自行疏散。</p>

<p>編輯︰張萬燕</p>

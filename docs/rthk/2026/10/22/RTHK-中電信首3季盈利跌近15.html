    <p>中電信首9月盈利跌近15%，至262.1億元人民幣。</p>

<p>期內，經營收入跌近4%至3824億元。</p>

<p>至9月底止，移動用戶逾4.45億戶，淨增加662萬戶。5G網絡用戶淨增加2858萬戶，至約3.3億戶。</p>

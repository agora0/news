  <div class="post-content e-content" itemprop="articleBody">
    <p>亞殘運乒乓項目，港隊代表林恩羽及黃翰林在混合XD20級雙打決賽，不敵中華台北組合，奪得一面銀牌。</p>

<p>林恩羽及黃翰林決賽面對中華台北的林姿妤和蘇晉賢，各取一局之後，連輸兩局5:11和8:11，局數1:3落敗，奪得亞軍。</p>

<p>編輯：任順熙</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">美國賓夕法尼亞州槍擊案　造成槍手在內至少9死</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-10-11T00:31:45+08:00" itemprop="datePublished">Oct 11, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>美國賓夕法尼亞州伊利市發生大規模槍擊事件，造成槍手在內至少9人死亡。</p>

<p>事發在當地星期五，哥倫比亞廣播公司報道，有目擊者見到一名男子在伊利市佩里街附近向人群開槍，隨後進入一處住宅，警方下午5時左右抵達現場，在住宅附近街道發現兩具遺體，並在住宅內發現槍手在內7名死者的遺體，槍手懷疑自盡。</p>

<p>報道說，警方暫時未公布槍手身份和動機。</p>

<p>編輯：許敬軒</p>

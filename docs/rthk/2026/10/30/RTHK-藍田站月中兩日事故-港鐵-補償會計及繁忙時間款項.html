    <h1 class="post-title p-name" itemprop="name headline">藍田站月中兩日事故　港鐵：補償會計及繁忙時間款項</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-10-30T21:03:06+08:00" itemprop="datePublished">Oct 30, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>港鐵藍田站本月中連續兩日有設備故障，影響列車服務。港鐵表示，會詳細調查相關組件損耗的原因，一個月內向政府提交報告。</p>

<p>至於對乘客的補償，港鐵表示會按機制處理，由於兩日事故都影響繁忙時間列車服務，會計及當中涉及的額外款項。</p>

<p>編輯：梁家奇</p>

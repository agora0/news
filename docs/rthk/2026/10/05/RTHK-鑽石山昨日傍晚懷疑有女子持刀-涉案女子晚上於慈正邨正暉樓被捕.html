    <h1 class="post-title p-name" itemprop="name headline">鑽石山昨日傍晚懷疑有女子持刀　涉案女子晚上於慈正邨正暉樓被捕</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-10-05T02:48:20+08:00" itemprop="datePublished">Oct 5, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>鑽石山昨日傍晚懷疑有女子持刀，警員昨晚在慈雲山慈正邨拘捕涉案女子並將她送院。</p>

<p>警方表示，昨日傍晚6時50分接到港鐵鑽石山站職員報案，指一名女子手持相信是陶瓷刀的利器，敲打客務中心櫃枱後離開。</p>

<p>警員調查後，懷疑涉案女子身處慈正邨正暉樓一個單位，消防破門入屋後，警員拘捕涉案女子，將她送往伊利沙伯醫院。</p>

<p>編輯：盧曉珊</p>

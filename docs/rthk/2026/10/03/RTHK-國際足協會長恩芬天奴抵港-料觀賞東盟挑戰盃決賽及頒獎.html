    <h1 class="post-title p-name" itemprop="name headline">國際足協會長恩芬天奴抵港　料觀賞東盟挑戰盃決賽及頒獎</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-10-03T09:31:20+08:00" itemprop="datePublished">Oct 3, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>國際足協東盟挑戰盃決賽傍晚將於啟德主場館上演，由中國香港對柬埔寨，港隊力爭在主場捧盃。國際足協會長恩芬天奴昨日抵港，預料將會入場觀賞賽事並頒獎。</p>

<p>恩芬天奴在社交平台發放照片，形容很高興能夠來港，又指足總成功舉辦今次賽事，今日的決賽將會是歷史性。他又與足總會長貝鈞奇及主席霍啟山會面。</p>

<p>編輯：許敬軒</p>

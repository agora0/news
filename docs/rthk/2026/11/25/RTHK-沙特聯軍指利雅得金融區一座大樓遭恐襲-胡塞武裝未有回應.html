  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">沙特聯軍指利雅得金融區一座大樓遭恐襲　胡塞武裝未有回應</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-11-25T00:09:20+08:00" itemprop="datePublished">Nov 25, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>沙特阿拉伯主導的多國聯軍表示，位於沙特首都利雅得的阿卜杜拉國王金融區，一座大樓遭到襲擊，發言人指事件是恐怖襲擊，有關部門正在現場處理。</p>

<p>利雅得最高的建築物，日前遭到也門胡塞武裝襲擊，多個樓層受損，沒有造成傷亡。沙特民防總局早前譴責襲擊，公然違反國際人道法。</p>

<p>也門胡塞武裝對今次事件暫時未有回應。</p>

<p>編輯：盧曉珊</p>

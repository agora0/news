  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">北角電燈中心低壓設備異常　一名員工受傷送院</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-11-18T21:45:22+08:00" itemprop="datePublished">Nov 18, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>港燈表示，下午約5時接報，位於北角電燈中心地下的一台低壓設備出現異常。消防員接報到場後迅速將火救熄。一名港燈員工受傷，清醒送院接受治療。</p>

<p>港燈十分關注員工的情況，正密切跟進並提供適切支援；同時配合有關部門調查事件起因，會進一步檢查相關設備。</p>

<p>北角電燈中心部分樓層的供電受事故影響，客戶的電力供應則維持正常。</p>

<p>編輯：鍾慧儀</p>

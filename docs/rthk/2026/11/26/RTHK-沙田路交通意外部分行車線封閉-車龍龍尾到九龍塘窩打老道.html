  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">沙田路交通意外部分行車線封閉　車龍龍尾到九龍塘窩打老道</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-11-26T08:57:59+08:00" itemprop="datePublished">Nov 26, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>沙田路近博康商場對開早上發生交通意外，沙田路往馬鞍山方向、近新田圍全線仍然封閉，現時車龍的龍尾已到九龍塘窩打老道。</p>

<p>意外涉及兩輛私家車。運輸署表示，受意外影響，獅子山隧道往沙田方向，仍然實施間歇性封閉。</p>

<p>現時上址交通擠塞，運輸署呼籲駕駛人士考慮改用其他道路，例如青沙公路或大老山隧道。</p>

<p>編輯：譚佩貞</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">法國周末示威逾4百人被捕　50名警員及憲兵受傷</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-11-16T00:50:29+08:00" itemprop="datePublished">Nov 16, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>法國內政部及巴黎檢察院公布的最新資料顯示，當地過去的星期六在全國範圍發生的示威活動中，共有404人被捕，其中在巴黎有134人被捕，當中79人被拘留審查。</p>

<p>法國內政部就說，星期六全國共有50名警員及憲兵受傷，暫未交代他們的傷勢。</p>

<p>根據內政部，星期六法國全國共有137場示威活動，超過10萬人參加。</p>

<p>編輯：羅宇光</p>

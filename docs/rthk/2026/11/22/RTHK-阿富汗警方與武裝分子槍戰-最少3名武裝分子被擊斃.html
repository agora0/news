  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">阿富汗警方與武裝分子槍戰　最少3名武裝分子被擊斃</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-11-22T20:06:40+08:00" itemprop="datePublished">Nov 22, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>阿富汗內政部表示，警方特種部隊昨晚在首都喀布爾與武裝分子槍戰，擊斃最少3名武裝分子。</p>

<p>內政部表示，多名武裝分子在喀布爾第11區向警方開火，雙方之後發生槍戰。</p>

<p>當局表示，這批武裝分子與喀布爾早前一宗運鈔車搶劫案有關，案件造成2名銀行工作人員喪生。警方日前已經拘捕同一個武裝組織的另外7名成員，指他們涉嫌參與多宗武裝搶劫和謀殺案。</p>

<p>編輯：盧曉珊</p>

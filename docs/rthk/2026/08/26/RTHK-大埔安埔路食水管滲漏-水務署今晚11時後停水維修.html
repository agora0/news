  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">大埔安埔路食水管滲漏　水務署今晚11時後停水維修</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-08-26T20:18:35+08:00" itemprop="datePublished">Aug 26, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>水務署表示，大埔安埔路一條直徑200毫米的食水供水管滲漏，該水管供應食水予大元邨、汀雅苑及大元商場。署方將在今晚11時用水高峰期後停水維修，並已為受影響用戶安排臨時食水，包括陸續放置2架水車及20個水箱在受影響範圍，並派員主動為有需要用戶及安老院送上樽裝水。</p>

<p>水務署爭取於明日中午12時前完成緊急水管維修工程並恢復食水供應。</p>

<p>編輯：鍾慧儀</p>

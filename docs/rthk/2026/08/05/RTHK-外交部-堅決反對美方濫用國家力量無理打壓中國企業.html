  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">外交部：堅決反對美方濫用國家力量無理打壓中國企業</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-08-05T20:29:31+08:00" itemprop="datePublished">Aug 5, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>在北京，外交部回應美國正起草法規禁止進口中國產新型光收發模組等提問。發言人林劍表示，中方堅決反對美方泛化國家安全概念，濫用國家力量無理打壓中國企業。保護主義提升不了美國的競爭力，美方做法嚴重阻礙中美企業正常經貿往來，不符合包括美國企業及消費者在內的各方利益。中方將繼續堅定維護中國企業的正當合法權益。</p>

<p>編輯︰張萬燕</p>

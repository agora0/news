    <h1 class="post-title p-name" itemprop="name headline">皇崗口岸演練模擬電動車起火　消防人員以專用裝備滅火</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-08-29T19:23:00+08:00" itemprop="datePublished">Aug 29, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>皇崗口岸進行第4次大型演練、亦是本港與深圳第二次跨境測試。消防處有份參與，進行電動車滅火演練。</p>

<p>在壓力測試期間，消防處進行火警演練，模擬有電動車於皇崗口岸聯檢大樓範圍起火，司機受傷。消防處隨即調派皇崗消防局及附近地區的車輛到場，消防人員以電動車火警專用裝備撲滅火警，救護人員為傷者提供適切治理並安排送院。</p>

<p>編輯：任順熙</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">金蝶上半年業績扭虧為盈</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-08-11T17:36:00+08:00" itemprop="datePublished">Aug 11, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>金蝶國際上半年盈利5450萬元人民幣，去年同期虧損約9800萬元，經調整後盈利1.16億元，同樣轉虧為盈。不派中期息。</p>

<p>上半年收入增長約13.6%，達到36.25億元。毛利率提升約2.1個百分點，升至約67.7%。</p>

<p>收入上升主要受惠於AI原生產品收入按年增長近2倍。雲服務收入增長約17%，佔整體收入達86%。</p>

<p>編輯：羅煒皓</p>

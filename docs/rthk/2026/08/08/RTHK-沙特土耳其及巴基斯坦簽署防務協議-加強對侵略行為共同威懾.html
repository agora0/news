    <h1 class="post-title p-name" itemprop="name headline">沙特土耳其及巴基斯坦簽署防務協議　加強對侵略行為共同威懾</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-08-08T01:15:31+08:00" itemprop="datePublished">Aug 8, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>沙特阿拉伯、土耳其、巴基斯坦，簽署共同防務協議。</p>

<p>沙特王儲兼首相穆罕默德、與到訪的土耳其總統埃爾多安及巴基斯坦總理夏巴茲，在沙特西部城市麥加簽署《麥加共同防務協議》。</p>

<p>根據協議，對任何一國的武裝攻擊，都會被視為對三國全體的攻擊。三國發表聯合聲明，表示協議旨在加強對侵略行為的共同威懾，以及推動加強各領域防務合作。</p>

<p>編輯：盧曉珊</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">秘魯發生強烈地震　首都利馬等多地有震感</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-08-21T05:18:48+08:00" itemprop="datePublished">Aug 21, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>秘魯地球物理研究所表示，秘魯南部阿亞庫喬省發生7.2級地震。首都利馬等多地都有震感，目前暫時無人員傷亡和財產損失報告。</p>

<p>研究所說，地震發生在當地時間星期四下午1時，震央位於阿亞庫喬省科拉科拉市以北35公里，震源深度108公里。</p>

<p>中國地震台網正式測定，地震是6.7級，震源深度100公里。</p>

<p>編輯︰張萬燕</p>

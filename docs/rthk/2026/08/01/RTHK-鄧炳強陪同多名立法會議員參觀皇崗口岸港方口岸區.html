    <h1 class="post-title p-name" itemprop="name headline">鄧炳強陪同多名立法會議員參觀皇崗口岸港方口岸區</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-08-01T10:28:10+08:00" itemprop="datePublished">Aug 1, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>重建後的皇崗口岸港方口岸區，昨日零時起正式交付特區政府管轄。立法會主席李慧琼聯同多名立法會議員，在保安局局長鄧炳強、副局長卓孝業陪同下，到港方口岸區參觀。</p>

<p>議員早上約10時抵達皇崗口岸，他們先拍攝大合照，並聽取口岸工作人員講解聯檢大樓的佈局，其後到出境旅檢樓層，參觀合作查驗自助通道，最後會到入境車檢樓層，了解「聯合一站式」車道的運作。</p>

<p>編輯：鍾慧儀</p>

    <h1 class="post-title p-name" itemprop="name headline">伊朗最高領袖據報與總統會面　就經濟和軍事等問題交換意見</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-08-09T19:47:42+08:00" itemprop="datePublished">Aug 9, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>伊朗傳媒報道，伊朗最高領袖穆傑塔巴與伊朗總統佩澤希齊揚會面，就伊朗經濟和軍事等問題交換意見。</p>

<p>報道說，雙方在會見中詳細討論了伊朗當前面臨的問題和困難，重點涉及保障民眾生活需求、當前衝突局勢及未來形勢、軍事領域最新進展，以及外匯和能源等方面的保障和支出管理問題。</p>

<p>雙方又就伊朗與外國開展經濟合作等議題進行了討論。</p>

<p>編輯︰張萬燕</p>

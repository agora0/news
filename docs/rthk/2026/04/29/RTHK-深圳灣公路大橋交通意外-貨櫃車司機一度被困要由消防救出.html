  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">深圳灣公路大橋交通意外　貨櫃車司機一度被困要由消防救出</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-04-29T17:40:27+08:00" itemprop="datePublished">Apr 29, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>深圳灣公路大橋下午發生交通意外，一輛貨櫃車車頭嚴重損毀，司機受傷。</p>

<p>警方表示，事發下午約3時半，貨櫃車沿大橋往內地方向行駛，前車因交通狀況收慢，貨櫃車懷疑收掣不及，撞向前車的車尾。</p>

<p>貨櫃車司機一度被困，由消防救出，送往屯門醫院治理。</p>

<p>編輯：任順熙</p>

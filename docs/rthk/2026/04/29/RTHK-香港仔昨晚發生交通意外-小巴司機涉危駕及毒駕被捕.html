    <h1 class="post-title p-name" itemprop="name headline">香港仔昨晚發生交通意外　小巴司機涉危駕及毒駕被捕</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-04-29T03:17:59+08:00" itemprop="datePublished">Apr 29, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>香港仔昨晚發生交通意外，一名女子昏迷送院，涉事小巴司機涉嫌危險駕駛及毒後駕駛被捕。</p>

<p>事發在昨晚近7時，一輛小巴沿漁光道北行，在漁光道68號附近，懷疑撞到一名正在過路的74歲女子，她頭部受傷，昏迷送往瑪麗醫院治理。</p>

<p>警方初步調查後，68歲男小巴司機未能通過快速口腔液測試，涉嫌危險駕駛及毒後駕駛被捕。</p>

<p>編輯：盧曉珊</p>

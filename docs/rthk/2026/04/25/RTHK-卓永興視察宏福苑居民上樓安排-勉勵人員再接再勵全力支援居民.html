    <h1 class="post-title p-name" itemprop="name headline">卓永興視察宏福苑居民上樓安排　勉勵人員再接再勵全力支援居民</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-04-25T20:02:14+08:00" itemprop="datePublished">Apr 25, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>政府第6日分批安排大埔宏福苑受火災影響居民上樓執拾。</p>

<p>政務司副司長卓永興到宏福苑視察相關安排，勉勵不同崗位的人員繼續努力，再接再勵，全力支援上樓居民。</p>

<p>宏仁閣的上樓安排今日完成，當局星期日起會安排宏道閣居民，以及繼續安排宏昌閣居民上樓執拾。</p>

<p>編輯：陳樂謙</p>

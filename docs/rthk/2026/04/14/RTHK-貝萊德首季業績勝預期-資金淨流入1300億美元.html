  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">貝萊德首季業績勝預期　資金淨流入1300億美元</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-04-14T20:19:49+08:00" itemprop="datePublished">Apr 14, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>貝萊德首季盈利22.1億美元，按年升46%，按季升96%。每股經調整盈利12.53美元，好過預期。期內，收入近67億美元，高於預期，按年升27%，按季跌4%。</p>

<p>首季錄得資金淨流入1300億美元，受到iShares ETF淨流入創新高帶動。</p>

<p>資產管理規模約13.9萬億美元，按年升20%，但按季跌1%。</p>

<p>編輯：方嘉莉</p>

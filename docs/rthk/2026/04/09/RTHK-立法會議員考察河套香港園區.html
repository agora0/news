  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">立法會議員考察河套香港園區</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-04-09T18:40:27+08:00" itemprop="datePublished">Apr 9, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>立法會主席李慧琼聯同數十名立法會議員，考察北部都會區河套香港園區。</p>

<p>陪同考察的創新科技及工業局局長孫東話，正加快園區建設，爭取在香港首個五年規劃結束之際，提交一份滿意答卷。李慧琼表示，立法會將一如既往在支持北都和河套區發展基礎上，做好審議工作，向政府提出更多切實可行建議。</p>

<p>編輯：劉景輝</p>

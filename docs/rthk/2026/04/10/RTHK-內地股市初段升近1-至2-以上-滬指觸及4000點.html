    <p>內地股市初段造好。</p>

<p>上證指數一度重上4000點，較早時報3998點，升32點，升幅0.82%。</p>

<p>深證成份指數報14227點，升231點，升幅1.65%。</p>

<p>創板指數重上3400點，報3401點，升78點，升幅2.36%。</p>

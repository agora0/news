    <h1 class="post-title p-name" itemprop="name headline">范鴻齡對醫管局大會成員何超蕸辭世深表哀悼</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-04-12T21:47:38+08:00" itemprop="datePublished">Apr 12, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>​醫院管理局主席范鴻齡對醫管局大會成員何超蕸辭世深表哀悼，並向她的家屬致以深切慰問。</p>

<p>​范鴻齡表示，何超蕸在商界長袖善舞，更熱心公益，尤其關心市民醫療福祉，經常為公立醫院服務出謀獻策，鞭辟入裡，對她的辭世深感惋惜。</p>

<p>何超蕸2021年12月起獲委任為醫管局大會成員，其後在2023年4月起出任沙田醫院醫院管治委員會主席。</p>

<p>編輯：陳曉慶</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">中方稱反對缺乏國際法依據非法單邊制裁　促美方停止濫施制裁</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-04-27T17:32:36+08:00" itemprop="datePublished">Apr 27, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>在北京，外交部發言人林劍表示，中方一貫反對缺乏國際法依據的非法單邊制裁，敦促美方停止濫施制裁和「長臂管轄」的錯誤做法。</p>

<p>美國日前以與伊朗存在關聯為由，宣布制裁一間中國企業。林劍在例行記者會回應有關提問時說，中方將堅決維護本國企業的合法權益。</p>

<p>編輯：羅宇光</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">巴基斯坦總統正在訪華　中方稱願共同構建更緊密中巴命運共同體</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-04-27T16:10:58+08:00" itemprop="datePublished">Apr 27, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>在北京，外交部表示，巴基斯坦總統扎爾達里從上星期六起訪華7日，訪問湖南省及海南省。</p>

<p>發言人林劍在例行記者會表示，今年是中巴建交75周年，中巴關係保持高水平的良好發展勢頭。中方願同巴方一起，推動兩國各層級、各地方友好交流合作，共同致力構建更加緊密的中巴命運共同體。</p>

<p>編輯：羅宇光</p>

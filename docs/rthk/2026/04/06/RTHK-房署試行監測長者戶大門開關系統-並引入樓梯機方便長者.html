    <h1 class="post-title p-name" itemprop="name headline">房署試行監測長者戶大門開關系統　並引入樓梯機方便長者</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-04-06T12:30:50+08:00" itemprop="datePublished">Apr 6, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>房屋署去年起，在兩條公共屋邨試行「長者戶大門開關物聯網訊息系統」，如果長時間未開門，系統會自動通知住戶指定聯絡人，至今已有50多戶使用，最快今年第二季擴展至長者較多的東匯邨及天恩邨。</p>

<p>房屋署又說，今年初已分別在屯門友愛邨及樂富邨引入新型「樓梯機」和進行測試，協助行動不便的住戶及長者上落樓梯，預計今年第二季起，開放預約使用。</p>

<p>編輯：譚佩貞</p>

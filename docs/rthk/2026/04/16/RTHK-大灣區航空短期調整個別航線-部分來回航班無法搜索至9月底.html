  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">大灣區航空短期調整個別航線　部分來回航班無法搜索至9月底</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-04-16T12:44:14+08:00" itemprop="datePublished">Apr 16, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>大灣區航空表示，由於燃油價格持續上漲，市場環境不斷變化，基於商業考慮，將對個別航線服務作出短期調整。公司會主動聯絡相關乘客，作出適切安排，以盡量減低對他們造成的不便，並向受影響乘客致歉。</p>

<p>大灣區航空官方網站顯示，5月11日起已無法搜索來往香港及泰國曼谷的來回航班 ，直到10月1日才恢復，部分前往台北的班次亦取消。</p>

<p>編輯：譚佩貞</p>

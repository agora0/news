  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">申訴專員公署：漁護署調查殘虐動物工作欠成效</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-04-16T18:47:11+08:00" itemprop="datePublished">Apr 16, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>申訴專員公署調查漁護署打擊殘虐動物工作，發現漁護署現行的個案監察制度，有不少系統性的問題，調查有欠成效，亦未有就處理一般殘酷對待動物個案，制定工作指引等。</p>

<p>公署提出40多項改善建議，包括建議漁護署積極考慮修例，加強職員執法權力，並檢視及加強現時管理層對前線人員的監察機制等。</p>

<p>編輯：王濱南</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">兒童醫院利用虛擬實境　減少病童手術前焦慮</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-04-07T18:43:31+08:00" itemprop="datePublished">Apr 7, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>為減低兒童在接受手術前的焦慮，香港兒童醫院推行一系列措施，包括為接受非緊急手術的兒童，在手術當日先提供一次虛擬體驗，讓他們初步了解手術流程及手術室的實際環境。</p>

<p>團隊發現，參與手術室虛擬實境遊的兒童，焦慮程度較無參與的兒童少約20%。</p>

<p>編輯：王濱南</p>

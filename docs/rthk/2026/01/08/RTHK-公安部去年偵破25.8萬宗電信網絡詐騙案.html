    <h1 class="post-title p-name" itemprop="name headline">公安部去年偵破25.8萬宗電信網絡詐騙案</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-01-08T17:24:52+08:00" itemprop="datePublished">Jan 8, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>公安部表示，全國公安機關在去年全年，一共偵破25萬8千宗涉及電信網絡詐騙犯罪的案件，會同相關部門，攔截詐騙電話36億次、短信33億條，緊急止付涉詐資金逾2170萬元人民幣。另外，針對緬甸妙瓦底地區電信網絡詐騙犯罪嚴峻形勢，中方與緬甸、泰國建立三方協調機制，目前累計押解7600餘名妙瓦底地區中國籍涉電詐犯罪嫌疑人回國。</p>

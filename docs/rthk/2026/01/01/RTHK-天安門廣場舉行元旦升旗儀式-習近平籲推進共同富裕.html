    <h1 class="post-title p-name" itemprop="name headline">天安門廣場舉行元旦升旗儀式　習近平籲推進共同富裕</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-01-01T18:33:18+08:00" itemprop="datePublished">Jan 1, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>在北京，天安門廣場今早舉行元旦升旗儀式。</p>

<p>國家主席習近平昨晚發表新年賀辭，指2026年是「十五五」規劃開局之年，要錨定目標任務，紮實推動高質量發展，推進全體人民共同富裕。</p>

<p>習近平又表示，要堅定不移貫徹「一國兩制」方針，支持港澳更好融入國家發展大局，保持長期繁榮穩定。</p>

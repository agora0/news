    <h1 class="post-title p-name" itemprop="name headline">尹錫悅內亂案結案庭審　控方要求判處死刑</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-01-13T21:30:49+08:00" itemprop="datePublished">Jan 13, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>韓國前總統尹錫悅等人，涉嫌內亂罪的案件結案庭審，控方要求法院判尹錫悅死刑。</p>

<p>案件今天在首爾中央地方法院開庭，尹錫悅的證據審查程序持續了11個小時，隨後檢方發表意見陳述，並提出量刑建議。</p>

<p>控方要求法院判處尹錫悅死刑；而同案被告、前國防部長金龍顯，控方就要求判處終身監禁。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">湯修齊倡盡快研究及落實禁止邊行邊吸煙</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-01-13T18:40:52+08:00" itemprop="datePublished">Jan 13, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>香港吸煙與健康委員會委託港大調查顯示，近一半受訪者於受訪時過去7天內曾接觸二手煙，近九成受訪者支持擴大禁煙區，64%人支持擴展至所有室外公共場所。</p>

<p>吸煙與健康委員會主席湯修齊建議，政府盡快研究及落實禁止「火車頭」邊行邊吸煙的行為，又建議將禁止在排隊時吸煙的措施，伸展至港鐵站出口及其他大廈的出入口。</p>

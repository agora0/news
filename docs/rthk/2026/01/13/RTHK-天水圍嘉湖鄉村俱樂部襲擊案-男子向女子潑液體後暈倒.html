    <h1 class="post-title p-name" itemprop="name headline">天水圍嘉湖鄉村俱樂部襲擊案　男子向女子潑液體後暈倒　</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-01-13T12:11:02+08:00" itemprop="datePublished">Jan 13, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>天水圍發生襲擊案，3人送往天水圍醫院治理。</p>

<p>警方9時許接報，天水圍天龍路嘉湖鄉村俱樂部一間店舖内，有一名男子向一名女子潑液體，這名女子面部受傷，而這名男子其後暈倒，他暈倒前曾經服食藥物，兩人送院治理。現場另一名女子亦被送院檢查。</p>

<p>警方初步了解，3人認識，案件暫時列作襲擊致身體受傷處理。</p>

    <h1 class="post-title p-name" itemprop="name headline">鍾慧婷明日接替陳巧敏出任大埔民政事務專員</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-01-13T19:07:51+08:00" itemprop="datePublished">Jan 13, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>鍾慧婷明日接替陳巧敏出任大埔民政事務專員。</p>

<p>鍾慧婷於2010年加入政務職系，曾於多個政策局和部門工作，包括財經事務及庫務局、教育局、發展局、前政策創新與統籌辦事處和前食物及衞生局。</p>

<p>鍾慧婷調任大埔民政事務專員前，為食物環境衞生署助理署長（街市發展）。</p>

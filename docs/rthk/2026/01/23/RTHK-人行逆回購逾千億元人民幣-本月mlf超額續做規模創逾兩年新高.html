    <h1 class="post-title p-name" itemprop="name headline">人行逆回購逾千億元人民幣　本月MLF超額續做規模創逾兩年新高</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-01-23T09:43:53+08:00" itemprop="datePublished">Jan 23, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>人民銀行公開市場開展1250億元人民幣7天期逆回購操作，利率維持1.4厘。</p>

<p>公開市場單日淨投放383億元，連續3日淨投放，本周累計淨投放2295億元。</p>

<p>另外，人行今日開展9000億元中期借貸便利（MLF）操作，期限1年，連續11個月超額續做，淨增加7000億元，創逾兩年新高。</p>

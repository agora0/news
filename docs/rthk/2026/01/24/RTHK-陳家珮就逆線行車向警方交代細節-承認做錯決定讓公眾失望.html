    <h1 class="post-title p-name" itemprop="name headline">陳家珮就逆線行車向警方交代細節　承認做錯決定讓公眾失望　</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-01-24T18:15:48+08:00" itemprop="datePublished">Jan 24, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>新民黨立法會議員陳家珮昨日在灣仔駕車時逆線行駛。她下午到位於西灣河的警方港島交通部協助調查，並提交口供，她離開時向傳媒表示逗留約一小時，期間向警方交代事發時的細節，包括當時路面情況。</p>

<p>陳家珮表示，事件中做錯決定，讓公眾失望，會承擔法律責任，再向公眾致歉，期望盡快收到警方消息。</p>

    <h1 class="post-title p-name" itemprop="name headline">青衣青嶼幹線下午3車相撞共4人傷</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-01-24T22:04:37+08:00" itemprop="datePublished">Jan 24, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>青衣青嶼幹線下午近3時發生交通意外，4人受傷清醒送院。</p>

<p>事發時，一輛旅遊巴、一輛的士及一輛私家車沿青嶼幹線往九龍方向左二線行駛，其間旅遊巴及的士因應前方交通情況停下，但私家車收掣不及撞向的士，的士再向前撞向旅遊巴。</p>

<p>旅遊巴上3名女乘客分別頸、腳、手及肩部等部位受傷，至於的士一名乘客就報稱胸口痛。4人送往瑪嘉烈醫院治理。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">翰森製藥擬發行零息可換股債券　集資逾46億元</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-01-27T07:51:30+08:00" itemprop="datePublished">Jan 27, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>翰森製藥建議，發行46.8億港元於2033年到期的零息可換股債券。</p>

<p>初始換股價為每股57.39元，較上日收市溢價約43%。債券可轉換成約8155萬股股份，佔經擴大後已發行股本約1.33%。</p>

<p>集資淨額約46.4億元，將用於藥物研發及引進授權、新建研發中心和生產線、升級現有研發和生產設施，以及作為營運資金及其他一般企業用途。</p>

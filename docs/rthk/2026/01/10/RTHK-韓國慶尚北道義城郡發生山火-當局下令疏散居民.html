    <h1 class="post-title p-name" itemprop="name headline">韓國慶尚北道義城郡發生山火　當局下令疏散居民</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-01-10T16:31:17+08:00" itemprop="datePublished">Jan 10, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>韓國慶尚北道義城郡發生山火，當局派出數百名消防員撲救，並下令疏散居民。</p>

<p>韓國山林部門表示，火警發生在當地時間下午3時許，由於現場吹強風加上天氣乾燥，火勢迅速蔓延，當局隨後將應對級別升至第二級，派出8架直升機、52部消防車及315名消防員到場撲救。義城郡政府已指示附近居民疏散，當局正調查起火原因。</p>

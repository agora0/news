  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">《環看天下》：美國或透過控制委國　爭取全球石油供應話語權</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-01-06T08:40:15+08:00" itemprop="datePublished">Jan 6, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>美軍日前向委內瑞拉發動軍事行動，捉拿總統馬杜羅夫婦。總統特朗普公開揚言，美國將會接管委內瑞拉，並宣布美國大型石油企業將投資數以十億計美元，修復當地的石油基礎設施，並創造收益。</p>

<p>有分析認為，美國政府很可能有意透過控制委內瑞拉的龐大石油資源，繼而爭取全球石油供應的話語權。亦不排除藉此打擊中國、俄羅斯等與委內瑞拉多年來維持友好的國家。</p>

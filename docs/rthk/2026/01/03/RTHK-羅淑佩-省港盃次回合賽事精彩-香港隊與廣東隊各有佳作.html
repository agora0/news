    <h1 class="post-title p-name" itemprop="name headline">羅淑佩：省港盃次回合賽事精彩　香港隊與廣東隊各有佳作</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-01-03T23:08:31+08:00" itemprop="datePublished">Jan 3, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>第44屆省港盃次回合下午在廣州南沙大灣區文化體育中心舉行，在法定時間內，香港隊追平廣東隊2:2。兩回合計踢成4:4，結果廣東隊憑互射12碼贏4:3，奪得三連霸。</p>

<p>到場觀賽及頒獎的文化體育及旅遊局局長羅淑佩在社交平台表示，是第二次在香港以外觀看省港盃，她形容賽事精彩，雙方各有佳作，港隊90分鐘2:2迫和廣東，12碼僅敗，期待港隊今年越來越好。</p>

  <div class="post-content e-content" itemprop="articleBody">
    <p>警方昨日在葵青區搗破一個懷疑毒品儲存倉庫，以涉嫌販毒拘捕分別32歲的一男一女，他們正被扣查，並檢獲14磚共重約16公斤懷疑可卡因及6包共重約50克的懷疑大麻，總市值約1200萬元。</p>

<p>案件明日在西九龍裁判法院提堂。</p>

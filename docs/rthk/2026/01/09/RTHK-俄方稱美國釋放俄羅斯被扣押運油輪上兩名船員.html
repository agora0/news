  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">俄方稱美國釋放俄羅斯被扣押運油輪上兩名船員</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-01-09T20:29:52+08:00" itemprop="datePublished">Jan 9, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>俄羅斯外交部表示，美方應俄方要求，釋放在俄羅斯註冊的運油輪「水手」號上兩名俄羅斯籍船員。</p>

<p>美國當地星期三在北大西洋海域，扣押「水手」號。</p>

<p>俄羅斯外交部發言人扎哈羅娃表示，俄方對船員獲釋表示歡迎，並對美國領導人表示感謝。扎哈羅娃又說，已經立即處理後續工作，確保兩人盡快返回俄羅斯。</p>

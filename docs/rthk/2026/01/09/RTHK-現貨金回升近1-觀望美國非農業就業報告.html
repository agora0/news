    <h1 class="post-title p-name" itemprop="name headline">現貨金回升近1%　觀望美國非農業就業報告</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-01-09T06:31:50+08:00" itemprop="datePublished">Jan 9, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>現貨金止跌回穩，較早時升至每盎司4479.27美元，升約0.6%。</p>

<p>市場觀望美國非農業就業數據，以判斷聯儲局政策走向，但彭博商品指數年度調整本周啟動，修訂商品權重，為金銀帶來短期壓力。</p>

<p>紐約期金2月合約收報4460.7美元，跌1.8美元，跌幅0.04%。</p>

<p>現貨白銀較早時跌逾3%，徘徊每盎司75.6美元。</p>

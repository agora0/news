  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">內蒙古包頭市板材廠爆炸證實10人死亡</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-01-21T20:10:14+08:00" itemprop="datePublished">Jan 21, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>內蒙古包頭市一間板材廠日前爆炸，當局公布事故共造成10人死亡。</p>

<p>包頭市當局就事故成立的應急救援指揮部，今日公布，最後一名失聯人士證實喪生，更新死亡人數為10人，另外有84人受傷，全部傷者情況穩定。</p>

<p>事發在本月18日，包鋼股份板材廠廠房內發生爆炸，事故原因仍在調查當中，有關部門正在推進善後處置工作，並在全市範圍內開展安全生產隱患排查。</p>

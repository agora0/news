  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">李家超：全速編制香港五年規劃及推進北都建設　改善民生</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-07-01T19:09:03+08:00" itemprop="datePublished">Jul 1, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>香港特別行政區成立29周年，特區政府早上舉行升旗儀式和慶祝酒會。行政長官李家超表示，本屆政府上任4年來，解決了本港累積多年的問題，建立了安全和穩定的香港，完善了選舉制度，全面落實「愛國者治港」原則，並深化治理體系改革，陸續見到成果。展望未來，特區政府將全速編制香港五年規劃。全速推進北部都會區建設，及進一步改善民生。</p>

<p>編輯：劉景輝</p>

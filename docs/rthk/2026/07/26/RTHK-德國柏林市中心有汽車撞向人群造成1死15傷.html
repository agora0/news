    <h1 class="post-title p-name" itemprop="name headline">德國柏林市中心有汽車撞向人群造成1死15傷</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-07-26T07:35:54+08:00" itemprop="datePublished">Jul 26, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>德國柏林市中心發生汽車撞向人群事件，造成1死15傷，其中多人傷勢嚴重。</p>

<p>事發在當地星期六晚上，柏林警方在社交平台說，初步判斷，一部白色汽車在一個公園附近撞倒多人，之後撞向一棵樹後停低。</p>

<p>當地傳媒報道，一名駕駛肇事車輛的男子，事後徒步逃離現場。</p>

<p>當時有大批人聚集參與一個多元性別遊行活動，事後活動取消。</p>

<p>編輯：方潤南</p>

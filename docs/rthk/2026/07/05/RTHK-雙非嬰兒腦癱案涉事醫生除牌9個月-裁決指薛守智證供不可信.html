    <h1 class="post-title p-name" itemprop="name headline">雙非嬰兒腦癱案涉事醫生除牌9個月　裁決指薛守智證供不可信</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-07-05T18:25:23+08:00" itemprop="datePublished">Jul 5, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>16年前的雙非嬰兒腦癱案，醫委會研訊小組裁定，涉事醫生薛守智專業失當成立，除牌9個月，不獲緩刑。</p>

<p>裁決指出，薛守智的證供不可信，又認為他在男嬰出現首次癲癇發作後，就應立即回醫院進行檢查。</p>

<p>編輯：黃佩珊</p>

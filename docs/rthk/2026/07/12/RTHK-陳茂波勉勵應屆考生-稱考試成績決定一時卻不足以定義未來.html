    <p>中學文憑試本周三放榜。</p>

<p>財政司司長陳茂波勉勵應屆考生時說，考試成績決定了一時，卻不足以定義未來。</p>

<p>他說，出路選擇已更趨多元，人工智能讓傳統進修路徑的後階段，出現過去從未有過的分叉，未來會有更多新的發展方向和工作機會。</p>

<p>編輯：黃佩珊</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">巴威午夜左右於浙江沿海二次登陸　上海緊急轉移近30萬人</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-07-12T01:11:11+08:00" itemprop="datePublished">Jul 12, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>內地中央氣象台表示，熱帶氣旋巴威昨晚11時20分左右，在浙江台州玉環登陸，之後在午夜左右，於浙江溫州沿海二次登陸。</p>

<p>內地中央氣象台發布今年首個最高級別的暴雨紅色預警，並繼續發布颱風橙色預警。</p>

<p>國家防總派出工作組前往北京，協助指導防汛工作；上海市防汛指揮部截至昨晚9時，組織轉移接近30萬人，全市啟用905處防汛避災安置場所。</p>

<p>編輯：盧曉珊</p>

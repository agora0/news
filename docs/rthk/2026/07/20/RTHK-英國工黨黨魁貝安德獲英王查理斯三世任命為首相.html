  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">英國工黨黨魁貝安德獲英王查理斯三世任命為首相</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-07-20T19:22:02+08:00" itemprop="datePublished">Jul 20, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>英國執政工黨黨魁貝安德在白金漢宮與英王查理斯三世會面，獲任命為新一任首相，接替較早時辭職的施紀賢。</p>

<p>貝安德獲授權組建新一屆內閣，稍後將在唐寧街首相府以首相身分發表首次講話。</p>

<p>施紀賢發表告別演說時表示，自己的工作已經完成，他將風度翩翩地帶著微笑離開，又稱擔任首相是他畢生的榮幸，祝願貝安德一切順利，自己會全力支持對方。</p>

<p>編輯：鄭皓璟</p>

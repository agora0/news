  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">澳門氣象局預料一號風球將在今日維持</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-07-02T11:17:38+08:00" itemprop="datePublished">Jul 2, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>在澳門，一號風球仍然生效，預料一號風球將在今日維持。</p>

<p>氣象局預料南海中部的熱帶低氣壓將逐步增強，大致移向海南島。 受其影響，預測明日澳門風勢逐漸增強，改發三號風球的機會為中等。</p>

<p>天氣預測明日開始驟雨較為頻密，週末期間有驟雨及雷暴，雨勢有時頗大。</p>

<p>另一方面，由於熱帶低氣壓與澳門保持一定距離，加上並非天文大潮，出現明顯風暴潮的機會低。</p>

<p>編輯：方潤南</p>

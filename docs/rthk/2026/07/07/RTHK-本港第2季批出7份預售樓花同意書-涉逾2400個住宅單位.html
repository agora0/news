  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">本港第2季批出7份預售樓花同意書　涉逾2400個住宅單位</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-07-07T17:43:31+08:00" itemprop="datePublished">Jul 7, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>地政總署公布，第2季批出7份住宅項目預售樓花同意書，涉及2419個單位。</p>

<p>項目中682個單位來自古洞項目，預計今年落成；其餘1737個單位明年落成，來自元朗、土瓜灣、大嶼山、西貢項目。</p>

<p>上季亦批出兩份轉讓同意書。截至6月底，有待核准預售樓花同意書共28份，涉及約1.2萬個單位。</p>

<p>編輯：宋家樑</p>

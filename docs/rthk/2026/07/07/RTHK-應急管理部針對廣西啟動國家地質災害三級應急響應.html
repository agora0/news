  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">應急管理部針對廣西啟動國家地質災害三級應急響應</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-07-07T01:47:22+08:00" itemprop="datePublished">Jul 7, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>應急管理部針對廣西，啟動國家地質災害三級應急響應。</p>

<p>受「美莎克」影響，上星期五以來，廣西部分地區發生群發地質災害。根據氣象預測，由昨日至本月10日，廣西部分地區仍有大暴雨至特大暴雨，部分地區地質災害風險高，防範應對形勢嚴峻。</p>

<p>應急管理部根據國家突發地質災害應急預案及相關規定，針對廣西的國家地質災害四級應急響應，提升至三級應急響應。</p>

<p>編輯：羅宇光</p>

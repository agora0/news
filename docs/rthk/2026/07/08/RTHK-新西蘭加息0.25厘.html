    <p class="post-meta">

  <div class="post-content e-content" itemprop="articleBody">
    <p>新西蘭央行決定加息0.25厘，指標利率升至2.5厘。</p>

<p>央行會議記錄顯示，委員會一致同意加息，並且認為，通脹仍高於目標並預期經濟活動轉強，未來幾次會議可能再加，但時間點高度不確定性，又指出地緣政治不確定性仍然很高。</p>

<p>會議記錄提到，當前油價遠低5月聲明中的假設水平，近期通脹預測已經下降，委員會將根據市場定價及產能過剩對通脹壓力的影響，作出利率決定。</p>

<p>編輯：張詩民</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">澤連斯基籲北約及成員國加大對烏克蘭防空援助</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-07-08T01:24:24+08:00" itemprop="datePublished">Jul 8, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>烏克蘭總統澤連斯基於當地星期二在北約峰會期間，呼籲北約及北約成員國加大對烏克蘭的防空援助。</p>

<p>澤連斯基說，防空是烏克蘭當前的首要任務，烏克蘭有能力自行完成很多防務方面的任務，但在防空領域仍需要伙伴展現更大決心。
　　
他又說烏克蘭已經與美國方面討論「愛國者」防空系統生產許可的問題，烏方會在星期三與美方討論包括「愛國者」系統在內的多項議題。</p>

<p>編輯：羅宇光</p>

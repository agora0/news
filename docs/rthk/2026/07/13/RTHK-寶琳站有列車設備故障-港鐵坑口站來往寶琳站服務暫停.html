    <h1 class="post-title p-name" itemprop="name headline">寶琳站有列車設備故障　港鐵坑口站來往寶琳站服務暫停</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-07-13T07:40:33+08:00" itemprop="datePublished">Jul 13, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>港鐵表示，由於寶琳站有列車設備故障，將軍澳綫服務受阻。</p>

<p>將軍澳綫坑口站來往寶琳站暫停服務；北角站來往坑口站每12分鐘一班車；北角站來往康城站每4分鐘一班車。</p>

<p>港鐵已加派職員在相關車站協助乘客，免費接駁巴士將於稍後時間到達。</p>

<p>編輯：方潤南</p>

    <p class="post-meta">

  <div class="post-content e-content" itemprop="articleBody">
    <p>美國一名醫療保險公司高層較早前在紐約被人槍擊身亡。26歲疑犯被控包括一級謀殺和恐怖襲擊等罪名，案件日前在美國法院提堂。</p>

<p>美國當局指，疑犯可能是使用一支可以透過3D打印的「幽靈槍」行兇。外界關注，涉及「幽靈槍」的暴力案件及檢獲數目不斷上升，但目前法例仍未有相應規管；有意見認為，有必要盡快處理。</p>

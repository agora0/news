    <h1 class="post-title p-name" itemprop="name headline">元朗大棠山火焚燒超過一日後救熄　無人受傷</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-12-29T19:03:29+08:00" itemprop="datePublished">Dec 29, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>元朗大棠一帶、近大棠生態園的山火，焚燒超過一日後，在下午4時救熄，無人受傷。</p>

<p>山火在昨天下午近3時發生，一度出現兩條火線，消防到場撲救，政府飛行服務隊亦出動直升機協助救火。</p>

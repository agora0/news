  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">深灣道船廠三級火　火場靠近民居大量濃煙升半空</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-12-06T17:52:29+08:00" itemprop="datePublished">Dec 6, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>香港仔深灣道一個船廠發生三級火，至少60人疏散，暫時無人受傷。</p>

<p>現場火勢猛烈，大量濃煙升上半空，消防在現場動用4條喉及兩隊煙帽隊，並在不同位置架起雲梯灌救。</p>

<p>火警下午約4時10分發生，消防先將火警列為一級，至下午4時45分升為三級。</p>

<p>火場靠近民居，消防處表示，如市民受到隨風飄散的煙霧和異味影響，請關閉門窗及保持鎮定。</p>

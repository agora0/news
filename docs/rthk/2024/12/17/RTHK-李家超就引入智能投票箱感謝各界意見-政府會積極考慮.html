  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">李家超就引入智能投票箱感謝各界意見　政府會積極考慮</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-12-17T11:13:10+08:00" itemprop="datePublished">Dec 17, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>行政長官李家超表示，在引入智能投票箱方面，他感謝各界提出的意見，強調政府會積極考慮，確保在投票時一切順利進行，令每名投票人士都覺得整個經歷暢順和理想。</p>

<p>李家超在出席行會前，被問到引入智能投票箱會否削弱選民投「白票」的權利。李家超回應指，政制及內地事務局局長在立法會已介紹一些想法，而當局亦很重視意見，局長會積極吸納意見認真考慮，制定措施。</p>

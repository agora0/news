  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">港澳辦文章稱習近平澳門行強調堅守一國之本善用兩制之利推動發展</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-12-21T17:48:15+08:00" itemprop="datePublished">Dec 21, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>中共中央港澳工作辦公室、國務院港澳辦發表文章，回顧國家主席習近平的澳門之行，提到他深刻總結一國兩制實踐經驗，全面謀劃香港、澳門長遠發展藍圖，以及强調要堅守一國之本、善用兩制之利，維護高水平安全、推動高質量發展。</p>

<p>廣東省委常委會亦召開擴大會議，專題傳達學習習近平視察廣東、考察橫琴粵澳深度合作區及視察澳門的重要講話及指示精神。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">《環看天下》：德國提前在明年2月舉行大選　結果難料</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-12-21T10:18:59+08:00" itemprop="datePublished">Dec 21, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>德國總理朔爾茨日前未能通過國會聯邦議院的信任動議，將會提前在明年2月舉行大選。</p>

<p>分析認為，朔爾茨主動發起今次信任投票，是因為執政聯盟內部矛盾加劇，他希望透過發起信任投票觸發提前大選，尋求連任。</p>

<p>目前，各主要政黨已推出總理候選人，民調顯示，基督教民主聯盟的支持率排第一。由於各黨票源分散，未來可能需要聯合組閣，但組閣方案仍不明朗，政局充滿不確定。</p>

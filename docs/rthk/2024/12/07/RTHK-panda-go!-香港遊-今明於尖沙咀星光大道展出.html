    <p class="post-meta">

      </time></p>

  <div class="post-content e-content" itemprop="articleBody">
    <p>大型熊貓主題展覽「PANDA GO! 香港遊」的2500隻大熊貓雕塑，今、明兩天在尖沙咀星光大道展出。</p>

<p>有不少市民到場觀賞，並影相「打卡」。由真人扮的「熊貓導遊 」中午12時和下午5時半在金像獎女神像對出的空地現身，與在場市民見面。</p>

<p>2500隻大熊貓雕塑會在之後的周六、日和聖誕節期假，先後於昂坪360、海洋公園及中山紀念公園舉行公眾展覽。</p>

    <p class="post-meta">

  <div class="post-content e-content" itemprop="articleBody">
    <p>新任文化體育及旅遊局局長羅淑佩說，最迫切是做好啟德體育園籌備工作，確保順利啟用；又會貫徹落實香港「無處不旅遊」。</p>

<p>新任運輸及物流局局長陳美寶說，未來工作會更主動拓展航空網絡；至於多間巴士公司申請加價，她會嚴謹把關。</p>

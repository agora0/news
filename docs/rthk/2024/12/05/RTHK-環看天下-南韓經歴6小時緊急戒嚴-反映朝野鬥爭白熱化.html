  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">《環看天下》：南韓經歴6小時緊急戒嚴　反映朝野鬥爭白熱化</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-12-05T07:44:48+08:00" itemprop="datePublished">Dec 5, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>南韓總統尹錫悅一度頒布實施的緊急戒嚴令，歷時6小時後解除。</p>

<p>這次是當地自1987年議會實行民主制度以來的首次戒嚴。尹錫悅在宣布解除戒嚴的講話中，要求國會立刻停止以彈劾、立法、預算為手段使國家系統陷入癱瘓的行為。</p>

<p>尹錫悅政府自前年執政以來，在國會受到在野黨不斷針對。分析相信，近期一連串鬥爭更成為當局宣布戒嚴的導火線，亦反映雙方關係進一步撕裂。</p>

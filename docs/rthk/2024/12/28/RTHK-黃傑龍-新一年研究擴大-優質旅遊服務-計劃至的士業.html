  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">黃傑龍：新一年研究擴大「優質旅遊服務」計劃至的士業</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-12-28T12:24:56+08:00" itemprop="datePublished">Dec 28, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>優質旅遊服務協會主席、本身經營餐飲集團的黃傑龍表示，剛過去的聖誕假期，留港市民願意消費，加上深圳恢復「一簽多行」，令市面熱鬧，估計餐飲業生意額按月上升一至兩成，但按年就下跌約一成。</p>

<p>黃傑龍又說，新一年會研究擴大「優質旅遊服務」計劃至的士業，並鼓勵飲食業界做好伊斯蘭飲食，以拓展中東及伊斯蘭客源市場。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">的士於窩打老道及聯合道交界剷上安全島　一名途人及司機受傷</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-12-04T15:50:08+08:00" itemprop="datePublished">Dec 4, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>九龍塘有的士剷上安全島，一名途人和司機受傷送院。</p>

<p>警方12時許接報，一輛的士在窩打老道及聯合道交界懷疑失控，撞上鐵欄，然後剷上安全島，最後撞到花槽後停下。一名男途人懷疑走避不及被撞到，身體多處受傷，涉事的士司機報稱心口痛，二人送往伊利沙伯醫院治理。</p>

<p>警方暫時將案件列作交通意外有人受傷及政府財物損毀處理。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">伊朗稱敘利亞政府若要求派遣軍隊會考慮請求</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-12-04T00:45:16+08:00" itemprop="datePublished">Dec 4, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>伊朗外長阿拉格齊表示，如果敘利亞政府要求伊朗向敘利亞派遣軍隊，伊朗會考慮這一項請求。</p>

<p>阿拉格齊早前曾到訪敘利亞大馬士革，與總統巴沙爾會面。阿拉格齊表示，伊朗堅定地與敘利亞一起打擊恐怖主義，並向敘利亞政府提供各種支持。伊朗其後表示，應敘利亞政府要求，伊朗軍事顧問將繼續留在敘利亞。</p>

<p>由於敘利亞反政府武裝和極端組織的攻勢，政府軍在重鎮阿勒頗大部分地區已經失守。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">政府資助約6億元鼓勵巴士和的士業界使用電動車型</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-12-10T22:13:23+08:00" itemprop="datePublished">Dec 10, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>政府公布《公共巴士和的士綠色轉型路線圖》，包括推出資助計劃鼓勵業界使用電動車型，涉及約6億元資助，另外目標2027年底為電動的士增設至少500個高速充電樁。</p>

<p>當局強調，考慮到相關成本較高，過程要循序漸進，亦避免將成本轉嫁予乘客，現階段不會強制綠色轉型。</p>

<p>城巴歡迎政府有關公布，並將購入200輛電能巴士；九巴表示，未來購買新車時會積極考慮引入電動巴士。</p>

    <h1 class="post-title p-name" itemprop="name headline">《環看天下》：敘利亞政局變天　外界料當地局勢持續不穩</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-12-10T09:15:40+08:00" itemprop="datePublished">Dec 10, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>敘利亞政局變天，前總統巴沙爾政府日前被反對派武裝「閃電式」推翻。巴沙爾已經逃亡到俄羅斯，並得到莫斯科提供庇護。</p>

<p>對抗巴沙爾政權的敘利亞內戰，持續了超過13年。有分析相信，巴沙爾在短短兩星期內倒台，背後原因除了反對派成功運用科技，先發制人外，亦加上政府軍內部士氣低落，無力反擊，而國外的盟友亦同樣欠缺提供支援。外界不排除敘利亞局勢仍會持續不穩。</p>

    <p class="post-meta">
      <time class="dt-published" datetime="2024-12-11T18:22:54+08:00" itemprop="datePublished">Dec 11, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>匡智會轄下殘疾人士院舍早前發生懷疑職員性侵犯院友事件，但在事隔超過兩個月才公布。</p>

<p>有立法會議員促請政府制定準則，要在規定時間內公布。勞工及福利局局長孫玉菡表示，每宗事件都有獨特性，如要硬性劃線比較困難。</p>

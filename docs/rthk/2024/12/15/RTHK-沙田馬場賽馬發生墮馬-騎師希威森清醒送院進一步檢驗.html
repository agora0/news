    <h1 class="post-title p-name" itemprop="name headline">沙田馬場賽馬發生墮馬　騎師希威森清醒送院進一步檢驗</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-12-15T18:37:11+08:00" itemprop="datePublished">Dec 15, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>今日於沙田馬場舉行的第九場賽馬，發生墮馬，騎師希威森策騎馬匹「歡樂至寶」在入直路時被拋下。</p>

<p>在場當值醫護人員其後為希威森檢查及治理，期間傷者一直保持清醒，之後送院作進一步檢驗。</p>

<p>馬匹「歡樂至寶」其後安全返回馬房，並接受進一步檢查。</p>

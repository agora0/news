  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">陳美寶：檢視並完善啟德體育園交通配套　提供更到位交通服務</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-12-08T21:37:15+08:00" itemprop="datePublished">Dec 8, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>運輸及物流局局長陳美寶表示，今日啟德體育園再次舉行演練，參與人數增至12000人。她陪同政務司司長陳國基到園區附近的宋皇臺道特別巴士及的士上落客區視察。</p>

<p>陳美寶在局方社交專頁表示，她已指示各方全力配合，希望在提供運力之餘，亦可透過演練累積經驗，檢視並完善交通配套安排，以期在啟德體育園正式啟用時，可為旅客和市民提供更到位的交通服務。</p>

    <h1 class="post-title p-name" itemprop="name headline">西九晚上上演水上煙火　連接九龍站天橋6時半起實施單向人潮管理</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-12-26T18:01:15+08:00" itemprop="datePublished">Dec 26, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>旅發局晚上8時將在西九文化區對開舉行最後一場「冬日維港水上煙火」，連接九龍站與藝術廣場天橋將於下午6時半起實施單向人潮管理措施。藝術廣場天橋屆時只用作出口，可以經藝術廣場天橋離開西九。</p>

<p>前往藝術公園的人士可經港鐵九龍站E4及E5出口，按照現場指示沿博物館道進入藝術公園。</p>

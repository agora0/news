  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">澤連斯基斥俄於聖誕日襲烏不人道　拜登指示續對基輔供應武器</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-12-26T06:35:59+08:00" itemprop="datePublished">Dec 26, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>俄羅斯在聖誕日針對烏克蘭的能源設施發動大規模襲擊，造成至少一死六傷，多個州停電。</p>

<p>烏克蘭總統澤連斯基批評俄方襲擊不人道，美國總統拜登譴責襲擊，並已指示國防部繼續向烏克蘭提供武器。</p>

<p>俄羅斯就指，庫爾斯克州遭到烏軍襲擊，導致四死五傷。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">山頂纜車本月30日起調整票價　成人及小童來回108元和54元</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-12-13T12:23:19+08:00" itemprop="datePublished">Dec 13, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>山頂纜車表示，將統一所有日期的票價，有關調整將於本月30日生效。成人票價單程為76元，來回108元；小童及長者單程是38元，來回54元。</p>

<p>山頂纜車說，今次調整旨在減少乘客對目前動態定價結構的困惑，更容易計劃到訪行程，同時讓公司有更多空間進行促銷策略。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">警方追緝一名男子涉以虛假交易證明騙走30萬元手錶</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-12-13T09:53:37+08:00" itemprop="datePublished">Dec 13, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>警方正追緝一名男子，涉嫌在尖沙咀一間店舖以虛假交易證明，騙走一隻約值30萬元的手錶。</p>

<p>現場是中間道一間店舖，警方昨日下午接報，指一名男子聲稱購買手錶時，懷疑提供虛假交易證明，騙走一隻手錶。</p>

<p>涉案男子高約1.6米，案發時戴眼鏡和口罩，身穿黑色外套、白色長褲及黑色鞋，案件列作「以欺騙手段取得財產」處理。</p>

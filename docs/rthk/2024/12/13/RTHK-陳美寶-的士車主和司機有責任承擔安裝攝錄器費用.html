  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">陳美寶：的士車主和司機有責任承擔安裝攝錄器費用</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-12-13T18:33:02+08:00" itemprop="datePublished">Dec 13, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>政府計劃明年修例規定所有的士在車廂內安裝攝錄設備，目標於2026年內完成，政府表示的士安裝攝錄系統每輛成本大約是3500元至5300元不等，其後每月營運及保養費用等約為百多、二百元。</p>

<p>有議員建議為的士司機提供資助，加快推行進度，運輸及物流局局長陳美寶表示，措施對整個業界有利，車主和司機有責任承擔相關費用。</p>

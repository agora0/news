  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">保險投訴局明年起上調可裁決賠償限額　由120萬增至150萬元</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-12-30T13:14:47+08:00" itemprop="datePublished">Dec 30, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>保險投訴局公布，由明年1月1日起，將可裁決的賠償限額由120萬元上調至150萬元，意味著投訴局將可以處理索償/爭議金額高達150萬元的投訴個案。</p>

<p>投訴局主席陳黃穗表示，考慮到持續通脹以及投保人士，對更高保險保障的需求日益增加，決定把可裁決的賠償限額提高至150萬元，相信可以令更多投保人士受惠免費糾紛調解服務。</p>

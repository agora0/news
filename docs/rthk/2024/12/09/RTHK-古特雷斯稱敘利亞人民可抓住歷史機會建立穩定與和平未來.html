  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">古特雷斯稱敘利亞人民可抓住歷史機會建立穩定與和平未來</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-12-09T01:42:08+08:00" itemprop="datePublished">Dec 9, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>聯合國秘書長古特雷斯透過發言人就敘利亞局勢發表聲明，指經過14年的殘酷戰爭和獨裁政權下台，敘利亞人民可以抓住一個歷史性機會，建立一個穩定與和平的未來。</p>

<p>聲明強調，敘利亞的未來是由敘利亞人民決定，聯合國秘書長敘利亞問題特使裴凱儒，將會與他們合作。古特雷斯再次呼籲在這個敏感時刻保持冷靜，避免暴力，同時要保護所有敘利亞人的權利。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">立法會日本考察團返港　梁君彥：行程緊湊並非旅行</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-12-24T17:58:41+08:00" itemprop="datePublished">Dec 24, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>立法會主席梁君彥率領的代表團，結束為期四日的日本職務考察返港。他表示，代表團連日行程緊湊，包括就推動香港盡早加入《區域全面經濟伙伴關係協定》（RCEP）走訪日本國會，並就食物安全及日本水產進口問題，與當地的水產批發商會及相關政府部門交流等。</p>

<p>梁君彥又強調，今次考察並非旅行，開支預算方面是完全根據指引，並經過內會通過，最終亦沒有超出預算。</p>

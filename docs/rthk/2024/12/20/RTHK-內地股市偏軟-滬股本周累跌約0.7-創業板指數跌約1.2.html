    <h1 class="post-title p-name" itemprop="name headline">內地股市偏軟　滬股本周累跌約0.7%　創業板指數跌約1.2%</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-12-20T15:15:51+08:00" itemprop="datePublished">Dec 20, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>內地股市反覆偏軟。互聯網電商、半導體股造好，煤炭、鋼鐵、汽車、教育股受壓。</p>

<p>上證指數收報3368點，微跌1點。</p>

<p>深證成份指數報10646點，微跌2點。</p>

<p>創業板指數報2209點，跌3點，跌幅0.18%。</p>

<p>總結全星期，滬股累計跌約0.7%，深證成指跌逾0.6%，創業板指數跌約1.2%。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">烏克蘭稱從美國獲10億美元貸款　以俄國凍結資產所產生收益抵押</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-12-25T06:18:58+08:00" itemprop="datePublished">Dec 25, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>烏克蘭總理什梅加爾說，烏克蘭已從美國獲得10億美元貸款，這筆款項以俄羅斯被凍結資產所產生的收益，作為抵押。</p>

<p>什梅加爾指今次是七國集團發起、向烏克蘭提供500億美元貸款計劃框架下，烏方收到的首筆來自美國的款項。</p>

<p>俄羅斯外交部較早時發表聲明，譴責美國以俄羅斯被凍結資產所產生的收益，作為抵押向烏克蘭提供貸款，認為是盜竊行為。</p>

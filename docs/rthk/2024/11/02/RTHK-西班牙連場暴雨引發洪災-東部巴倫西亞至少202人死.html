    <h1 class="post-title p-name" itemprop="name headline">西班牙連場暴雨引發洪災　東部巴倫西亞至少202人死</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-11-02T04:30:28+08:00" itemprop="datePublished">Nov 2, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>西班牙連場暴雨引發洪災，東部地區巴倫西亞受災最嚴重，導致202人死亡。</p>

<p>另外，在卡斯蒂利亞-拉曼查有兩人死亡，安達盧西亞有1人死亡，近期連場暴雨引致西班牙全國至少205人死</p>

<p>500名士兵已被增派往災區，搜索失蹤者，以及協助災民。西班牙政府早前已派出上千名軍事應急部隊成員，前往災區。西班牙國防部說，將全力為災區提供支援。</p>

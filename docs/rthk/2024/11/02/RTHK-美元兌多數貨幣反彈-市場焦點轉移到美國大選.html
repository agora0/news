    <h1 class="post-title p-name" itemprop="name headline">美元兌多數貨幣反彈　市場焦點轉移到美國大選</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-11-02T06:12:51+08:00" itemprop="datePublished">Nov 2, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>美元在美國公布疲弱的就業數據後向上，市場焦點轉移到下周美國總統大選的不確定性。</p>

<p>美元兌多數貨幣反彈，美元指數報104.3，升幅0.4%。</p>

<p>歐元兌美元跌逾0.4%，報1.0834美元。英鎊兌美元升0.2%，報1.2926美元。</p>

<p>美元兌日圓升0.6%，報152.98日圓。</p>

<p>另外，美國10年期債息觸及約4個月新高，在4.38厘附近。</p>

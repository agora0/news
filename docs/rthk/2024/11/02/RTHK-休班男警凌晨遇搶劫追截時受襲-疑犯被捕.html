  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">休班男警凌晨遇搶劫追截時受襲　疑犯被捕</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-11-02T16:14:48+08:00" itemprop="datePublished">Nov 2, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>據了解，一名休班警員凌晨被搶劫，他追截疑兇時，懷疑被對方以刀襲擊，多處受傷，涉案人士已被捕。</p>

<p>消息指， 這名休班男警員在尖沙咀用膳後，沿彌敦道往旺角方向步行至南京街與彌敦道交界時，遭疑犯從後搶走錢包。休班男警嘗試追截，期間透露身份，被捕人以疑似水果刀攻擊，休班男警臂部、膝部及頸部等多處刀傷，疑兇逃去，並留下搶去的錢包。</p>

<p>休班男警事後送往伊利沙伯醫院治理。</p>

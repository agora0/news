  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">港協提出守則提及體育總會應訂定董事的最長任期和年期</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-11-20T22:43:24+08:00" itemprop="datePublished">Nov 20, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>港協暨奧委會公布屬會機構管治檢討結果及《機構管治守則》，提到體育總會應訂定董事的最長任期和年期，以及放寬運動員參與遴選或比賽的資格。</p>

<p>港協要求屬會用兩年時間，即2026年底或之前落實執行《守則》，如不達標，將不獲發確認證書，可能會影響獲取康文署資助。多個屬會支持報告。</p>

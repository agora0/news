  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">兒童社區疫苗接種中心及私家診所新冠疫苗接種站暫停服務</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-11-14T07:48:42+08:00" itemprop="datePublished">Nov 14, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>政府宣布，由於八號熱帶氣旋警告信號現正生效，新冠疫苗接種計劃下的兒童社區疫苗接種中心，以及私家診所新冠疫苗接種站，將不會按照正常服務時間開放，疫苗接種服務亦會暫停。</p>

<p>接種中心及接種站會於警告信號除下兩小時後，重新開放及恢復接種服務直至正常開放時間結束。</p>

<p>受影響人士可於原定預約接種的時間後，透過接種計劃專題網站重新預約接種日期和時間。</p>

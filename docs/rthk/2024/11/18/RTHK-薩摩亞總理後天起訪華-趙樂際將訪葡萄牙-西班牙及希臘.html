  <div class="post-content e-content" itemprop="articleBody">
    <p>外交部宣布，應國務院總理李強邀請，太平洋島國薩摩亞總理菲婭梅後日起至本月28日，對中國進行正式訪問。</p>

<p>另外，全國人大常委會委員長趙樂際將會外訪。他是應葡萄牙議長阿吉亞爾布蘭科、西班牙眾議長阿門戈爾及希臘議長塔蘇拉斯的邀請，在本月21日至30日分別對葡萄牙、西班牙和希臘進行正式訪問。
　</p>

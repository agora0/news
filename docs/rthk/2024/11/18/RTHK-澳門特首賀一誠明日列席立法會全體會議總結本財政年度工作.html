    <h1 class="post-title p-name" itemprop="name headline">澳門特首賀一誠明日列席立法會全體會議總結本財政年度工作</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-11-18T17:29:42+08:00" itemprop="datePublished">Nov 18, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>澳門行政長官賀一誠將在明日列席立法會全體會議，總結本財政年度的政府工作，以及介紹明年度財政預算安排，之後賀一誠會在政府總部舉行記者會，回應傳媒提問。</p>

<p>根據政府之前提交給立法會的明年財政預算案，除了會維持明年的公共行政等必要開支，也有預留包括繼續發放居民現金分享、非強制央積金注資等民生福利開支，以及繼續減免近48億澳門元的各項稅費。</p>

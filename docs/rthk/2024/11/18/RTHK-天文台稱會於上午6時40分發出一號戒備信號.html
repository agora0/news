  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">天文台稱會於上午6時40分發出一號戒備信號</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-11-18T05:39:49+08:00" itemprop="datePublished">Nov 18, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>天文台表示會在早上6時40分，發出一號戒備信號。</p>

<p>天文台說過去幾個小時，熱帶氣旋萬宜穩定向西北偏西方向移動，進入南海，按照現時預測，萬宜會逐漸減弱，但隨著萬宜靠近廣東沿岸，及與東北季候風的共同影響下，明日該區風勢頗大。</p>

<p>至於是否需要在今晚至明日初時，發出更高熱帶氣旋警告信號，天文台說需視乎萬宜與珠江口的距離、其強度轉變以及本地的風力變化。</p>

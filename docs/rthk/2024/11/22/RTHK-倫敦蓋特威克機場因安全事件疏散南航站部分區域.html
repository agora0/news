  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">倫敦蓋特威克機場因安全事件疏散南航站部分區域</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-11-22T20:00:34+08:00" itemprop="datePublished">Nov 22, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>英國第二繁忙的倫敦蓋特威克機場表示，基於安全事件，為預防起見，疏散南客運大樓部分區域，並禁止乘客進入。</p>

<p>警方證實，在行李中發現可疑物品，爆炸品處理小組正在現場。</p>

<p>而在較早時，英國警方在倫敦南部的美國大使館附近，發現可疑包裹，並進行受控引爆，當局正調查事件。</p>

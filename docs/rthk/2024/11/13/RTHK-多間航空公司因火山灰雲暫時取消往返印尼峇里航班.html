  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">多間航空公司因火山灰雲暫時取消往返印尼峇里航班</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-11-13T17:13:53+08:00" itemprop="datePublished">Nov 13, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>多間航空公司因應印尼旅遊勝地峇里附近的火山爆發，連日來噴出的危險的火山灰雲，決定暫時取消往返當地的航班。</p>

<p>澳洲航空、捷星航空、維珍澳洲航空向乘客通報航班中斷的情況，指勒沃托比拉基拉基火山噴出的火山灰，導致飛行不安全。</p>

<p>火山在過去的周末爆發，最少10人死亡，至今噴出9公里長的火山灰柱。澳洲氣象部門發布預警，指火山灰可能飄到北部部分地區。</p>

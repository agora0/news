  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">盧寵茂率團赴東莞出席大灣區中醫藥傳承創新發展大會</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-11-13T12:11:19+08:00" itemprop="datePublished">Nov 13, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>醫務衞生局局長盧寵茂今日率領代表團前往東莞，出席第六屆粵港澳大灣區中醫藥傳承創新發展大會，推動粵港澳大灣區中醫藥高地建設、交流和合作。</p>

<p>盧寵茂將於明早舉行的開幕式致辭，並見證醫衞局與廣東省中醫藥局簽署《粵港中醫藥人才培養合作框架協議》及多項粵港澳大灣區中醫藥合作項目的文本交換儀式。</p>

<p>盧寵茂明日中午返港。</p>

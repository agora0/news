  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">海南艦停泊招商局碼頭　民航處設立臨時限制飛行區</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-11-23T22:32:08+08:00" itemprop="datePublished">Nov 23, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>警方表示，解放軍海軍兩棲攻擊艦「海南艦」以及導彈驅逐艦「長沙艦」組成的隊伍自11月21日開始訪港五日，訪港期間，海南艦停泊在西環招商局碼頭，而長沙艦則停靠昂船洲軍港碼頭。民航處已在西環招商局碼頭一帶設立「臨時限制飛行區」。</p>

<p>警方提醒市民，任何人如在未獲授權下於解放軍軍艦附近一帶放飛小型無人機，即屬違法，最高可被判罰款10萬元及監禁2年。</p>

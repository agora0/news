    <h1 class="post-title p-name" itemprop="name headline">友愛邨謀殺案3男被控謀殺提堂　押後至明年3月再訊</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-11-12T16:53:55+08:00" itemprop="datePublished">Nov 12, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>屯門友愛邨友愛街市外日前發生命案，一名34歲男子死亡，案中3名男子被控謀殺罪，在屯門裁判法院提堂。裁判官將案押後至明年3月18日再訊，以待警方調查及檢取閉路電視片段，期間3名被告需要還押。</p>

<p>3名被告由58至63歲，被控在本月10日，在屯門友愛邨友愛街市開，與另一名男子謀殺案中的男事主。</p>

    <h1 class="post-title p-name" itemprop="name headline">港股低開58點　快手績後跌逾5%</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-11-21T09:26:20+08:00" itemprop="datePublished">Nov 21, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>港股偏軟，恒生指數競價時段報19646點，跌58點，跌幅0.3%。</p>

<p>科技指數報4393點，跌20點，跌幅0.45%。</p>

<p>快手上季盈利升50%，經調整盈利升24%，都好過預期，但股價低開逾5%，失守50元關口，報49.75元。</p>

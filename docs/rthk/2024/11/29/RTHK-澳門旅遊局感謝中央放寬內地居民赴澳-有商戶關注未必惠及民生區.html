  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">澳門旅遊局感謝中央放寬內地居民赴澳　有商戶關注未必惠及民生區</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-11-29T18:22:19+08:00" itemprop="datePublished">Nov 29, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>國務院同時亦放寬內地居民赴澳門旅遊政策，由明年1月1日起，珠海居民可以「一周一行」到訪澳門，橫琴深合區居民更可以「一簽多行」。</p>

<p>澳門旅遊局感謝中央新措施，相信有利進一步鞏固內地客源市場。當地工商界計劃組織商戶辦市集及申請接駁巴士，方便旅客穿梭景區及各城區。有商戶歡迎安排，亦有商戶關注未必惠及民生區。</p>

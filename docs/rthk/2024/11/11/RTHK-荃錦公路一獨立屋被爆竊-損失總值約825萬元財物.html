    <h1 class="post-title p-name" itemprop="name headline">荃錦公路一獨立屋被爆竊　損失總值約825萬元財物</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-11-11T02:37:44+08:00" itemprop="datePublished">Nov 11, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>荃灣荃錦公路99號一間獨立屋被爆竊，損失總值約825萬元財物。</p>

<p>警方在昨晚7時許接獲39歲女戶主報案，指發現住所有搜掠痕跡，懷疑被爆竊。人員接報到場，經初步點算，相信上址有七個手袋、十隻手錶及一些珠寶不見了。案件列作爆竊，交由荃灣警區刑事調查隊跟進，暫時未有人被捕。</p>

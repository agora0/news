    <h1 class="post-title p-name" itemprop="name headline">機場三跑本月28日啟用　黃偉綸：有助本港成更強大國際航空樞紐</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-11-05T12:26:54+08:00" itemprop="datePublished">Nov 5, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>香港機場三跑系統將於本月28日啟用。</p>

<p>署理財政司司長黃偉綸表示，預料三跑每年可以處理1億2千萬名旅客及1000萬噸貨物，帶來的利益非常可觀，有助本港成為更強大的國際航空樞紐。</p>

<p>機管局表示，目標在本個月28日啟用三跑系統，又會因應客運設施與業務夥伴展開籌備工作，明年底起，分階段啟用擴建後的二號客運大樓。</p>

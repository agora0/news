    <h1 class="post-title p-name" itemprop="name headline">港鐵「長者日」11月17日　持樂悠咭免費搭港鐵輕鐵及港鐵巴士</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-11-05T17:16:43+08:00" itemprop="datePublished">Nov 5, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>港鐵表示，今年的「長者日」定於本月17日舉辦，65歲或以上的長者當天使用樂悠咭、長者八達通或個人八達通均可免費乘搭港鐵 、輕鐵及港鐵巴士。相關優惠不適用於機場快綫、東鐵綫往來羅湖及落馬洲站的過境車程及高鐵。</p>

<p>合資格人士當天使用樂悠咭、長者八達通或其個人八達通進出港鐵站、輕鐵站或登上港鐵巴士，其樂悠咭或八達通將不會被扣除車費。</p>

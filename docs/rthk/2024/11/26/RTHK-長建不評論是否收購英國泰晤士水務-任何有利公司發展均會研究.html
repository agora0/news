  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">長建不評論是否收購英國泰晤士水務　任何有利公司發展均會研究</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-11-26T12:11:57+08:00" itemprop="datePublished">Nov 26, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>有報道指，長江集團有興趣收購英國泰晤士水務。長江基建發言人表示，不評論有關報道，又指一直以來對任何有利公司發展及增進股東回報的機會，均會作出研究。</p>

<p>發言人引用長建中期業績報告提及，集團財務根基持續穩健雄厚，至6月底持有現金92億港元，淨負債比率處於9.8%的健康水平，為集團提供財務靈活性，以應對市場各種不明朗因素，並為新收購機遇提供支持。</p>

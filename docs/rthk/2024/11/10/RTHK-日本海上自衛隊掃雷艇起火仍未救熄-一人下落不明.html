    <h1 class="post-title p-name" itemprop="name headline">日本海上自衛隊掃雷艇起火仍未救熄　一人下落不明</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-11-10T22:51:19+08:00" itemprop="datePublished">Nov 10, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>日本海上自衛隊一艘掃雷艇在福岡縣宗像市附近海域起火，火勢仍未救熄，一名船員吸入煙霧住院，仍有一人下落不明。</p>

<p>事發在當地早上9時許，掃雷艇的引擎室在航行期間起火，並傳出爆炸聲。海上自衛隊幕僚長齋藤聰說，滅火工作仍然繼續，如果火勢持續，掃雷艇可能沉沒，除了失蹤人員外，船上其餘人員已經撤離至另一艘船。</p>

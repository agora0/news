ty=80" alt="" fetchpriority="low"/><figcaption id="caption-attachment-1164516">塞内加尔的萨迪奥·马内（左）在世界杯B组预选赛对阵毛里塔尼亚的比赛中攻入本队首个进球后，与队友一同庆祝 [美联社]</figcaption></figure><figure id="attachment_1164514" aria-describedby="caption-attachment-1164514"><img data-recalc-dims="1" loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/10/AP25287764529284-1760484739-1760509122.webp?w=770&amp;resize=770%2C513&amp;quality=80" alt="" fetchpriority="low"/><figcaption id="caption-attachment-1164514">塞内加尔球迷在达喀尔阿卜杜拉耶·瓦德体育场举行的世界杯B组预选赛对阵毛里塔尼亚的比赛中欢呼 [美联社]</figcaption></figure><figure id="attachment_1164512" aria-describedby="caption-attachment-1164512"><img data-recalc-dims="1" loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/10/AP25287765816126-1760484765-1760509117.webp?w=770&amp;resize=770%2C513&amp;quality=80" alt="" fetchpriority="low"/><figcaption id="caption-attachment-1164512">一名塞内加尔球迷提供了明年国际足联世界杯上将展示的一种景象 [美联社]</figcaption></figure></div><div>来源: <!-- -->半岛电视台＋通讯社</div>

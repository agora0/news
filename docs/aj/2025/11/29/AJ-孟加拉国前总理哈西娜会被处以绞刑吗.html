<meta property="og:locale" content="en_US" />
<meta name="description" content="“历史图解”系列文章运用人工智能生成的图表，将新闻事件和时事置于历史背景中进行解读。 &lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;要形容这位声名狼藉的孟加拉国前领导人谢赫·哈西娜，至少可以说她是个复杂的人物。她曾是民主倡导者，经济发展的推动者，后来却摇身一变，成为被指控犯有巨额腐败的独裁者。如今她已被判处死刑，有些人甚至希望看到哈西娜被绞死。&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt; 广告 &lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;哈西娜于 1947 年出生于当时的东巴基斯坦，她是谢赫·穆吉布·拉赫曼的女儿，谢赫·穆吉布·拉赫曼领导了孟加拉国在 1971 年反对巴基斯坦的独立战争。&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;1990 年，哈西娜与她的竞争对手、孟加拉国民族主义党（BNP）的卡莉达·齐亚联手，领导了一场推翻军人统治者侯赛因·穆罕默德·艾尔沙德的民众起义。&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;哈西娜于1996年代表人民联盟党出任总理，后于2001年败给齐亚。她于2008年再次当选。2014年，在主要反对党抵制的选举中，她再次获胜。2018年，尽管面临舞弊指控，她依然赢得大选。同年，齐亚因腐败罪入狱。（2025年1月，在哈西娜被迫下台后，齐亚被判无罪。）&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;自 2009 年以来，在哈西娜的领导下，经济平均每年增长 6% 以上，服装业是支柱产业。&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;但她的任期因被指控利用包括快速行动营（RAB）在内的安全部队绑架和杀害反对派成员及异见人士而蒙上阴影。2021年，美国对快速行动营实施制裁，指控其造成数百人失踪和法外处决。哈西娜否认参与其中。&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt; 广告 &lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;2024年7月，学生因政府工程项目而发起的抗议活动演变成一场暴动。联合国称，超过1400名抗议者丧生，其中大部分死于安全部队之手。&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;2024年8月5日，哈西娜辞职后乘坐军用直升机逃往印度。此后，她被缺席判处反人类罪，并被判处绞刑。孟加拉国临时政府于2024年12月要求印度引渡哈西娜，但至今未收到正式回复。2025年11月21日，孟加拉国再次提出引渡请求。哈西娜最终能否受到法律制裁，目前尚不得而知。&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;今天，孟加拉国临时领导人、诺贝尔经济学奖得主穆罕默德·尤努斯表示，在哈西娜执政期间，超过2300亿美元的政府资金不翼而飞。下一次大选预计将于2026年初举行，届时无论谁上台，都可能想要试探印度保护哈西娜安全的决心。&lt;/figcaption&gt;&lt;/div&gt;" />

  <div class="post-content e-content" itemprop="articleBody">
    <div aria-live="polite" aria-atomic="true"><p>“历史图解”系列文章运用人工智能生成的图表，将新闻事件和时事置于历史背景中进行解读。</p></div></div><div><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/11/1-1764384174.webp?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/11/1-1764384174.webp?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 2 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>要形容这位声名狼藉的孟加拉国前领导人谢赫·哈西娜，至少可以说她是个复杂的人物。她曾是民主倡导者，经济发展的推动者，后来却摇身一变，成为被指控犯有巨额腐败的独裁者。如今她已被判处死刑，有些人甚至希望看到哈西娜被绞死。</figcaption></div></figure><div><div><div><span> 广告 </span></div></div></div><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/11/3-1764384199.webp?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/11/3-1764384199.webp?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 3 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>哈西娜于 1947 年出生于当时的东巴基斯坦，她是谢赫·穆吉布·拉赫曼的女儿，谢赫·穆吉布·拉赫曼领导了孟加拉国在 1971 年反对巴基斯坦的独立战争。</figcaption></div></figure><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/11/4-1764384212.webp?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/11/4-1764384212.webp?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 4 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>1990 年，哈西娜与她的竞争对手、孟加拉国民族主义党（BNP）的卡莉达·齐亚联手，领导了一场推翻军人统治者侯赛因·穆罕默德·艾尔沙德的民众起义。</figcaption></div></figure><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/11/5-1764384224.webp?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/11/5-1764384224.webp?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 5 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>哈西娜于1996年代表人民联盟党出任总理，后于2001年败给齐亚。她于2008年再次当选。2014年，在主要反对党抵制的选举中，她再次获胜。2018年，尽管面临舞弊指控，她依然赢得大选。同年，齐亚因腐败罪入狱。（2025年1月，在哈西娜被迫下台后，齐亚被判无罪。）</figcaption></div></figure><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/11/6-1764384237.webp?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/11/6-1764384237.webp?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 6 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>自 2009 年以来，在哈西娜的领导下，经济平均每年增长 6% 以上，服装业是支柱产业。</figcaption></div></figure><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/11/7-1764384251.webp?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/11/7-1764384251.webp?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 7 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>但她的任期因被指控利用包括快速行动营（RAB）在内的安全部队绑架和杀害反对派成员及异见人士而蒙上阴影。2021年，美国对快速行动营实施制裁，指控其造成数百人失踪和法外处决。哈西娜否认参与其中。</figcaption></div></figure><div><div><div><span> 广告 </span></div></div></div><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/11/8-1764384267.webp?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/11/8-1764384267.webp?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 8 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>2024年7月，学生因政府工程项目而发起的抗议活动演变成一场暴动。联合国称，超过1400名抗议者丧生，其中大部分死于安全部队之手。</figcaption></div></figure><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/11/9-1764384280.webp?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/11/9-1764384280.webp?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 9 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>2024年8月5日，哈西娜辞职后乘坐军用直升机逃往印度。此后，她被缺席判处反人类罪，并被判处绞刑。孟加拉国临时政府于2024年12月要求印度引渡哈西娜，但至今未收到正式回复。2025年11月21日，孟加拉国再次提出引渡请求。哈西娜最终能否受到法律制裁，目前尚不得而知。</figcaption></div></figure><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/11/10-1764384302.webp?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/11/10-1764384302.webp?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 10 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>今天，孟加拉国临时领导人、诺贝尔经济学奖得主穆罕默德·尤努斯表示，在哈西娜执政期间，超过2300亿美元的政府资金不翼而飞。下一次大选预计将于2026年初举行，届时无论谁上台，都可能想要试探印度保护哈西娜安全的决心。</figcaption></div></figure>

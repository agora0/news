<meta name="description" content="从菲律宾社区与气候变化引发的流离失所和毁灭性洪水作斗争，到加沙巴勒斯坦人庄严肃穆的集体葬礼，再到巴西作为第30届联合国气候大会（COP30）主办国期间发生的示威游行——以下图片回顾了在本周发生的主要事件。 &lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;根据停火协议，从以色列收回的身份不明的巴勒斯坦人的遗体被埋葬在加沙地带的代尔巴拉赫（美联社）&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt; 广告 &lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;伊朗妇女聚集在德黑兰的萨利赫圣陵祈雨，而该国正面临严重的缺水问题。该国首都官员警告称，由于这场“数十年来最为严重的干旱”，可能会出现间歇性断水的情况（法国媒体）&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;参与者在墨西哥韦拉克鲁斯州科斯科马特佩克·德·布拉沃举行的全国面具舞节上展示他们的服装（法国媒体）&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;在海地小戈阿夫，飓风“梅丽莎”引发山体滑坡，遇难者罗西克莱尔·伦奇斯的亲属在其葬礼上悲痛欲绝（美联社）&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;航拍照片显示，在马尼拉以北卡加延省图格加劳市，由于超强台风“凤凰”带来的暴雨导致河水决堤、房屋被洪水淹没（法国媒体）&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;逃离法希尔的苏丹难民穿过位于苏丹北部达巴镇的阿法德难民营的帐篷路。苏丹军队与准军事组织快速支援部队之间的冲突始于2023年4月，并已造成数万人死亡，近1200万人流离失所。在上个月，快速支援部队攻占了法希尔，从而结束了对这座位于苏丹西部达尔富尔地区的战略要地持续18个月的残酷围困。需要指出的是，这场战役充斥着有据可查的大规模屠杀和性暴力（法国媒体）&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt; 广告 &lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;在墨西哥城青年领导的反政府示威活动中，抗议者与警察发生冲突（美联社）&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;今年50岁的科西姆·乌丁在布拉马普特拉河一座岛屿上拍照，他凝视着自己家园曾经所在的空地。由于侵蚀，他之前的住所已被吞噬，他也在最近搬到了位于孟加拉国库里格拉姆的这个地方 （路透社）&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;一名医护人员在牙买加法尔茅斯的西班牙野战医院陪同一名患者。该医院已开始接收首批患者，其中包括一名新生儿，旨在为遭受飓风“梅丽莎”重创的牙买加医疗服务提供关键支持（法国媒体）&lt;/figcaption&gt;&lt;/div&gt;" />

  <div class="post-content e-content" itemprop="articleBody">
    <div aria-live="polite" aria-atomic="true"><p>从菲律宾社区与气候变化引发的流离失所和毁灭性洪水作斗争，到加沙巴勒斯坦人庄严肃穆的集体葬礼，再到巴西作为第30届联合国气候大会（COP30）主办国期间发生的示威游行——以下图片回顾了在本周发生的主要事件。</p></div></div><div><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/11/AP25318482638419-1763274438-1763284837.webp?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/11/AP25318482638419-1763274438-1763284837.webp?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 2 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>根据停火协议，从以色列收回的身份不明的巴勒斯坦人的遗体被埋葬在加沙地带的代尔巴拉赫（美联社）</figcaption></div></figure><div><div><div><span> 广告 </span></div></div></div><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/11/AFP__20251114__842R472__v3__HighRes__TopshotIranReligionWaterDrought-1763274403-1763284875.webp?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/11/AFP__20251114__842R472__v3__HighRes__TopshotIranReligionWaterDrought-1763274403-1763284875.webp?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 3 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>伊朗妇女聚集在德黑兰的萨利赫圣陵祈雨，而该国正面临严重的缺水问题。该国首都官员警告称，由于这场“数十年来最为严重的干旱”，可能会出现间歇性断水的情况（法国媒体）</figcaption></div></figure><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/11/AFP__20251115__844H39Q__v2__HighRes__TopshotMexicoCultureTraditionMasks-1763274411-1763284937.webp?fit=770%2C514&amp;quality=80" srcSet="/wp-content/uploads/2025/11/AFP__20251115__844H39Q__v2__HighRes__TopshotMexicoCultureTraditionMasks-1763274411-1763284937.webp?fit=770%2C514&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 4 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>参与者在墨西哥韦拉克鲁斯州科斯科马特佩克·德·布拉沃举行的全国面具舞节上展示他们的服装（法国媒体）</figcaption></div></figure><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/11/AP25319711725743-1763274456-1763284980.webp?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/11/AP25319711725743-1763274456-1763284980.webp?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 5 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>在海地小戈阿夫，飓风“梅丽莎”引发山体滑坡，遇难者罗西克莱尔·伦奇斯的亲属在其葬礼上悲痛欲绝（美联社）</figcaption></div></figure><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/11/AFP__20251110__83JX8KF__v2__HighRes__TopshotPhilippinesWeatherTyphoon-1763274391-1763285023.webp?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/11/AFP__20251110__83JX8KF__v2__HighRes__TopshotPhilippinesWeatherTyphoon-1763274391-1763285023.webp?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 6 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>航拍照片显示，在马尼拉以北卡加延省图格加劳市，由于超强台风“凤凰”带来的暴雨导致河水决堤、房屋被洪水淹没（法国媒体）</figcaption></div></figure><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/11/AFP__20251115__846K8YV__v2__HighRes__TopshotSudanConflictDisplaced-1763274420-1763285129.webp?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/11/AFP__20251115__846K8YV__v2__HighRes__TopshotSudanConflictDisplaced-1763274420-1763285129.webp?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 7 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>逃离法希尔的苏丹难民穿过位于苏丹北部达巴镇的阿法德难民营的帐篷路。苏丹军队与准军事组织快速支援部队之间的冲突始于2023年4月，并已造成数万人死亡，近1200万人流离失所。在上个月，快速支援部队攻占了法希尔，从而结束了对这座位于苏丹西部达尔富尔地区的战略要地持续18个月的残酷围困。需要指出的是，这场战役充斥着有据可查的大规模屠杀和性暴力（法国媒体）</figcaption></div></figure><div><div><div><span> 广告 </span></div></div></div><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/11/AP25319749061388-1763274476-1763285194.webp?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/11/AP25319749061388-1763274476-1763285194.webp?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 8 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>在墨西哥城青年领导的反政府示威活动中，抗议者与警察发生冲突（美联社）</figcaption></div></figure><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/11/2025-11-10T010608Z_117201428_RC2HLHARYAFI_RTRMADP_3_CLIMATE-COP30-BANGLADESH-1763274345-1763285233.webp?fit=770%2C514&amp;quality=80" srcSet="/wp-content/uploads/2025/11/2025-11-10T010608Z_117201428_RC2HLHARYAFI_RTRMADP_3_CLIMATE-COP30-BANGLADESH-1763274345-1763285233.webp?fit=770%2C514&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 9 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>今年50岁的科西姆·乌丁在布拉马普特拉河一座岛屿上拍照，他凝视着自己家园曾经所在的空地。由于侵蚀，他之前的住所已被吞噬，他也在最近搬到了位于孟加拉国库里格拉姆的这个地方 （路透社）</figcaption></div></figure><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/11/13504726-1763274374-1763285316.webp?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/11/13504726-1763274374-1763285316.webp?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 10 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>一名医护人员在牙买加法尔茅斯的西班牙野战医院陪同一名患者。该医院已开始接收首批患者，其中包括一名新生儿，旨在为遭受飓风“梅丽莎”重创的牙买加医疗服务提供关键支持（法国媒体）</figcaption></div></figure>

<meta name="description" content="从俄乌互相发动更多空袭，到孟加拉国一架战斗机坠毁导致数十人遇难，以下是本周图片回顾。 &lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;朝鲜青年和学生在平壤金日成广场参加晚间庆典并载歌载舞，伴随烟花表演，庆祝朝鲜战争停战72周年。[摄影：Cha Song Ho / 美联社]&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt; 广告 &lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;一名消防员在希腊雅典西北郊区克里奥内里试图扑灭野火，一架直升机在空中飞过。起火原因尚不明确，目前已有145名消防员、44辆消防车、10架飞机和7架直升机参与灭火。[摄影：Yorgos Karahalis / 美联社]&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;在泰国与柬埔寨边境冲突进入第三天之际，流离失所的柬埔寨民众在奥多棉吉省的巴特考安置营领取饮用水。这场自周四爆发的战斗已造成至少34人死亡，超过168000人被迫撤离。[摄影：Anton L Delgado / 美联社]&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;娜伊玛·阿布·福勒（Naima Abu Ful）怀抱着她营养不良的两岁儿子亚赞（Yazan），坐在加沙市沙蒂难民营的家中。根据加沙卫生部的消息，由于以色列的封锁，医院又记录了5例新的饥饿致死病例，使自冲突爆发以来死于营养不良的人数上升至127人，其中包括85名儿童。[摄影：Jehad Alshrafi / 美联社]&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;孟加拉国达卡一所学校发生空军训练机坠毁事故后，消防部门和安全人员展开搜救行动。事故发生于7月21日，造成至少19人死亡、数十人受伤，成为该国数十年来最严重的航空灾难。[摄影：Jubair Bin Iqbal / 法新社]&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;一名女子带着她的狗离开乌克兰哈尔科夫一处遭俄军空袭的地点。[摄影：Sofiia Gatilova / 路透社]&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt; 广告 &lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;一名女子参加在玻利维亚埃尔阿尔托举行的第十五届国家骆驼科动物博览会中的“羊驼牧羊女王”选美比赛，该活动是该国建国200周年庆典的一部分。[摄影：Juan Karita / 美联社]&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;在叙利亚以德鲁兹人占多数的苏韦达市，德鲁兹战士、贝都因部落与政府军之间爆发致命冲突后，一辆被摧毁的坦克残骸留在现场。[摄影：Khalil Ashawi / 路透社]&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;2025年The Gallops赛事的参赛者在吉尔吉斯斯坦松库尔湖（Song-Kol Lake）附近展示骑术。该湖位于首都比什凯克东南约280公里（175英里）处的高山地带。[摄影：Vladimir Voronin / 美联社]&lt;/figcaption&gt;&lt;/div&gt;" />

  <div class="post-content e-content" itemprop="articleBody">
    <div aria-live="polite" aria-atomic="true"><p>从俄乌互相发动更多空袭，到孟加拉国一架战斗机坠毁导致数十人遇难，以下是本周图片回顾。</p>
</div></div><div><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/07/AP25208016925934-1753600217-1753609539.jpg?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/07/AP25208016925934-1753600217-1753609539.jpg?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 2 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>朝鲜青年和学生在平壤金日成广场参加晚间庆典并载歌载舞，伴随烟花表演，庆祝朝鲜战争停战72周年。[摄影：Cha Song Ho / 美联社]</figcaption></div></figure><div><div><div><span> 广告 </span></div></div></div><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/07/AP25207638221884-1753600198-1753609532.jpg?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/07/AP25207638221884-1753600198-1753609532.jpg?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 3 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>一名消防员在希腊雅典西北郊区克里奥内里试图扑灭野火，一架直升机在空中飞过。起火原因尚不明确，目前已有145名消防员、44辆消防车、10架飞机和7架直升机参与灭火。[摄影：Yorgos Karahalis / 美联社]</figcaption></div></figure><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/07/AP25207356779354-1753600177-1753609525.jpg?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/07/AP25207356779354-1753600177-1753609525.jpg?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 4 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>在泰国与柬埔寨边境冲突进入第三天之际，流离失所的柬埔寨民众在奥多棉吉省的巴特考安置营领取饮用水。这场自周四爆发的战斗已造成至少34人死亡，超过168000人被迫撤离。[摄影：Anton L Delgado / 美联社]</figcaption></div></figure><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/07/AP25205606436728-1753600138-1753609518.jpg?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/07/AP25205606436728-1753600138-1753609518.jpg?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 5 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>娜伊玛·阿布·福勒（Naima Abu Ful）怀抱着她营养不良的两岁儿子亚赞（Yazan），坐在加沙市沙蒂难民营的家中。根据加沙卫生部的消息，由于以色列的封锁，医院又记录了5例新的饥饿致死病例，使自冲突爆发以来死于营养不良的人数上升至127人，其中包括85名儿童。[摄影：Jehad Alshrafi / 美联社]</figcaption></div></figure><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/07/AFP__20250721__67DA2AQ__v4__HighRes__BangladeshAviationCrash-1753609497.jpg?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/07/AFP__20250721__67DA2AQ__v4__HighRes__BangladeshAviationCrash-1753609497.jpg?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 6 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>孟加拉国达卡一所学校发生空军训练机坠毁事故后，消防部门和安全人员展开搜救行动。事故发生于7月21日，造成至少19人死亡、数十人受伤，成为该国数十年来最严重的航空灾难。[摄影：Jubair Bin Iqbal / 法新社]</figcaption></div></figure><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/07/2025-07-24T105104Z_107190438_RC2XSFAANKPZ_RTRMADP_3_UKRAINE-1753609483.jpg?fit=770%2C542&amp;quality=80" srcSet="/wp-content/uploads/2025/07/2025-07-24T105104Z_107190438_RC2XSFAANKPZ_RTRMADP_3_UKRAINE-1753609483.jpg?fit=770%2C542&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 7 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>一名女子带着她的狗离开乌克兰哈尔科夫一处遭俄军空袭的地点。[摄影：Sofiia Gatilova / 路透社]</figcaption></div></figure><div><div><div><span> 广告 </span></div></div></div><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/07/AP25208023297960-1753600238-1753609545.jpg?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/07/AP25208023297960-1753600238-1753609545.jpg?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 8 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>一名女子参加在玻利维亚埃尔阿尔托举行的第十五届国家骆驼科动物博览会中的“羊驼牧羊女王”选美比赛，该活动是该国建国200周年庆典的一部分。[摄影：Juan Karita / 美联社]</figcaption></div></figure><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/07/2025-07-25T181601Z_1908110191_RC2STFA0PPAY_RTRMADP_3_SYRIA-S-1753609490.jpg?fit=770%2C433&amp;quality=80" srcSet="/wp-content/uploads/2025/07/2025-07-25T181601Z_1908110191_RC2STFA0PPAY_RTRMADP_3_SYRIA-S-1753609490.jpg?fit=770%2C433&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 9 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>在叙利亚以德鲁兹人占多数的苏韦达市，德鲁兹战士、贝都因部落与政府军之间爆发致命冲突后，一辆被摧毁的坦克残骸留在现场。[摄影：Khalil Ashawi / 路透社]</figcaption></div></figure><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/07/AP25204565447116-1753600116-1753609512.jpg?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/07/AP25204565447116-1753600116-1753609512.jpg?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 10 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>2025年The Gallops赛事的参赛者在吉尔吉斯斯坦松库尔湖（Song-Kol Lake）附近展示骑术。该湖位于首都比什凯克东南约280公里（175英里）处的高山地带。[摄影：Vladimir Voronin / 美联社]</figcaption></div></figure>

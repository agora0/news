<meta name="description" content="从以色列军队向寻求人道主义援助的巴勒斯坦人开火，到英格兰夺得2025年欧洲女子足球锦标赛冠军，以下是本周图片回顾。 &lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;一名男子抱着一只狗从阿根廷萨尔塔市一处正在燃烧的社区中奔逃 (美联社)&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt; 广告 &lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;纽约警察迪达鲁尔·伊斯拉姆（Didarul Islam）的灵柩运抵帕克切斯特贾米清真寺（Jame Masjid），此前他在纽约一起悲剧性枪击事件中遇难。此次致命事件发生在曼哈顿中城一栋办公大楼，造成包括伊斯拉姆本人、嫌疑枪手以及一位公司首席执行官在内的至少五人死亡。该大楼内设有多家大型金融机构，同时也是美国国家橄榄球联盟（NFL）的总部所在地 ( 美联社)&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;考古学家何塞·阿利亚加（Jose Aliaga）正在利马普恩特皮耶德拉区的一处遗址上检查古代昌凯文化的遗骸与文物。这些前印加时代的发现是加斯公司Calidda的市政工人在秘鲁首都郊区铺设天然气管线时意外挖掘出的（ 美联社）&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;英格兰球员利娅·威廉姆森（Leah Williamson）与基拉·沃尔什（Keira Walsh）在瑞士巴塞尔圣雅各布公园球场击败西班牙队夺冠后，高举2025年女子欧洲杯冠军奖杯（ 美联社）&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;士兵们在北京市郊密云区一条被洪水破坏的道路上行进，前往营救因强降雨而被困的村民。官方表示，中国北方的暴雨和洪灾已造成数十人死亡，其中包括30多名被困在北京郊区一处养老院的老人 （美联社）&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;救援人员在乌克兰基辅一栋遭俄罗斯导弹袭击后被摧毁的公寓楼废墟中搜寻。乌克兰官员表示，当晚俄罗斯对首都发动的大规模无人机和导弹袭击已造成至少18人死亡，其中包括一名6岁男孩，另有至少159人受伤（美联社）&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt; 广告 &lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;在菲律宾奎松市，抗议者在总统小费迪南德·马科斯发表国情咨文前，摧毁了他的肖像雕像（ 美联社）&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;在吉尔吉斯斯坦伊塞克湖南岸举行的 Salbuurun传统鹰猎节上，吉尔吉斯猎人骑马与金雕一同狩猎。该地点位于比什凯克东南约213公里处（ 美联社）&lt;/figcaption&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;/div&gt;&lt;figcaption&gt;人们坐在通往法国巴黎蒙马特圣心大教堂的台阶上。巴黎北部的蒙马特区每年吸引大约1100万游客，当地居民因《天使爱美丽》和《艾米丽在巴黎》等影视作品带来的“过度旅游”现象而表达担忧（欧洲通讯社）&lt;/figcaption&gt;&lt;/div&gt;" />

    <h1 class="post-title p-name" itemprop="name headline">一周图片精选：从俄罗斯导弹袭击基辅到中国洪灾</h1>

  <div class="post-content e-content" itemprop="articleBody">
    <div aria-live="polite" aria-atomic="true"><p>从以色列军队向寻求人道主义援助的巴勒斯坦人开火，到英格兰夺得2025年欧洲女子足球锦标赛冠军，以下是本周图片回顾。</p></div></div><div><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/08/AP25214027088022-1754202509-1754225328.jpg?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/08/AP25214027088022-1754202509-1754225328.jpg?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 2 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>一名男子抱着一只狗从阿根廷萨尔塔市一处正在燃烧的社区中奔逃 (美联社)</figcaption></div></figure><div><div><div><span> 广告 </span></div></div></div><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/08/AP25210781067454-1754202436-1754225296.jpg?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/08/AP25210781067454-1754202436-1754225296.jpg?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 3 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>纽约警察迪达鲁尔·伊斯拉姆（Didarul Islam）的灵柩运抵帕克切斯特贾米清真寺（Jame Masjid），此前他在纽约一起悲剧性枪击事件中遇难。此次致命事件发生在曼哈顿中城一栋办公大楼，造成包括伊斯拉姆本人、嫌疑枪手以及一位公司首席执行官在内的至少五人死亡。该大楼内设有多家大型金融机构，同时也是美国国家橄榄球联盟（NFL）的总部所在地 ( 美联社)</figcaption></div></figure><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/08/AP25212613379355-1754202469-1754225314.jpg?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/08/AP25212613379355-1754202469-1754225314.jpg?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 4 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>考古学家何塞·阿利亚加（Jose Aliaga）正在利马普恩特皮耶德拉区的一处遗址上检查古代昌凯文化的遗骸与文物。这些前印加时代的发现是加斯公司Calidda的市政工人在秘鲁首都郊区铺设天然气管线时意外挖掘出的（ 美联社）</figcaption></div></figure><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/08/AP25208696488725-1754202401-1754225279.jpg?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/08/AP25208696488725-1754202401-1754225279.jpg?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 5 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>英格兰球员利娅·威廉姆森（Leah Williamson）与基拉·沃尔什（Keira Walsh）在瑞士巴塞尔圣雅各布公园球场击败西班牙队夺冠后，高举2025年女子欧洲杯冠军奖杯（ 美联社）</figcaption></div></figure><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/08/AP25210265657852-1754202424-1754225291.jpg?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/08/AP25210265657852-1754202424-1754225291.jpg?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 6 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>士兵们在北京市郊密云区一条被洪水破坏的道路上行进，前往营救因强降雨而被困的村民。官方表示，中国北方的暴雨和洪灾已造成数十人死亡，其中包括30多名被困在北京郊区一处养老院的老人 （美联社）</figcaption></div></figure><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/08/AP25212171202312-1754202457-1754225302.jpg?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/08/AP25212171202312-1754202457-1754225302.jpg?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 7 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>救援人员在乌克兰基辅一栋遭俄罗斯导弹袭击后被摧毁的公寓楼废墟中搜寻。乌克兰官员表示，当晚俄罗斯对首都发动的大规模无人机和导弹袭击已造成至少18人死亡，其中包括一名6岁男孩，另有至少159人受伤（美联社）</figcaption></div></figure><div><div><div><span> 广告 </span></div></div></div><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/08/AP25209376620109-1754202410-1754225284.jpg?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/08/AP25209376620109-1754202410-1754225284.jpg?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 8 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>在菲律宾奎松市，抗议者在总统小费迪南德·马科斯发表国情咨文前，摧毁了他的肖像雕像（ 美联社）</figcaption></div></figure><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/08/AP25214510878462-1754202531-1754225334.jpg?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/08/AP25214510878462-1754202531-1754225334.jpg?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 9 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>在吉尔吉斯斯坦伊塞克湖南岸举行的 Salbuurun传统鹰猎节上，吉尔吉斯猎人骑马与金雕一同狩猎。该地点位于比什凯克东南约213公里处（ 美联社）</figcaption></div></figure><figure><div><div><img loading="lazy" src="https://chinese.aljazeera.net/wp-content/uploads/2025/08/13236965-1754204711-1754225271.jpg?fit=770%2C513&amp;quality=80" srcSet="/wp-content/uploads/2025/08/13236965-1754204711-1754225271.jpg?fit=770%2C513&amp;quality=80 770w" sizes="(max-width: 770px) 770px, 770px" alt="" tabindex="0" aria-label="Gallery image 10 of 10, 点击在图集视图中打开。, " role="button"/></div><figcaption>人们坐在通往法国巴黎蒙马特圣心大教堂的台阶上。巴黎北部的蒙马特区每年吸引大约1100万游客，当地居民因《天使爱美丽》和《艾米丽在巴黎》等影视作品带来的“过度旅游”现象而表达担忧（欧洲通讯社）</figcaption></div></figure>

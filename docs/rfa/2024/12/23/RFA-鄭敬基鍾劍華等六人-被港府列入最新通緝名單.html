         <p>港府保安局周二（24日）公布新一批懸紅一百萬元的通緝名單，包括前理大學者鍾劍華、藝人鄭敬基、前「學生動源」召集人鍾翰林、前新聞工作者何良懋、民主委員會成員劉珈汶及香港自由委員會基金會成員張晞晴。</p>

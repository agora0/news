  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">世嘉219万个顾客邮箱地址外泄</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-11-09T18:12:00+08:00" itemprop="datePublished">Nov 9, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <figure class="article-header-img-main">
    <img src="https://china-kyodo.ismcdn.jp/mwimgs/1/3/635m/img_133c1775189e862fd4d02ea5b7e729ec1050876.jpg" loading="eager" srcset="https://china-kyodo.ismcdn.jp/mwimgs/1/3/635m/img_133c1775189e862fd4d02ea5b7e729ec1050876.jpg 1x,https://china-kyodo.ismcdn.jp/mwimgs/1/3/1270m/img_133c1775189e862fd4d02ea5b7e729ec1050876.jpg 2x" width="635" "334" class="" alt="" referrerpolicy="no-referrer">
    <figcaption class="article-header-img-main__caption">图为游戏巨头世嘉的常设店“SEGA STORE OSAKA”。10月1日摄于大阪心斋桥。（共同社）</figcaption>
  </figure><div class="article-body__inner">
    <p>　　【共同社11月9日电】日本游戏巨头世嘉（SEGA）9日发布消息称，共有2,196,044个顾客电子邮箱地址发生外泄。原因是为其提供电子杂志发送服务的arara公司（东京）遭到非法访问。</p>

<p>　　世嘉表示，泄露的信息中不包含姓名、电话号码、信用卡信息、登录密码等。目前尚未确认到泄露的信息被恶意利用，但世嘉提醒用户对今后可能收到冒充该公司的可疑邮件等提高警惕。</p>

  </div>

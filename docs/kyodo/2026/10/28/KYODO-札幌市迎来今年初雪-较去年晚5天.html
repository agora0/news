  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">札幌市迎来今年初雪 较去年晚5天</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-10-28T09:18:00+08:00" itemprop="datePublished">Oct 28, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <figure class="article-header-img-main">
    <img src="https://china-kyodo.ismcdn.jp/mwimgs/a/4/635m/img_a45c0f00fac59089ef438a4b80fc9d841372122.jpg" loading="eager" srcset="https://china-kyodo.ismcdn.jp/mwimgs/a/4/635m/img_a45c0f00fac59089ef438a4b80fc9d841372122.jpg 1x,https://china-kyodo.ismcdn.jp/mwimgs/a/4/1270m/img_a45c0f00fac59089ef438a4b80fc9d841372122.jpg 2x" width="635" "431" class="" alt="" referrerpolicy="no-referrer">
    <figcaption class="article-header-img-main__caption">图为在迎来降雪的札幌市繁华街区薄野行走的人们。摄于10月28日上午。（图片不出售）（共同社）</figcaption>
  </figure><div class="article-body__inner">
    <p>　　【共同社10月28日电】札幌管区气象台28日宣布，札幌市观测到了今年初雪。这一日期与常年持平，比去年晚了5天。据悉，当地正有与12月上旬同等级别的寒潮来袭。函馆市、室兰市、钏路市等北海道各地也迎来了今年首场降雪。</p>

<p>　　稚内市和旭川市已于22日观测到初雪。</p>

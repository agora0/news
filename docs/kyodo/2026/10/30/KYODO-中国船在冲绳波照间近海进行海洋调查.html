  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">中国船在冲绳波照间近海进行海洋调查</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-10-30T18:42:43+08:00" itemprop="datePublished">Oct 30, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <figure class="article-header-img-main">
    <img src="https://china-kyodo.ismcdn.jp/mwimgs/2/4/635m/img_24417b6abb874681cddf69cedd0eb7ff67280.jpg" loading="eager" srcset="https://china-kyodo.ismcdn.jp/mwimgs/2/4/635m/img_24417b6abb874681cddf69cedd0eb7ff67280.jpg 1x,https://china-kyodo.ismcdn.jp/mwimgs/2/4/1270m/img_24417b6abb874681cddf69cedd0eb7ff67280.jpg 2x" width="635" "343" class="" alt="" referrerpolicy="no-referrer">
    <figcaption class="article-header-img-main__caption">图为在日本冲绳县波照间岛近海的专属经济区（EEZ）开展活动的中国海洋调查船“同济”号。摄于10月30日。第11管区海上保安总部供图。（图片不出售）（共同社）</figcaption>
  </figure><div class="article-body__inner">
    
<p>　　【共同社10月30日电】日本第11管区海上保安总部（那霸）发现30日上午9点40分左右，中国海洋调查船“同济”号在冲绳县波照间岛西南约141公里的专属经济区（EEZ）将类似线缆的物体伸入海中。海保巡逻船以未经日方同意不得进行海洋科学调查为由，通过无线电要求其停止活动。</p>
<p>　　自3月30日以来，日本EEZ内接连有中国船开展疑似海洋调查的异常活动。</p>

    <h1 class="post-title p-name" itemprop="name headline">乐天金鹰队11月将参加“桃园亚洲职棒交流赛”</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-10-13T14:47:00+08:00" itemprop="datePublished">Oct 13, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <figure class="article-header-img-main">
    <img src="https://china-kyodo.ismcdn.jp/mwimgs/f/3/635m/img_f3023ac8bdf9b2c10e8dbb2563e3478f702187.jpg" loading="eager" srcset="https://china-kyodo.ismcdn.jp/mwimgs/f/3/635m/img_f3023ac8bdf9b2c10e8dbb2563e3478f702187.jpg 1x,https://china-kyodo.ismcdn.jp/mwimgs/f/3/1270m/img_f3023ac8bdf9b2c10e8dbb2563e3478f702187.jpg 2x" width="635" "531" class="" alt="" referrerpolicy="no-referrer">
    <figcaption class="article-header-img-main__caption">日职棒东北乐天金鹰队主教练吉井正人在本赛季收官战结束后致辞。10月5日摄于球队主场。（共同社）</figcaption>
  </figure><div class="article-body__inner">
    <p>　　【共同社10月13日电】日职棒球队东北乐天金鹰队12日宣布，将参加11月7日、8日在台湾桃园市的乐天桃园棒球场举行的国际交流赛“2026桃园亚洲职棒交流赛”。该棒球场是乐天桃猿队的主场。</p>

<p>　　参加此次交流赛的共有3支球队，除金鹰队和桃猿队外，还有韩国的培证英雄队。金鹰队将于8日对阵桃猿队。7日桃猿队与培证英雄队交锋。</p>

  <div class="post-content e-content" itemprop="articleBody">
    <div>
                    <p>【共同社1月4日电】日本外务省4日就美国对委内瑞拉的军事行动发表外务发言人谈话称，日本政府正密切关注局势，同时致力于确保日侨安全，与相关国家紧密合作及开展信息收集工作等应对措施。据称，现阶段未收到日侨受害的报告。该谈话还强调，日本一直以来重视对国际法原则的尊重。（完）</p>

  <div class="post-content e-content" itemprop="articleBody">
    <figure class="article-header-img-main">
    <img src="" loading="eager" width="685" "" class="" alt="" referrerpolicy="no-referrer">
    
  </figure><div class="article-body__inner">
    
<p>　　【共同社6月29日电】日本富山县29日宣布，连接富山机场（富山市）与台湾台北的定期航班将于8月20日起复飞。台湾中华航空每周一和周四各执飞1个往返航班。该航班因新冠疫情蔓延自2020年2月底停飞至今。</p>
<p>　　富山县知事新田八朗在29日的记者会上表示：“非常欢迎。这是增进交流的第一步。”</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">简讯：日央行行长因病住院 将缺席货币政策会议</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-06-10T18:13:00+08:00" itemprop="datePublished">Jun 10, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <figure class="article-header-img-main">
    <img src="https://china-kyodo.ismcdn.jp/mwimgs/9/2/635m/img_92890d8d800f0c8c59c5aa88acc06442427034.jpg" loading="eager" srcset="https://china-kyodo.ismcdn.jp/mwimgs/9/2/635m/img_92890d8d800f0c8c59c5aa88acc06442427034.jpg 1x,https://china-kyodo.ismcdn.jp/mwimgs/9/2/1270m/img_92890d8d800f0c8c59c5aa88acc06442427034.jpg 2x" width="635" "485" class="" alt="" referrerpolicy="no-referrer">
    <figcaption class="article-header-img-main__caption">6月3日下午，日本央行行长植田和男在共同社“如月会”上发表演讲。摄于东京都千代田区。（共同社）</figcaption>
  </figure><div class="article-body__inner">
    <p>　　【共同社6月10日电】日本央行10日发布消息称，行长植田和男为治疗肝囊肿感染而住院，预计将缺席15、16两日召开的货币政策会议。据称植田将以书面形式提交意见，似乎会维持决定加息的方针。据悉住院时间为两周左右。</p>

<p>　　会议将由副行长冰见野良三代理主持，会后记者会则由副行长内田真一举行。</p>

<p>　　植田预计会出席7月30、31两日的货币政策会议。</p>

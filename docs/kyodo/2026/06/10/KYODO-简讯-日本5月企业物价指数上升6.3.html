  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">简讯：日本5月企业物价指数上升6.3%</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-06-10T08:14:00+08:00" itemprop="datePublished">Jun 10, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <figure class="article-header-img-main">
    <img src="https://china-kyodo.ismcdn.jp/mwimgs/5/a/635m/img_5a62f56a53468fe03b652c5867b8089c1629144.jpg" loading="eager" srcset="https://china-kyodo.ismcdn.jp/mwimgs/5/a/635m/img_5a62f56a53468fe03b652c5867b8089c1629144.jpg 1x,https://china-kyodo.ismcdn.jp/mwimgs/5/a/1270m/img_5a62f56a53468fe03b652c5867b8089c1629144.jpg 2x" width="635" "422" class="" alt="" referrerpolicy="no-referrer">
    <figcaption class="article-header-img-main__caption">图为日本央行总部。摄于2023年10月。（共同社）</figcaption>
  </figure><div class="article-body__inner">
    <p>　　【共同社6月10日电】日本央行10日公布的5月国内企业物价指数（2020年平均为100，初值）为134.5，较上年同期上升6.3%。升幅较4月的5.3%有所扩大。由于中东局势恶化致使原油价格高涨，石油相关产品价格上涨，带动指数走高。</p>

<p>　　企业物价指数反映企业间交易商品的价格水平，被视为反映家庭购买实物和服务价格动向的消费者物价的先行指标。</p>

  </div>

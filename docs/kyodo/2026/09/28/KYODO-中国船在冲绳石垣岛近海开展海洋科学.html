    <h1 class="post-title p-name" itemprop="name headline">中国船在冲绳石垣岛近海开展海洋科学</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-09-28T09:14:06+08:00" itemprop="datePublished">Sep 28, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <figure class="article-header-img-main">
    <img src="" loading="eager" width="685" "" class="" alt="" referrerpolicy="no-referrer">
    
  </figure><div class="article-body__inner">
    
<p>　　【共同社9月28日电】日本第11管区海上保安总部（那霸）发现27日下午12点10分左右，中国海洋调查船“科学”号在冲绳县石垣岛以北约72公里的日本专属经济区（EEZ）将类似线缆的物体伸入海中。海保巡逻船以未经日方同意不得开展海洋科学调查为由，通过无线电要求其停止活动。</p>
<p>　　自3月30日以来，日本EEZ内接连有中国船开展疑似海洋调查的活动。</p>

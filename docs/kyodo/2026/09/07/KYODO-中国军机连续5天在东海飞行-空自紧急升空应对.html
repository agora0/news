    <h1 class="post-title p-name" itemprop="name headline">中国军机连续5天在东海飞行 空自紧急升空应对</h1>

  <div class="post-content e-content" itemprop="articleBody">

    <img src="https://china-kyodo.ismcdn.jp/mwimgs/5/d/635m/img_5d647b4242d51c6eed9fd78f01ad9fb4245396.jpg" loading="eager" srcset="https://china-kyodo.ismcdn.jp/mwimgs/5/d/635m/img_5d647b4242d51c6eed9fd78f01ad9fb4245396.jpg 1x,https://china-kyodo.ismcdn.jp/mwimgs/5/d/1270m/img_5d647b4242d51c6eed9fd78f01ad9fb4245396.jpg 2x" width="635" "317" class="" alt="" referrerpolicy="no-referrer">

  </figure><div class="article-body__inner">
    
<p>　　【共同社9月7日电】日本防卫省统合幕僚监部7日透露，3至7日连续5天发现中国军方的Y-9情报收集机在长崎县男女群岛近海和冲绳本岛近海的东海上空飞行。航空自卫队战机连日紧急升空应对。防卫省正在持续警戒中方动向。</p>
<p>　　据防卫省介绍，该Y-9均为从中国大陆方向飞入东海，之后返回大陆方向，未侵犯日本领空。</p>

    <h1 class="post-title p-name" itemprop="name headline">涉嫌污损日本国宝台湾女子经纪人发声明道歉</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-08-25T09:36:00+08:00" itemprop="datePublished">Aug 25, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">

    </div>
  </div><div class="article-body__inner">
    <p>　　【共同社台南8月25日电】有关来自台湾自称从事主持人工作的蔡宜臻因涉嫌在日本奈良的药师寺向国宝“佛足石”泼洒液体被奈良警署逮捕一案，蔡宜臻的经纪人24日发表道歉声明，但表示不清楚细节。</p>

<p>　　经纪人在蔡宜臻的脸书（Facebook）上发布声明，表示对于此事造成的社会关注及相关困扰深感抱歉。据称由于蔡宜臻正在日本接受调查，无法与其本人取得联系。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">地震导致熊本县八代市地壳变动超过80厘米</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-07-29T04:01:00+08:00" itemprop="datePublished">Jul 29, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <figure class="article-header-img-main">
    <img src="https://china-kyodo.ismcdn.jp/mwimgs/b/0/635m/img_b08f00c134061c0310c62c1b646c296e781636.jpg" loading="eager" srcset="https://china-kyodo.ismcdn.jp/mwimgs/b/0/635m/img_b08f00c134061c0310c62c1b646c296e781636.jpg 1x,https://china-kyodo.ismcdn.jp/mwimgs/b/0/1270m/img_b08f00c134061c0310c62c1b646c296e781636.jpg 2x" width="635" "417" class="" alt="" referrerpolicy="no-referrer">
    <figcaption class="article-header-img-main__caption">图为因地震受损的九州高速公路。7月28日傍晚摄于熊本县八代市。（共同社）</figcaption>
  </figure><div class="article-body__inner">
    <p>　　【共同社7月29日电】关于28日发生的以熊本县为震源的地震，日本国土地理院（茨城县筑波市）当天发布消息称，分析震中周边的电子基准点数据后发现，地震发生时在熊本县八代市观测到了最大约84厘米、在熊本市观测到了最大约40厘米的地壳变动。</p>

<p>　　这些数值均为初步数据，今后可能会因进一步分析而进行修改。国土地理院指出，“84厘米可以说是相当大的地壳变动”。</p>

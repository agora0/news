    <h1 class="post-title p-name" itemprop="name headline">日官房长官表示欲提升日美同盟高度</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-07-03T21:01:07+08:00" itemprop="datePublished">Jul 3, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <figure class="article-header-img-main">
    <img src="https://china-kyodo.ismcdn.jp/mwimgs/9/6/635m/img_96a128d259d8dd087dac994ae89b0af4374908.jpg" loading="eager" srcset="https://china-kyodo.ismcdn.jp/mwimgs/9/6/635m/img_96a128d259d8dd087dac994ae89b0af4374908.jpg 1x,https://china-kyodo.ismcdn.jp/mwimgs/9/6/1270m/img_96a128d259d8dd087dac994ae89b0af4374908.jpg 2x" width="635" "356" class="" alt="" referrerpolicy="no-referrer">
    <figcaption class="article-header-img-main__caption">日本官房长官木原稔举行记者会。7月3日下午摄于首相官邸。（共同社）</figcaption>
  </figure><div class="article-body__inner">
    
<p>　　【共同社7月3日电】日本官房长官木原稔在3日的记者会上就美国将于4日迎来建国250周年表示祝贺。他称：“向美国人民致以衷心的祝福。今后也将在所有层面展开紧密合作，争取推动日美同盟迈向更高水平。”</p>
<p>　　他同时强调：“在国际形势风云变幻、不确定性增加的情况下，牢固的同盟对于国际社会的和平与稳定不可或缺。”</p>

    <p>　　【共同社洛杉矶7月5日电】美职棒大联盟常规赛4日继续进行，洛杉矶道奇队的山本由伸在主场对阵圣迭戈教士队的比赛中首发上场，投7局，被击出3支安打无失分，10次夺三振，拿下本赛季第9胜（5败）。3日感到右上臂不舒服的大谷翔平没有上场。道奇队3比0胜出。</p>

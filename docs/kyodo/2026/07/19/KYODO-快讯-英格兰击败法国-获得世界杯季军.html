966da9b88de005325c811195696.jpg 2x&quot; width=&quot;635&quot; &quot;456&quot; class=&quot;article-header-img-main__img&quot; alt=&quot;&quot; referrerpolicy=&quot;no-referrer&quot;&gt; 世界杯季军赛法国队对阵英格兰队的上半场尾声，英格兰的萨卡攻入第二粒进球，也是球队第四球。7月18日摄于迈阿密。（共同社） &lt;img src=&quot;https://china-kyodo.ismcdn.jp/mwimgs/8/4/635m/img_8424db719bbc287b2b5492d0071ece43988098.jpg&quot; loading=&quot;eager&quot; srcset=&quot;https://china-kyodo.ismcdn.jp/mwimgs/8/4/635m/img_8424db719bbc287b2b5492d0071ece43988098.jpg 1x,https://china-kyodo.ismcdn.jp/mwimgs/8/4/1270m/img_8424db719bbc287b2b5492d0071ece43988098.jpg 2x&quot; width=&quot;635&quot; &quot;439&quot; class=&quot;article-header-img-main__img&quot; alt=&quot;&quot; referrerpolicy=&quot;no-referrer&quot;&gt; 世界杯季军赛下半场，英格兰队获得点球机会。萨卡（右）主罚命中，完成帽子戏法。7月18日摄于迈阿密。（共同社） &lt;img src=&quot;https://china-kyodo.ismcdn.jp/mwimgs/4/4/635m/img_4469f9612689f685ada90be440892c271179527.jpg&quot; loading=&quot;eager&quot; srcset=&quot;https://china-kyodo.ismcdn.jp/mwimgs/4/4/635m/img_4469f9612689f685ada90be440892c271179527.jpg 1x,https://china-kyodo.ismcdn.jp/mwimgs/4/4/1270m/img_4469f9612689f685ada90be440892c271179527.jpg 2x&quot; width=&quot;635&quot; &quot;453&quot; class=&quot;article-header-img-main__img&quot; alt=&quot;&quot; referrerpolicy=&quot;no-referrer&quot;&gt; 世界杯季军赛法国队对阵英格兰队的下半场，英格兰的萨卡（中央）攻入第三粒进球，上演帽子戏法后露出笑容。7月18日摄于迈阿密。（共同社） &lt;img src=&quot;https://china-kyodo.ismcdn.jp/mwimgs/d/e/635m/img_de186dddecc91a0988c4a6a9d1c933821203189.jpg&quot; loading=&quot;eager&quot; srcset=&quot;https://china-kyodo.ismcdn.jp/mwimgs/d/e/635m/img_de186dddecc91a0988c4a6a9d1c933821203189.jpg 1x,https://china-kyodo.ismcdn.jp/mwimgs/d/e/1270m/img_de186dddecc91a0988c4a6a9d1c933821203189.jpg 2x&quot; width=&quot;635&quot; &quot;433&quot; class=&quot;article-header-img-main__img&quot; alt=&quot;&quot; referrerpolicy=&quot;no-referrer&quot;&gt; 世界杯季军赛法国队对阵英格兰队的下半场，法国队的姆巴佩破门。7月18日摄于迈阿密。（共同社） 　　【共同社迈阿密7月18日电】美加墨世界杯季军赛18日（日本时间19日）在迈阿密体育场落幕，英格兰队6比4战胜法国队，获得本届世界杯季军。" />

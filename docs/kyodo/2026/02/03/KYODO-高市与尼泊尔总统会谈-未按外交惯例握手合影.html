  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">高市与尼泊尔总统会谈 未按外交惯例握手合影</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-02-03T20:45:00+08:00" itemprop="datePublished">Feb 3, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <div class="article-body__inner">
    <p>　　【共同社2月3日电】日本首相高市早苗3日在官邸与访日的尼泊尔总统鲍德尔举行会谈。鉴于今年正值两国建交70周年，双方确认了将进一步深化关系。会谈伊始，高市没有按照外交惯例进行握手合影。</p>

<p>　　在场媒体提醒握手，但高市展示了戴有简易护具的右手，工作人员表示没有握手安排。高市称自己在众院选举助选活动中，与支持者握手时弄伤了手部。</p>

    <div class="article-body__inner">
    <p>　　【共同社4月14日电】京都府警方14日称，对13日在京都府南丹市山林中发现的遗体进行司法解剖后，结果显示死因不详，现阶段尚无法确定。据称，推测死亡时间为3月下旬左右。警方还表示，遗体上没有锐器等造成的明显外伤。至于是否涉及事件或案件，将根据今后的调查结果作出判断。</p>

    <h1 class="post-title p-name" itemprop="name headline">中国外交部称一日本人闯入中国驻日大使馆</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-03-24T17:54:41+08:00" itemprop="datePublished">Mar 24, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <div class="article-body__inner">
    
<p>　　【共同社北京3月24日电】中国外交部发言人林剑24日在记者会上称，当天上午“一名自称为日本自卫队现役官员的不法之徒，翻墙强行闯入中国驻日本大使馆”。林剑称中方已提出强烈抗议，“要求日方立即彻查事件，严惩有关人员”。</p>
<p>　　林剑称该人“威胁要杀死中国外交人员”，批评称“严重威胁中方外交人员人身安全，性质影响极为恶劣”。</p>

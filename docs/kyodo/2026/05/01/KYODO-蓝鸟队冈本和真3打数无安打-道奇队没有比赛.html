    <h1 class="post-title p-name" itemprop="name headline">蓝鸟队冈本和真3打数无安打｜道奇队没有比赛</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-05-01T14:05:00+08:00" itemprop="datePublished">May 1, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <div class="article-body__inner">
    <p>　　【共同社明尼阿波利斯5月1日电】美职棒大联盟常规赛4月30日在各地举行比赛，多伦多蓝鸟队的冈本和真在明尼阿波利斯客场对阵明尼苏达双城队的比赛中以“第四棒·三垒”身份出场，成绩为3打数无安打，1次四坏球保送。蓝鸟队以1比7被逆转击败。</p>

<p>　　大谷翔平等人效力的洛杉矶道奇队以及村上宗隆效力的芝加哥白袜队当天均没有比赛。</p>

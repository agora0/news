  </div><div class="article-body__inner">
    <p>　　【共同社伦敦5月10日电】世界乒乓球团体锦标赛9日在伦敦举行半决赛，日本男队3比0战胜中华台北队，自2016年以来再次闯进决赛。</p>

<p>　　以夺冠为目标的日本女队3比0击败德国队，连续六届晋级决赛。男女项目10日的决赛均将上演日中对决。</p>

<p>　　中国在半决赛中，男队3比1击败法国队，力争七连冠的女队3比0战胜罗马尼亚队。</p>

    <h1 class="post-title p-name" itemprop="name headline">美航母“乔治·华盛顿”号驶离横须贺 或为保养后试航</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-05-10T14:28:00+08:00" itemprop="datePublished">May 10, 2026

  <div class="post-content e-content" itemprop="articleBody">

    <div class="article-header-img__list splide__list">
<div class="article-header-img__item splide__slide">
  <figure class="article-header-img-main --leafs">
    <img src="https://china-kyodo.ismcdn.jp/mwimgs/3/b/635m/img_3baaf9f6ba4fa1fb538fe414242553f8892290.jpg" loading="eager" srcset="https://china-kyodo.ismcdn.jp/mwimgs/3/b/635m/img_3baaf9f6ba4fa1fb538fe414242553f8892290.jpg 1x,https://china-kyodo.ismcdn.jp/mwimgs/3/b/1270m/img_3baaf9f6ba4fa1fb538fe414242553f8892290.jpg 2x" width="635" "393" class="article-header-img-main__img" alt="" referrerpolicy="no-referrer">

<div class="article-header-img__item splide__slide">

    <img src="https://china-kyodo.ismcdn.jp/mwimgs/a/2/635m/img_a2b561d8c3a257f25a4a54dab276b8f9761145.jpg" loading="eager" srcset="https://china-kyodo.ismcdn.jp/mwimgs/a/2/635m/img_a2b561d8c3a257f25a4a54dab276b8f9761145.jpg 1x,https://china-kyodo.ismcdn.jp/mwimgs/a/2/1270m/img_a2b561d8c3a257f25a4a54dab276b8f9761145.jpg 2x" width="635" "386" class="article-header-img-main__img" alt="" referrerpolicy="no-referrer">
    <figcaption class="article-header-img-main__caption">图为在韩国济州岛以南的东海航行的美国海军核动力航母“乔治·华盛顿”号。摄于2024年11月。（共同社）</figcaption>
  </figure>

    </div>
  </div><div class="article-body__inner">
    <p>　　【共同社5月10日电】部署在美海军横须贺基地（神奈川县横须贺市）的核动力航母“乔治·华盛顿”号10日驶离基地。横须贺市发布了该消息。此次离港可能是为维修保养后进行试航。</p>

<p>　　“乔治·华盛顿”号在完成任务后于2025年12月返回横须贺基地进行保养。去年执行任务期间的10月停靠该基地时，日本首相高市早苗与访日的美国总统特朗曾登舰。</p>

  </div>

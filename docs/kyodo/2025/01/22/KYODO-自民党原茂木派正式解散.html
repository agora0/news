    <h1 class="post-title p-name" itemprop="name headline">自民党原茂木派正式解散</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-01-22T14:42:01+08:00" itemprop="datePublished">Jan 22, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <div>
                    <p>【共同社1月22日电】据相关人士22日透露，日本自民党原茂木派（平成研究会）已向总务相提交作为政治团体的解散申请并正式解散。提交日期为去年12月27日。这是继原岸田派、原森山派后，第三个解散的自民党派系。受派系收回扣事件影响，茂木派去年4月决定了撤销政治团体的方针。</p>
								<p>原茂木派源自前首相竹下登创立的“经世会”。2021年起，前干事长茂木敏充担任会长。（完）</p>

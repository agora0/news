    <h1 class="post-title p-name" itemprop="name headline">大谷翔平贡献好投和第35轰 道奇队终结三连败</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-07-22T19:42:03+08:00" itemprop="datePublished">Jul 22, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <div>
                    <p>【共同社洛杉矶7月22日电】美职棒大联盟常规赛21日在各地举行。洛杉矶道奇队主场迎战明尼苏达双城队，日籍球员大谷翔平担任&ldquo;第二棒&middot;投手兼指定打击&rdquo;。</p>
<p>作为击球员，他在第一局挥出2分本垒打，赛季本垒打数增至35支，且连续3场比赛开轰。本场击球成绩为4打数1安打2打点。</p>

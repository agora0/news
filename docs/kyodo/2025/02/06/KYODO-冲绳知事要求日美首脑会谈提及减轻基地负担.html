    <h1 class="post-title p-name" itemprop="name headline">冲绳知事要求日美首脑会谈提及减轻基地负担</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-02-06T19:12:02+08:00" itemprop="datePublished">Feb 6, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <div>
                    <p>【共同社2月6日电】日本冲绳县知事玉城丹尼6日在例行记者会上，就7日的日美首脑会谈期待称：“希望提及冲绳县要求减轻过于沉重的美军基地负担。”</p>
								<p>7成驻日美军专用设施集中在冲绳县内，去年以来接连曝出美军士兵性侵案。玉城表示：“为让日美同盟更加稳固，两国国民的理解不可或缺。希望切实（向美方）传达。”（完）</p>

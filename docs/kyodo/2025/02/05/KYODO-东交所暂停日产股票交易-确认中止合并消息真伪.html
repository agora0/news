  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">东交所暂停日产股票交易 确认中止合并消息真伪</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-02-05T15:42:02+08:00" itemprop="datePublished">Feb 5, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <div>
                    <p>【共同社2月5日电】东京证券交易所5日一度暂停了日产汽车股票交易。一部分媒体报道称日产将撤回与本田的经营合并基本协议，东交所因此采取了措施。</p>
								<p>下午2点49分，东交所以“将确认消息真伪”为由，暂停了日产股票的交易。</p>
								<p>去年12月，本田与日产宣布启动经营合并磋商。原本计划大致在今年1月底敲定大方向，但事实上已推迟做出判断。（完）</p>

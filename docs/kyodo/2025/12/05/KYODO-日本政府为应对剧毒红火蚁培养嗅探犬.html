  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">日本政府为应对剧毒红火蚁培养嗅探犬</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-12-05T19:12:04+08:00" itemprop="datePublished">Dec 5, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <div>
                    <p>【共同社12月5日电】在原产南美毒性很强的红火蚁入侵日本案例确认数创下史上最高纪录的情况下，环境省着手尝试培养通过气味发现红火蚁的&ldquo;嗅探犬&rdquo;。这种方法对栖居地下、肉眼难以看见的红火蚁有效，有望提高防除效率。2025年度内开始制作&ldquo;培养手册&rdquo;，为正式利用嗅探犬做准备。</p>

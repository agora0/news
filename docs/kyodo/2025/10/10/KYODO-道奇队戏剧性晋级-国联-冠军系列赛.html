  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">道奇队戏剧性晋级“国联”冠军系列赛</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-10-10T13:42:03+08:00" itemprop="datePublished">Oct 10, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <div>
                    <p>【共同社洛杉矶10月10日电】美职棒大联盟季后赛9日在洛杉矶举行的&ldquo;国家联盟&rdquo;分区系列赛（五战三胜制）第四战中，日籍球员大谷翔平、山本由伸和佐佐木朗希效力的洛杉矶道奇队在延长赛第11局以2比1战胜费城费城人队。去年&ldquo;世界大赛&rdquo;总冠军道奇队凭借3胜1负的战绩，连续两年晋级联盟冠军系列赛。</p>

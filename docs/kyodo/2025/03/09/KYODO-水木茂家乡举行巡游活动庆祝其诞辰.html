  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">水木茂家乡举行巡游活动庆祝其诞辰</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-03-09T17:42:03+08:00" itemprop="datePublished">Mar 9, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <div>
                    <p>【共同社3月9日电】《怪怪怪的鬼太郎》的作者、已故漫画家水木茂家乡日本鸟取县境港市9日举行了庆祝其诞辰103周年的巡游活动。喜欢妖怪的人气儿童演员永尾柚乃（8岁）也穿着猫女的衣服参加巡游。</p>
								<p>永尾和扮成鬼太郎和鼠男等的参加者走过市内景点“水木茂之路”，始终满脸笑容。她表示“非常开心”。</p>
								<p>展示水木作品的“水木茂纪念馆”举行了与角色的合影活动等。（完）</p>

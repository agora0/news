    <h1 class="post-title p-name" itemprop="name headline">航空自卫队一架F-2战机在茨城县近海坠落</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-08-07T16:42:02+08:00" itemprop="datePublished">Aug 7, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <div>
                    <p>【共同社8月7日电】7日中午12点半前后，一架日本航空自卫队的F-2战机在茨城县附近的太平洋坠落。机上有一名飞行员，但所幸平安逃出。据称当时正在开展飞行训练，空自在调查当时的情况，并对飞机进行搜索。</p>
								<p>据空自称，坠落的飞机隶属于百里基地（茨城县）。（完）</p>

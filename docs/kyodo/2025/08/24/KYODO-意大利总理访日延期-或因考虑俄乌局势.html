    <h1 class="post-title p-name" itemprop="name headline">意大利总理访日延期 或因考虑俄乌局势</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-08-24T19:42:02+08:00" itemprop="datePublished">Aug 24, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <div>
                    <p>【共同社罗马8月24日电】意大利政府相关人士23日透露，总理梅洛尼原定本月底至9月上旬对日本等亚洲各国的访问计划被推迟。据分析，可能是因为考虑到美国特朗普政府协调与俄罗斯、乌克兰举行首脑会谈等局势的变化。</p>
<p>据意大利总理府消息，梅洛尼原定访问日本、韩国、越南等五国，计划9月7～8日到访日本。除了参观大阪&middot;关西世博会，还在协调与首相石破茂的会谈。（完）</p>

    <h1 class="post-title p-name" itemprop="name headline">北海道函馆港内巨型圣诞树开始亮灯</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-11-30T11:42:04+08:00" itemprop="datePublished">Nov 30, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <div>
                    <p>【共同社11月30日电】29日晚在日本北海道函館市的红砖仓库前，高约20米的圣诞树开始亮灯。圣诞树设置在函馆港内的驳船上。约15万个LED灯泡闪烁着红色或绿色的光芒，到场观看的人们发出阵阵欢呼。</p>
								<p>亮灯活动持续至12月25日，每天傍晚至夜间实施，还会燃放烟花。（完）</p>

    <h1 class="post-title p-name" itemprop="name headline">道奇队主帅称大谷等是否出战WBC取决于本人意愿</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-11-21T17:12:02+08:00" itemprop="datePublished">Nov 21, 2025
      </time></p>

  <div class="post-content e-content" itemprop="articleBody">
    <div>
                    <p>【共同社11月21日電】美職棒大聯盟洛杉磯道奇隊主帥羅伯茨19日就隊內大谷翔平、山本由伸和佐佐木朗希3名日籍球員是否出戰明春的世界棒球經典賽（WBC）一事表示：「投手參賽會給身體帶來負擔，但（是否出戰）由他們自己決定。若決定參加，將全力支持。」</p>

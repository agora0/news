  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">日本男足新一期大名单久保上田入选 本月迎两场热身赛</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2025-11-06T18:42:04+08:00" itemprop="datePublished">Nov 6, 2025
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <div>
                    <p>【共同社11月6日电】日本足协6日公布了新一期男足26人大名单，久保建英、上田绮世入选，三笘薰缺阵。小久保玲央-布莱恩（门将）以及后藤启介、北野飒太首次入选。日本国家队14日将在丰田体育场对阵加纳，18日在国立竞技场迎战玻利维亚。两场热身赛将是今年最后的活动。</p>

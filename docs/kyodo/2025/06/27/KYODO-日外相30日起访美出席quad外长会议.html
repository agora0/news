  <div class="post-content e-content" itemprop="articleBody">
    <div>
                    <p>【共同社6月27日电】日本外相岩屋毅27日在记者会上宣布本月30日起将对美国进行访问，并出席7月1日在华盛顿召开的日本、美国、澳大利亚、印度&ldquo;四边机制&rdquo;（Quad）外长会议。岩屋表示：&ldquo;将战略性地坦诚交换意见。希望借此机会向国际社会展示四国对印度太平洋地区的大力参与。&rdquo;</p>
<p>岩屋计划在访美期间举行日美外长会谈，目前还在协调与印澳两国外长的会谈。（完）</p>

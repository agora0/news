                    <p>【共同社圣路易斯6月9日电】美国职棒大联盟比赛8日在各地举行，洛杉矶道奇队日籍球员大谷翔平在圣路易斯迎战红雀队，作为&ldquo;1号指名击球员&rdquo;上场，在第一局击出二垒打，连续5场比赛轰出安打。大谷的成绩为4打数1支安打，道奇队最终7比3获胜。</p>

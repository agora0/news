    <h1 class="post-title p-name" itemprop="name headline">日美韩将举行首脑会谈 或磋商三边合作制度化</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2024-11-14T11:42:02+08:00" itemprop="datePublished">Nov 14, 2024
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <div>
                    <p>【共同社华盛顿11月13日电】美国总统助理沙利文13日在记者会上透露，日美韩将借15至16日召开亚太经合组织（APEC）首脑会议之机举行三国首脑会谈。预计将着眼于明年1月特朗普新政府上台，磋商三边合作制度化。</p>
								<p>沙利文指出，日美为威慑推进核与导弹开发的朝鲜而加强的合作“具有历史意义”。美国总统拜登、日本首相石破茂、韩国总统尹锡悦将出席。（完）</p>

    <p class="post-meta">
      <time class="dt-published" datetime="2026-05-14T20:36:41+08:00" itemprop="datePublished">May 14, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p class="t-content__chapo">
                        俄罗斯总统新闻秘书佩斯科夫周四表示，克里姆林宫将很快宣布俄总统普京访问中国的日期。        </p><div class="t-content__main-media">

                                                                <p>佩斯科夫在谈到普京访华的时间安排和相关准备工作时说道：“我们很快就会公布具体安排。这次访问正在筹备中。可以说，各项准备工作和收尾工作都已经完成。访问很快就会进行”。</p> <p>佩斯科夫还告诉塔斯社记者称，俄方期待与中国领导人习近平进行独立接触，与美国总统特朗普访华无关。</p>

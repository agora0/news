  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">中方安保拒绝美特勤局特工携武器进入天坛 白宫记者团被延误近30分钟</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-05-14T16:50:37+08:00" itemprop="datePublished">May 14, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p class="t-content__chapo">
                        据白宫随行记者报导，由于中国安全官员拒绝一名陪同记者的美国特勤局特工携带武器进入天坛，特朗普的记者团行程被耽搁了近30分钟。经过美中官员的激烈磋商，双方最终达成妥协，之后白宫记者团进入了天坛。        </p><div class="t-content__main-media">

                                                                <p>周四，白宫随行记者目睹了数次激烈的言语冲突，包括在两国领导人参观天坛前后，中方安保人员曾多次试图阻止美国记者和工作人员重返特朗普的车队。</p>

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">欧盟对从中国进口的聚酰胺纱线征收临时反倾销税</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-07-28T18:34:33+08:00" itemprop="datePublished">Jul 28, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p class="t-content__chapo">
                        为保护欧盟生产商，欧盟已开始对中国产聚酰胺纱线征收临时反倾销税。欧盟委员会周二在一份声明中表示，经调查，相关税率定在60%至67.5%之间。声明指出，欧盟聚酰胺纱线市场——该产品用于纺织行业——价值4亿欧元，该行业雇用了2000名员工。        </p><div class="t-content__main-media">

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">马朝旭预计下周访美 或为习近平访问华盛顿铺垫</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-07-16T21:54:11+08:00" itemprop="datePublished">Jul 16, 2026
      </time></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p class="t-content__chapo">
                        据《南华早报》报导，中国外交部副部长马朝旭预计将于下周访问美国；此行很可能是为中国国家主席习近平今年晚些时候访问华盛顿进行铺垫。        </p><div class="t-content__main-media">

                                                                <p>知情人士向该报透露，在负责处理中美关系方面发挥重要作用的马朝旭将于下周抵达华盛顿。据称，行程中还可能包括访问迈阿密——该市是今年12月二十国集团（G20）峰会的举办地。</p>
